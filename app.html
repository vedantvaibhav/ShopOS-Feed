<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jammie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/jammie/v3/jammie.css?v=10">
<style>
/* screens only: every token and shared piece comes from jammie.css */
body{padding-left:60px;min-height:100vh;overflow-x:hidden}
body.bare{padding-left:0}
body.bare .rail,body.bare .fab{display:none}
a{text-decoration:none}

/* ---------- onboarding: one column, centred. Jammie, one thought, one control ---------- */
.h1{font-size:calc(var(--h-size) * .8);line-height:1.08}
.h2{font-size:calc(var(--h-size) * .58);line-height:1.12}
.lead{height:150px;width:auto;filter:drop-shadow(0 14px 10px rgba(0,0,0,.14))}
.dots{position:absolute;top:28px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.dots i{width:20px;height:4px;border-radius:4px;background:var(--s3)}
.dots i.on{background:var(--on)}
.dots i.now{animation:fill .5s var(--ease) both;transform-origin:left}
.onb{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:76px 24px 44px;text-align:center}
.brandmark{position:absolute;left:28px;top:20px;display:flex;align-items:center;gap:7px;color:var(--jam);font-weight:800;font-size:19px;letter-spacing:-.03em}
.brandmark img{height:28px}
.onb-art{position:relative;display:grid;place-items:center}
.onb-art .lead{height:min(240px,27vh)}
.onb-body{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
.onb-body .h1,.onb-body .h2{max-width:18ch}
.pop{position:relative;animation:pop .7s var(--ease) both}   /* Jammie arrives by fading up a little. It never grows */
.bob{position:relative;animation:bob 3.4s ease-in-out .8s infinite}
.land{animation:land .9s cubic-bezier(.2,.9,.25,1.12) both}
.land::before{content:"";position:absolute;inset:0;z-index:5;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:shine 1.1s .5s ease-out both;pointer-events:none}
.onb-body > *{animation:rise .65s var(--ease) both}
.onb-body > *:nth-child(2){animation-delay:.1s}
.onb-body > *:nth-child(3){animation-delay:.2s}
.onb-body > *:nth-child(4){animation-delay:.3s}
.curtain{position:fixed;inset:0;z-index:60;background:var(--jam);clip-path:circle(0% at var(--cx,50%) var(--cy,50%));animation:bloom .5s cubic-bezier(.6,0,.3,1) forwards}
.curtain.lift{clip-path:none;animation:lift .6s cubic-bezier(.6,0,.2,1) forwards}
.curtain img{position:absolute;left:50%;top:50%;height:120px;transform:translate(-50%,-50%);filter:brightness(0) invert(1);opacity:.9}
@keyframes pop{from{opacity:0;transform:translateY(16px)}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes land{from{opacity:0;transform:translateY(70px) rotate(-4deg) scale(.9)}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes bloom{to{clip-path:circle(150% at var(--cx,50%) var(--cy,50%))}}
@keyframes lift{to{transform:translateY(-100%)}}
.feed.arrive .slide.at .fcard{animation:land .9s .25s cubic-bezier(.2,.9,.25,1.1) both}
.feed.arrive .stories .story{animation:rise .5s both}
.feed.arrive .slide.at .acts > *{animation:rise .45s both}
@media (prefers-reduced-motion:reduce){.pop,.bob,.land,.in3d,.slide-in,.slide-out,.curtain,.onb-body > *,.feed.arrive *{animation:none!important}}
/* Jammie moves: a short loop on white, laid onto the page */
.pop.v{mix-blend-mode:multiply}
.pop.v img{display:none}
.onb-art .pop.v video.lead{display:block;height:min(300px,32vh);aspect-ratio:1;object-fit:cover;filter:none}
.onb.small .onb-art .pop.v video.lead{height:min(190px,21vh)}
.onb.small .onb-art .lead{height:min(150px,17vh)}
html[data-theme="dark"] .pop.v{mix-blend-mode:normal}
html[data-theme="dark"] .pop.v video{display:none!important}
html[data-theme="dark"] .pop.v img{display:block}
/* sign-in is a popup over the first screen: Google, or a name and an email */
.gate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.36);backdrop-filter:blur(3px);animation:fade .25s}
.gate-card{position:relative;width:min(390px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:22px 28px 26px;text-align:center;display:grid;justify-items:center;gap:12px;animation:gate-in .55s cubic-bezier(.2,.9,.25,1.1) both;scrollbar-width:none}
@keyframes gate-in{from{opacity:0;transform:translateY(28px) scale(.94)}}
.gate-card .pop.v video.lead{display:block;height:150px;aspect-ratio:1;object-fit:cover;filter:none}
.gate-card .lead{height:120px}
.gate-card h2{font-size:24px;line-height:1.14}
.gate-card .btn{width:100%}
.gate-card form{display:grid;gap:8px;width:100%}
.gate-card .input{padding:11px 14px;text-align:left}
.or{display:flex;align-items:center;gap:10px;width:100%;color:var(--fg-3);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.store{display:flex;align-items:center;gap:10px;width:min(500px,100%);height:56px;padding:0 7px 0 20px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card)}
.store:focus-within{border-color:var(--on-line)}
.store input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font:inherit;font-size:16px}
.store .btn{border-radius:var(--r-pill);height:42px}
.store > [data-ico]{color:var(--fg-2)}
/* reading the store: its pictures land one by one, one line says what was found */
.read{display:grid;justify-items:center;gap:16px;width:min(388px,100%)}
.read-tiles{display:flex;gap:8px}
.read-tiles i{position:relative;width:58px;height:58px;border-radius:14px;background:var(--s2);overflow:hidden}
.read-tiles i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);animation:shimmer 1.3s linear infinite}
.read-tiles i.in::after{display:none}
.read-tiles img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(.6);transition:opacity .35s,transform .55s cubic-bezier(.34,1.56,.64,1)}
.read-tiles i.in img{opacity:1;transform:none}
.read-bar{width:100%;height:5px;border-radius:5px;background:var(--s3);overflow:hidden}
.read-bar b{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--jam) 78%,#fff),var(--jam-2));transition:width 1s var(--ease)}
.read-line{margin:0;min-height:1.5em;font-size:16px;color:var(--fg-2)}
.read-line b{color:var(--fg);font-weight:600}
.read-line.swap{animation:rise .4s var(--ease) both}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* three taps: every pick shows up on Jammie, or lands beside it */
.tapstage{display:flex;align-items:center;justify-content:center;gap:10px;height:min(250px,28vh)}
.tapstage .slot{width:132px;height:100%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px}
.tapstage .slot img{height:min(84px,10vh);width:auto;filter:drop-shadow(0 10px 8px rgba(0,0,0,.14))}
.tapstage .slot.many img{height:min(56px,7vh)}
.tapstage .me{height:100%;min-width:190px;display:grid;place-items:center}
.tapstage .me .lead{height:min(232px,26vh)}
.tapstage .me .pop.v video.lead{height:min(250px,28vh)}
.tapstage .me > *{grid-area:1/1}
.slide-in{animation:slide-in .48s var(--ease) both}
.slide-out{animation:slide-out .48s var(--ease) both}
@keyframes slide-in{from{opacity:0;transform:translateX(84px)}}
@keyframes slide-out{to{opacity:0;transform:translateX(-84px)}}
.in3d{animation:in3d .85s cubic-bezier(.2,.9,.25,1.1) both,sway3d 6s ease-in-out .85s infinite}
@keyframes in3d{0%{opacity:0;transform:perspective(500px) translateY(30px) rotateY(-80deg) rotateX(18deg) scale(.8)}60%{opacity:1;transform:perspective(500px) translateY(-5px) rotateY(14deg) rotateX(-3deg) scale(1.03)}100%{opacity:1;transform:perspective(500px) rotateY(0) scale(1)}}
@keyframes sway3d{0%,100%{transform:perspective(500px) rotateY(0)}25%{transform:perspective(500px) rotateY(14deg)}75%{transform:perspective(500px) rotateY(-14deg)}}
.asks{display:grid;gap:16px;width:min(560px,100%)}
.asks h4{font-size:14px;font-weight:600;letter-spacing:0;margin-bottom:8px}
.asks .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
/* from a laptop up, three taps is two sides: Jammie at full size, the questions beside it */
@media (min-width:1061px){
  .onb.split{flex-direction:row;gap:clamp(24px,5vw,84px)}
  .onb.split .onb-body{width:min(430px,100%);align-items:flex-start;text-align:left}
  .onb.split .asks{width:100%;gap:20px}
  .onb.split .asks .chips{justify-content:flex-start}
  .onb.split .tapstage{height:min(440px,52vh);gap:4px}
  .onb.split .tapstage .slot{width:150px}
  .onb.split .tapstage .slot img{height:min(104px,12vh)}
  .onb.split .tapstage .slot.many img{height:min(80px,9.5vh)}
  .onb.split .tapstage .me{min-width:290px}
  .onb.split .tapstage .me .lead{height:min(400px,47vh)}
  .onb.split .tapstage .me .pop.v video.lead{height:min(440px,52vh)}
}
/* hey, here it is: everything Jammie read, as one big card you walk in through */
.brandcard{position:relative;width:min(880px,100%);display:grid;grid-template-columns:1.12fr 1fr;border:1px solid var(--line-soft);border-radius:calc(var(--r-card) + 6px);background:var(--card);overflow:hidden;text-align:left}
.bc-pics{display:grid;grid-template-columns:3fr 2fr;grid-template-rows:1fr 1fr;gap:3px;height:min(400px,44vh)}
.bc-pics img{width:100%;height:100%;object-fit:cover;min-height:0}
.bc-pics img:first-child{grid-row:1/3}
.bc-body{display:grid;align-content:center;justify-items:start;gap:22px;padding:28px 32px}
.bc-top{display:grid;gap:12px}
.bc-top b{font-size:46px;font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:1}
.bc-top .swatches i{width:24px;height:24px}
.bc-stats{display:flex;gap:28px}
.bc-stats span{font-size:14px;color:var(--fg-2)}
.bc-stats b{display:block;font-size:32px;font-weight:var(--h-weight);letter-spacing:var(--h-track);color:var(--fg);line-height:1.15}
.todo{padding:0;margin:0}
.gbtn{gap:10px}
.gbtn svg{width:18px;height:18px}
.swatches{display:flex;gap:6px}
.swatches i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.pair{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.book{position:relative;flex:none;width:220px;aspect-ratio:3/4;border-radius:6px 14px 14px 6px;background:#2B50E0;color:#fff;padding:18px;text-align:left;box-shadow:var(--shadow-3),inset 6px 0 0 rgba(0,0,0,.14);transform:rotate(-3deg)}
.book small{font-size:11px;font-weight:600;opacity:.8}
.book b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.book p{font-size:12.5px;line-height:1.35;margin:6px 0 0;opacity:.9}
.book img{position:absolute;right:-18px;bottom:16px;width:58%;border-radius:8px;border:3px solid #fff;box-shadow:var(--shadow-2);transform:rotate(6deg)}

/* ---------- the feed ---------- */
/* stories start where the card starts; the cards below are a real scroll, one card a stop */
.feed{--side-w:min(440px,100vw);--col-w:calc(var(--fc-h) * .8 + 62px);position:relative;height:100vh;display:flex;flex-direction:column;padding-top:max(0px,calc((100vh - var(--fc-h) - 128px) / 2))}
.stories-row{flex:none;display:flex;justify-content:center;padding:14px 92px 14px}
.stories{display:flex;gap:16px;width:var(--col-w);max-width:100%;overflow-x:auto;scrollbar-width:none}
.story{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;color:var(--fg-2)}
.story i{width:64px;height:64px;border-radius:50%;padding:3px;background:var(--jam);display:block}
.story.seen i{background:var(--line)}
.story i b{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);background:var(--s2) center/cover}
.stage{flex:1;min-height:0;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:flex-start;justify-content:center;padding:0 92px}
.feed-col{display:flex;align-items:flex-start;gap:10px;min-width:0;justify-content:center}
.feed-col .acts{height:var(--fc-h);justify-content:flex-end}
.feed:has(.side) .slide,.feed:has(.side) .stories-row{padding-left:24px;padding-right:24px}
.feed:has(.side) .stage,.feed:has(.scrim) .stage{overflow:hidden}
.feed:has(.side) .feed-nav,.feed:has(.side) .corner{display:none}
body:has(.side) .fab{display:none}
.feed-nav{position:absolute;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
/* the two round buttons top right are one shape, one size, one colour */
.corner{position:absolute;top:14px;right:20px;display:flex;align-items:center;gap:8px}
.corner .ico-btn,.page-h .ico-btn,.deck-h .ico-btn{width:40px;height:40px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.corner .ico-btn:hover,.page-h .ico-btn:hover,.deck-h .ico-btn:hover{background:var(--s2)}
.team{position:absolute;left:24px;top:16px;height:36px;padding:0 12px 0 5px;border-radius:99px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:inherit}
.team:hover{box-shadow:var(--shadow-1)}
.team .stack{width:28px;height:28px}
.team .stack i{border-width:1.5px;border-radius:8px}
.team em{font-style:normal;color:var(--jam)}
.logo-pic{flex:none;width:36px;height:36px;object-fit:contain}
.msg{display:flex;align-items:center;gap:14px;padding:11px 0}
.msg img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--card)}
.msg span{flex:1;min-width:0}
.msg b{display:block;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg small{display:block;font-size:14px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg em{flex:none;font-style:normal;font-size:13px;color:var(--fg-2)}
.feed.has-panel .feed-nav{display:none}
@keyframes in-down{from{opacity:0;transform:translateY(32px)}}
@keyframes in-up{from{opacity:0;transform:translateY(-32px)}}
.fab{position:fixed;right:24px;bottom:20px;z-index:12;height:46px;padding:0 16px 0 6px;border-radius:99px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-2);display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:inherit}
.fab:hover{box-shadow:var(--shadow-3)}
.fab img{height:34px;width:auto}

/* ---------- side panel: the page steps aside as a sheet with round corners, and the panel sits on the floor beside it ---------- */
body:has(.side){background:var(--floor)}
.feed:has(.side){margin-right:var(--side-w);background:var(--bg);border-radius:0 28px 28px 0;overflow:hidden;box-shadow:0 0 0 1px var(--line-soft),10px 0 34px rgba(0,0,0,.05)}
.feed.opening{animation:sheet-in .45s var(--ease)}
.feed.opening .side{animation:fade .5s .12s both}
@keyframes sheet-in{from{margin-right:0;border-radius:0}}
.side{position:fixed;top:0;right:0;bottom:0;z-index:5;width:var(--side-w);padding:24px 26px;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin}
.side > *{flex:none}
.side .opt > i,.side .cap{background:var(--card)}
.side > .who{padding-right:40px;flex-wrap:wrap}
.side h2{font-size:21px;font-weight:600;line-height:1.18;margin:4px 40px 8px 0}
.side .sub{color:var(--fg-2);font-size:14px;margin:0 0 16px}
.side h4{font-size:13px;margin:18px 0 8px;color:var(--fg-2);font-weight:600;letter-spacing:0}
.side p{margin:0;font-size:14.5px}
.x{position:absolute;top:16px;right:16px}
.cap{border:1px solid var(--line-soft);border-radius:12px;padding:12px;font-size:14px;display:grid;gap:8px}
.side .chips{display:flex;gap:6px;flex-wrap:wrap}
.side .chip{height:32px;padding:0 12px;font-size:13px}
.side-foot{position:sticky;bottom:-24px;margin:auto -26px -24px;padding:12px 26px;background:var(--floor);border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:6px}
.side-foot .btn{margin-left:auto}
.side > :nth-last-child(2){margin-bottom:18px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px 4px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;color:inherit}
.opt:last-of-type{border-bottom:0}
.opt:hover b{text-decoration:underline;text-underline-offset:3px}
.opt > i{width:34px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center;flex:none}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--fg-2);font-size:13.5px;line-height:1.35}
.note{position:relative;margin:4px 0 12px}
.note textarea{width:100%;min-height:120px;border:1px solid var(--fg-3);border-radius:14px;padding:12px 14px;font:inherit;color:var(--fg);background:var(--card);resize:vertical;outline:none}
.note textarea:focus{border-color:var(--on-line);box-shadow:inset 0 0 0 1px var(--on-line)}
.note .mic{position:absolute;right:10px;bottom:14px}

/* ---------- story viewer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:grid;place-items:center;padding:24px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sview{width:min(430px,100%);max-height:calc(100vh - 40px);overflow-y:auto;padding:16px 18px 18px;animation:in-down .4s var(--ease)}
.segs{display:flex;gap:4px;margin-bottom:12px}
.segs i{flex:1;height:3px;border-radius:3px;background:var(--s3)}
.segs i.on{background:var(--on)}
.sview-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:600;font-size:14px}
.sview-h .ico-btn{width:32px;height:32px}
.sview img.pic{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}
.sview h2{font-size:22px;line-height:1.15;margin:8px 0}
.sview .btn{width:100%;margin-top:14px}

/* ---------- pages ---------- */
.page{max-width:1040px;margin:0 auto;padding:0 32px 90px}
.page.wide{max-width:none}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:16px;height:62px;margin-bottom:10px}
.page-h h1{font-size:19px;font-weight:600;letter-spacing:0}
.page-h .right{display:flex;align-items:center;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.sec-t{font-size:18px;margin:24px 0 12px}
.hello{display:flex;align-items:center;gap:12px;margin:2px 0 18px;font-size:16.5px}
.hello img{height:52px;width:auto}

/* command centre: a deck. Every column is the same width, runs the full height and scrolls on its own */
.deck{height:100vh;display:flex;flex-direction:column}
.deck-h{flex:none;display:flex;align-items:center;gap:20px;height:64px;padding:0 20px 0 24px;border-bottom:1px solid var(--line-soft)}
.deck-h h1{font-size:19px;font-weight:600;letter-spacing:0}
.deck-tabs{display:flex;gap:4px;margin-right:auto;overflow-x:auto;scrollbar-width:none}
.deck-tabs button{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:0;border-radius:var(--r-pill);background:none;font-size:13.5px;color:var(--fg-2)}
.deck-tabs button:hover{background:var(--s2);color:var(--fg)}
.deck-tabs i,.dcol-h i{width:7px;height:7px;border-radius:50%;background:var(--s3);flex:none}
.deck-tabs i.need,.dcol-h i.need{background:var(--jam)}
.deck-h .right{display:flex;gap:8px}
.deck-cols{flex:1;min-height:0;display:flex;overflow-x:auto;scrollbar-width:thin}
.dcol{flex:none;width:340px;display:flex;flex-direction:column;border-right:1px solid var(--line-soft)}
.dcol-h{flex:none;display:flex;align-items:center;gap:9px;height:52px;padding:0 20px;font-weight:600;font-size:15.5px;border-bottom:1px solid var(--line-soft)}
.dcol-h small{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--fg-3)}
.dcol-h small.need{color:var(--jam);font-weight:600}
.dcol-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.dcard{padding:18px 20px 16px;border-bottom:1px solid var(--line-soft)}
.dcard.need{box-shadow:inset 3px 0 0 var(--jam)}
.dcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--fg-2)}
.dcard .top em{font-style:normal;font-size:12px;color:var(--fg-3)}
.dcard .top em.need{color:var(--jam);font-weight:600}
.dcard .big{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.dcard .big b{font-size:30px;font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:1.1}
.dcard .line{margin:4px 0 0;font-size:13.5px;line-height:1.4;color:var(--fg-2)}
.bars{display:flex;align-items:flex-end;gap:4px;height:44px;margin:14px 0 2px}
.bars i{flex:1;border-radius:3px 3px 1px 1px;background:var(--s3)}
.bars i.hi{background:var(--on)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini button{border:0;background:none;padding:0;text-align:left;color:inherit}
.mini small{display:block;font-size:12px;color:var(--fg-2)}
.mini b{display:block;font-size:15px;font-weight:600}
.dcard .foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin-top:14px}
.dcard .foot button{border:0;background:none;padding:0;font-size:13px;font-weight:500;color:var(--fg-2)}
.dcard .foot button:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.dcard .foot .btn{height:30px;padding:0 12px;font-size:13px;margin-left:auto}

/* what we learned */
.learn{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ltile{border:1px solid var(--line-soft);border-radius:16px;background:var(--card);padding:14px;text-align:left;color:inherit;display:block}
.ltile:hover{border-color:var(--line)}
.ltile b{display:block;font-size:24px;font-weight:var(--h-weight);line-height:1.1}
.ltile b.t{font-size:15.5px;font-weight:600}
.ltile small{display:block;color:var(--fg-2);font-size:13px;margin-top:3px}


.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:grid;gap:8px;pointer-events:none}
.toasts .toast{animation:toast 2.6s var(--ease) forwards}
html.still *{animation-duration:0s!important;animation-delay:0s!important}
html.still ::-webkit-scrollbar{display:none}

/* ---------- phone ---------- */
@media (max-width:860px){
  body{padding-left:0;padding-bottom:58px}
  body.bare{padding-bottom:0}
  .rail{inset:auto 0 0 0;width:auto;height:58px;flex-direction:row;padding:0 8px;border-right:0;border-top:1px solid var(--line-soft)}
  .rail .rail-brand{display:none}
  .rail-nav,.rail-nav.low{flex:1;flex-direction:row;margin:0;gap:0;justify-content:space-around}
  .feed{height:calc(100vh - 58px)}
  .feed{padding-top:0}
  .stories-row{padding:8px 10px 6px}
  .stories{gap:10px;width:100%}
  .story i{width:52px;height:52px}
  .story{font-size:11.5px}
  .slide,.feed:has(.side) .slide,.feed:has(.side) .stories-row{padding-left:10px;padding-right:10px}
  .fcard{width:100%}
  .fc-media{width:100%;height:calc(100vh - 176px);aspect-ratio:auto}
  .fc-over{flex-direction:column;align-items:flex-start;gap:10px;padding:60px 14px 14px}
  .fc-text h3{font-size:16.5px}
  .feed-col{position:relative;width:100%}
  .feed-col .acts{position:absolute;right:4px;top:8px;z-index:3;height:auto;justify-content:flex-start}
  .feed-col .act,.feed-col .age,.feed-col .act .ico,.feed-col .age .ico{color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .feed-nav,.corner{display:none}
  .team{display:none}
  .fab{bottom:70px;right:12px}
  body:has(.side){background:var(--bg)}
  .feed:has(.side){margin-right:0;border-radius:0;box-shadow:none;overflow:visible;animation:none}
  .side{inset:auto 0 0 0;width:auto;max-height:84vh;background:var(--card);box-shadow:var(--shadow-3);border-radius:var(--r-card) var(--r-card) 0 0;z-index:30;animation:in-down .42s var(--ease)!important}
  .side-foot{background:var(--card)}
  .side .opt > i{background:var(--s2)}
  .page{padding:0 16px 80px}
  .grid3,.tiles{grid-template-columns:1fr}
  .learn{grid-template-columns:1fr}
  .deck{height:calc(100vh - 58px)}
  .deck-tabs{display:none}
  .deck-h h1{margin-right:auto}
  .deck-cols{scroll-snap-type:x mandatory}
  .dcol{width:88vw;scroll-snap-align:start}
  .rail-nav a::after{display:none}
  .brandcard{grid-template-columns:1fr}
  .bc-pics{height:200px}
  .bc-body{padding:20px;gap:16px}
  .bc-top b{font-size:34px}
  .bc-stats b{font-size:24px}
  .onb{padding:64px 18px 32px;gap:16px}
  .onb-art .pop.v video.lead{height:200px}
  .tapstage{height:176px;gap:2px}
  .tapstage .slot{width:92px}
  .tapstage .slot img{height:58px}
  .tapstage .slot.many img{height:42px}
  .tapstage .me{min-width:128px}
  .tapstage .me .lead{height:164px}
  .tapstage .me .pop.v video.lead{height:176px}
  .read-tiles i{width:46px;height:46px;border-radius:12px}
}
</style>
</head>
<body>
<nav class="rail" aria-label="main">
  <a class="rail-brand" href="#/feed" aria-label="jammie"><img src="assets/jammie/v3/char-dollop.png" alt=""></a>
  <div class="rail-nav">
    <a class="draw" data-nav="feed" href="#/feed" aria-label="Feed"><i data-ico="home"></i></a>
    <a class="draw" data-nav="command" href="#/command" aria-label="Command centre"><i data-ico="chart"></i></a>
    <a class="draw" data-nav="bell" href="#/bell" aria-label="Updates"><i data-ico="bell"></i></a>
  </div>
  <div class="rail-nav low">
    <a class="draw" data-nav="learned" href="#/learned" aria-label="What we learned"><i data-ico="bookmark"></i></a>
    <a class="draw" data-nav="connectors" href="#/connectors" aria-label="Connectors"><i data-ico="link"></i></a>
    <a class="draw" data-nav="you" href="#/you" aria-label="You"><i data-ico="user"></i></a>
  </div>
</nav>
<a class="fab draw" href="#/new" aria-label="Start something new"><img src="assets/jammie/v3/pose-wave.png" alt="">New<i data-ico="plus"></i></a>
<main id="app"></main>
<div class="toasts" id="toasts"></div>

<script src="assets/jammie/v3/icons.js?v=10"></script>
<script src="assets/jammie/v3/data.js?v=10"></script>
<script>
(() => {
  const { A, D, IDEAS, real, av, fcard, icard, srow } = window.JAMMIE;
  const root = document.documentElement, app = document.getElementById('app');
  const STILL = new URLSearchParams(location.search).has('still');   // the flow map shows screens at rest
  if (STILL) root.classList.add('still');
  const ico = n => `<i data-ico="${n}"></i>`;

  // carry over whatever was tuned on the workbench
  try {
    const t = JSON.parse(localStorage.getItem('jammie-workbench-v5')) || {};
    root.dataset.theme = t.theme || 'light';
    Object.entries(t).forEach(([k, v]) => { if (k.startsWith('--')) root.style.setProperty(k, v); });
    Object.entries((t.themed && t.themed[root.dataset.theme]) || {}).forEach(([k, v]) => root.style.setProperty(k, v));
  } catch {}

  // ---- state: where we are in the feed, what was kept, what went to the team
  let cur = 0, timers = [], arriving = false;
  const store = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
  const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let liked = new Set(store('jammie-proto-liked', ['reviews']));
  let orders = STILL ? [{ id: 'reel', how: 'ship' }] : store('jammie-proto-orders', []);
  const HOW = { ship: ['With the team', 'Files land in your inbox'], change: ['With the team', 'They answer within 24 hours'], sloosh: ['Being made on Sloosh', 'About 4 minutes'], note: ['With the team', 'They answer within 24 hours'] };
  const idea = id => real.find(d => d.id === id) || real[0];
  function send(how, id){ orders = orders.filter(o => o.id !== id); orders.unshift({ id, how }); keep('jammie-proto-orders', orders); }

  function toast(text, pose = 'cheer'){
    const t = document.createElement('div'); t.className = 'toast';
    t.innerHTML = `<img src="${A}pose-${pose}.png" alt=""><span>${text}</span>`;
    document.getElementById('toasts').append(t); setTimeout(() => t.remove(), 2700);
  }
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  // reading the store: pictures land one by one, the bar moves, one line says what was just found
  const READ = ['ivory-angles.jpg', 'reviews.jpg', 'midnight.jpg', 'ivory.jpg', 'farak.jpg', 'sketch.jpg'];
  const FOUND = [[229, 'products'], [1171, 'things customers said'], [6, 'rivals and their ads'], [0, 'Your own ads']];
  function runRead(next){
    const tiles = [...app.querySelectorAll('.read-tiles i')], bar = app.querySelector('.read-bar b'), line = app.querySelector('.read-line');
    const say = i => { const [n, l] = FOUND[i]; line.innerHTML = n ? `<b data-count="${n}">${n.toLocaleString('en-IN')}</b> ${l}` : l;
      line.classList.remove('swap'); void line.offsetWidth; line.classList.add('swap'); countUp(); };
    if (STILL) { tiles.slice(0, 4).forEach(t => t.classList.add('in')); bar.style.width = '62%'; say(1); return; }
    FOUND.forEach((_, i) => later(() => { say(i); bar.style.width = `${25 * (i + 1)}%`; }, 80 + i * 1150));
    tiles.forEach((t, i) => later(() => t.classList.add('in'), 300 + i * 720));
    later(() => { location.hash = next; }, 80 + FOUND.length * 1150 + 350);
  }
  const todo = (items, doneN) => `<ul class="todo">${items.map((t, i) =>
    `<li class="${i < doneN ? 'done' : i === doneN ? 'now' : ''}"><i>${ico('check')}</i>${t}</li>`).join('')}</ul>`;
  const dots = n => `<div class="dots">${[1, 2, 3, 4].map(i => `<i class="${i < n ? 'on' : i === n ? 'on now' : ''}"></i>`).join('')}</div>`;
  const chips = (list, on = -1) => `<div class="chips">${list.map((c, i) => `<button class="chip ${i === on ? 'on' : ''}">${c}</button>`).join('')}</div>`;
  const mark = `<span class="brandmark"><img src="${A}char-dollop.png" alt="">jammie</span>`;
  // the onboarding stage: one centred column. Jammie on top, then one thought and one control
  const onb = (n, art, body, cls = '') => `<section class="onb ${cls}">${mark}${dots(n)}<div class="onb-art">${art}</div><div class="onb-body">${body}</div></section>`;
  // five short loops (idle, wave, search, cheer, sit); the flow map and reduced motion get the still
  const LOOPS = ['idle', 'wave', 'search', 'cheer', 'sit'], calm = STILL || matchMedia('(prefers-reduced-motion:reduce)').matches;
  const stillOf = p => p === 'idle' ? `${A}char-dollop.png` : `${A}pose-${p}.png`;
  const pose = p => LOOPS.includes(p) && !calm
    ? `<div class="pop v"><video class="lead" autoplay loop muted playsinline src="${A}anim/${p}.mp4"></video><img class="lead" src="${stillOf(p)}" alt=""></div>`
    : `<div class="pop"><div class="bob"><img class="lead" src="${stillOf(p)}" alt=""></div></div>`;
  // numbers tick up as Jammie reads
  function countUp(){ if (STILL) return; app.querySelectorAll('[data-count]').forEach(el => { const to = +el.dataset.count, t0 = performance.now();
    (function tick(t){ const k = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e).toLocaleString('en-IN'); if (k < 1) requestAnimationFrame(tick); })(t0); }); }
  // a coral bloom from where you pressed, then it lifts off the next screen
  function bloom(e, next){
    if (STILL || matchMedia('(prefers-reduced-motion:reduce)').matches) { location.hash = next; return; }
    const c = document.createElement('div'); c.className = 'curtain'; c.style.setProperty('--cx', e.clientX + 'px'); c.style.setProperty('--cy', e.clientY + 'px');
    c.innerHTML = `<img src="${A}pose-cheer.png" alt="">`; document.body.append(c);
    setTimeout(() => { arriving = true; location.hash = next; }, 520);
    setTimeout(() => c.classList.add('lift'), 760); setTimeout(() => c.remove(), 1400);
  }
  // three taps: the role dresses Jammie, the goal and the channels land beside it
  const ROLES = { Founder: 'founder', Marketer: 'marketer', Designer: 'designer', Agency: 'agency' };
  const GOALS = { Sales: 'bag', 'Repeat buyers': 'heart', Reach: 'megaphone', 'Better ads': 'clapper' };
  const CHANS = { Instagram: 'instagram', 'Meta ads': 'meta', Google: 'google', Email: 'email' };
  function tapPicked(ask){
    const kind = ask.dataset.ask, on = [...ask.querySelectorAll('.chip.on')].map(c => c.textContent.trim()), $ = id => document.getElementById(id);
    if (kind === 'role' && on[0]) { const me = $('meSlot'), old = me.lastElementChild;                 // the one on stage leaves to the left as the new one comes in from the right
      [...me.children].forEach(el => { if (el !== old) el.remove(); });
      if (old) { old.classList.remove('slide-in'); old.classList.add('slide-out'); setTimeout(() => old.remove(), calm ? 0 : 480); }
      me.insertAdjacentHTML('beforeend', `<div class="look slide-in"><div class="bob"><img class="lead" src="${A}look-${ROLES[on[0]]}.png" alt=""></div></div>`); }
    if (kind === 'goal' && on[0]) $('goalSlot').innerHTML = `<img class="in3d" src="${A}el-${GOALS[on[0]]}.png" alt="">`;
    if (kind === 'chan') { const slot = $('chanSlot');
      [...slot.children].forEach(el => { if (!on.includes(el.dataset.n)) el.remove(); });
      on.forEach(n => { if (!slot.querySelector(`[data-n="${n}"]`)) slot.insertAdjacentHTML('beforeend', `<img class="in3d" data-n="${n}" src="${A}el-${CHANS[n]}.png" alt="">`); });
      slot.classList.toggle('many', on.length > 2); }
  }
  const gate = inner => `<div class="gate"><div class="sheet gate-card">${inner}</div></div>`;
  const startScreen = () => onb(1, pose('search'), `
        <h1 class="h1">Add your store.</h1>
        <form class="store" data-go="#/signin">${ico('link')}<input placeholder="Paste a link or type its name" aria-label="Store link" value="wearcomet.com">
          <button class="btn b-jam draw">Read my store${ico('arrow')}</button></form>`);
  const G = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.300c0-.800-.100-1.600-.200-2.300H12v4.500h6.200a5.300 5.300 0 0 1-2.300 3.500v2.900h3.700c2.200-2 3.400-5 3.400-8.600Z"/><path fill="#34A853" d="M12 23.500c3.100 0 5.700-1 7.600-2.800l-3.700-2.900c-1 .700-2.400 1.100-3.900 1.100-3 0-5.500-2-6.400-4.700H1.800v3A11.500 11.500 0 0 0 12 23.500Z"/><path fill="#FBBC05" d="M5.600 14.200a6.900 6.900 0 0 1 0-4.400v-3H1.800a11.500 11.500 0 0 0 0 10.400Z"/><path fill="#EA4335" d="M12 5.100c1.700 0 3.200.600 4.400 1.700l3.300-3.300A11.500 11.500 0 0 0 1.800 6.800l3.800 3c.900-2.700 3.400-4.700 6.400-4.700Z"/></svg>`;

  // ---- pieces of the feed
  const STORIES = [['Today', 'reel.jpg'], ['Trends', 'midnight.jpg'], ['Popular ads', 'xlows.jpg'], ['Industry news', 'rival.jpg'], ['How to', 'sketch.jpg']];
  const stories = () => `<div class="stories-row"><div class="stories">${STORIES.map(([n, f], i) => `<a class="story ${i > 2 ? 'seen' : ''}" href="#/story?s=${i}"><i><b style="background-image:url(${D}${f})"></b></i>${n}</a>`).join('')}</div></div>`;
  const msgRow = o => { const d = idea(o.id); return `<div class="msg"><img src="${D}${d.img}" alt=""><span><b>${o.how === 'note' ? 'Your note to the team' : d.title}</b><small>${HOW[o.how][0]} · ${HOW[o.how][1]}</small></span><em>Now</em></div>`; };
  const acts = d => d.special ? '' : `<div class="acts">
      <button class="act draw ${liked.has(d.id) ? 'liked' : ''}" data-do="keep">${ico('heart')}Keep</button>
      <button class="act draw" data-do="share">${ico('share')}Share</button>
      <button class="act draw" data-do="later">${ico('calendar')}Later</button>
      <button class="act draw" data-do="less">${ico('filter')}Less</button>
      <a class="act draw" href="#/idea">${ico('eye')}Why</a>
      <button class="act draw" data-do="feedback">${ico('message')}Note</button>
    </div>`;
  const topRight = () => `<a class="ico-btn draw" href="#/bell" aria-label="Updates">${ico('bell')}</a><a class="ico-btn draw" href="#/you" aria-label="You">${ico('user')}</a>`;
  const feedShell = (d, panel = '', o = {}) => { const at = IDEAS.indexOf(d); if (at > -1) cur = at;
    return `<section class="feed ${panel ? 'has-panel' : ''} ${arriving ? 'arrive' : ''}">
      ${stories()}
      <div class="stage">${IDEAS.map((x, i) => `<div class="slide ${i === cur ? 'at' : ''}" data-i="${i}"><div class="feed-col">${fcard(x, i === cur ? o : {})}${acts(x)}</div></div>`).join('')}</div>${panel}
      ${orders.length ? `<a class="team" href="#/bell"><span class="stack">${orders.slice(0, 2).map(o => `<i style="background-image:url(${D}${idea(o.id).img})"></i>`).join('')}</span>With the team <em>${orders.length}</em></a>` : ''}
      <div class="corner">${topRight(true)}</div>
      <div class="feed-nav"><button class="btn b-round draw" data-do="prev" aria-label="Previous idea">${ico('up')}</button><button class="btn b-round draw" data-do="next" aria-label="Next idea">${ico('down')}</button></div>
    </section>`; };
  const side = (inner, back = '#/feed') => `<aside class="side"><a class="ico-btn x draw" href="${back}" aria-label="Close">${ico('close')}</a>${inner}</aside>`;
  const pageHead = (title, right = '') => `<div class="page-h"><h1>${title}</h1><div class="right">${right}${topRight()}</div></div>`;
  const noteBox = ph => `<div class="note"><textarea placeholder="${ph}" aria-label="Your note"></textarea><button class="btn b-round mic draw" data-do="mic" aria-label="Hold to talk">${ico('play')}</button></div>`;
  const curIdea = () => IDEAS[cur].special ? real[0] : IDEAS[cur];

  // ---- command centre: five columns, one question a card (numbers are the demo's)
  const dcard = c => `<div class="dcard ${c.need ? 'need' : ''}"><div class="top"><span>${c.label}</span><em class="${c.need ? 'need' : ''}">${c.need ? 'Needs you' : c.when || ''}</em></div>
      <div class="big"><b>${c.value}</b>${c.delta ? `<span class="delta ${c.dir}">${c.delta}</span>` : ''}</div><p class="line">${c.line}</p>
      ${c.bars ? `<div class="bars">${c.bars.map((h, i) => `<i class="${i === c.bars.length - 1 ? 'hi' : ''}" style="height:${h}%"></i>`).join('')}</div>` : ''}
      ${c.mini ? `<div class="mini">${c.mini.map(([l, v]) => `<button data-do="report"><small>${l}</small><b>${v}</b></button>`).join('')}</div>` : ''}
      <div class="foot">${[...(c.acts || [])].sort((a, b) => (a[1] === 'jam') - (b[1] === 'jam')).map(([l, what]) => what === 'jam' ? `<a class="btn b-jam" href="#/new">${l}</a>` : `<button data-do="${what}">${l}</button>`).join('')}</div></div>`;
  const COLS = [
    ['With the team', 'Who has what, right now', [{ label: 'In the works · now', value: () => String(orders.length), line: () => orders.length ? 'Each one is in Updates.' : 'Nothing cooking. Start a jam from any card.', acts: [['More', 'more']] }]],
    ['Finance', 'What you keep after everything', [
      { label: 'Net sales · 7 days', when: '40 min ago', value: '₹1.4Cr', delta: '▼ 13%', dir: 'down', line: 'What customers paid, after discounts and returns.', bars: [70, 78, 79, 80, 78, 82, 95, 67, 66, 68, 81, 73, 67, 68], mini: [['Orders', '2,179'], ['An order', '₹6,380'], ['New customers', '1,629']], acts: [['More', 'more'], ['Weekly report', 'report'], ['Add delivery fees', 'costs']] },
      { label: 'What you keep · 7 days', when: '40 min ago', value: 'Not counted yet', line: 'It counts once your costs are in.', acts: [['Add product costs', 'costs'], ['P&L report', 'report']] },
      { label: 'Refunds · 7 days', when: '40 min ago', value: '₹3L', delta: '▼ 11%', dir: 'up', line: 'Refunded on orders placed in these days, so far.', acts: [['More', 'more'], ['P&L report', 'report']] }]],
    ['Marketing return', 'Where the spend goes and what it brings', [
      { label: 'Sales per ₹1 of ads · 7 days', when: '40 min ago', value: '5.2×', delta: '▼ 13%', dir: 'down', line: 'Sales for every ₹1 of ads.', bars: [79, 74, 76, 90, 83, 77, 78], mini: [['Cost of a new customer', '₹1,649'], ['New customers', '1,629'], ['Ad spend', '₹26.9L']], acts: [['More', 'more'], ['Marketing report', 'report']] },
      { label: 'Campaigns · 7 days', need: true, value: '₹26.9L', line: 'Spent across 5 campaigns. Set your costs to get a call on each.', acts: [['Park', 'park'], ['Let’s jam', 'jam'], ['Marketing report', 'report']] },
      { label: 'Site funnel · 7 days', when: '40 min ago', value: '1.4%', delta: '▼ 11%', dir: 'down', line: 'Of visits bought.', mini: [['Visits', '1,59,844'], ['To cart', '9%'], ['To checkout', '2.9%']], acts: [['More', 'more'], ['Customers report', 'report']] }]],
    ['Stock & delivery', 'What’s on the shelf, and what’s late', [

  function render(){

    if (q.get('i') !== null && IDEAS[+q.get('i')]) cur = +q.get('i');          // #/feed?i=2 opens on a given card
    document.body.classList.toggle('bare', !!s.bare);
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === s.nav));
    const hadSide = !!app.querySelector('.side');
    app.innerHTML = s.html(q);

  }

    const from = Date.now() - aimAt < 600 ? aim : cur; aim = n; aimAt = Date.now();

  function step(dir, wrap = true){ const from = Date.now() - aimAt < 600 ? aim : cur, n = from + dir;

    col: b => { const c = document.getElementById('dcol' + b.dataset.id); if (c) c.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', inline: 'start', block: 'nearest' }); },

  const LATER = ['report', 'costs', 'park', 'more', 'menu', 'source', 'plan', 'tile', 'openbook', 'addnote', 'pause', 'rename', 'theme', 'learns', 'legal'];

  document.addEventListener('click', e => {
    const bl = e.target.closest('[data-bloom]'); if (bl) { e.preventDefault(); bloom(e, bl.getAttribute('href')); return; }
    const like = e.target.closest('[data-like]');
    if (like) { e.preventDefault(); const id = like.dataset.id; liked.has(id) ? liked.delete(id) : liked.add(id); keep('jammie-proto-liked', [...liked]); like.classList.toggle('liked'); return; }
    const open = e.target.closest('[data-open]');
    if (open) { const i = IDEAS.findIndex(d => d.id === open.dataset.open); if (i > -1) cur = i; }
    const sl = e.target.closest('.slide'); if (sl) cur = +sl.dataset.i;        // whatever was pressed belongs to this card
    const b = e.target.closest('[data-do]');
    if (b) { const what = b.dataset.do; if (DO[what]) DO[what](b); else if (LATER.includes(what)) toast('This opens in the full build', 'search'); return; }
    const card = e.target.closest('.feed-col .fcard:not(.plain)');           // the card itself opens the idea
    if (card && !e.target.closest('a,button') && /^#\/feed/.test(location.hash)) { location.hash = '#/idea'; return; }
    const chip = e.target.closest('.chip');
    if (chip && chip.tagName === 'BUTTON') { const ask = chip.closest('[data-ask]');

    if (e.target.matches && e.target.matches('input,textarea')) return;

    if (onFeed && (e.key === 'ArrowDown' || e.key === 'j')) { e.preventDefault(); step(1); }
    if (onFeed && (e.key === 'ArrowUp' || e.key === 'k')) { e.preventDefault(); step(-1); }
    if (onFeed && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const fr = app.querySelector('.slide:not([inert]) .frames'); if (fr) fr.scrollBy({ left: (e.key === 'ArrowRight' ? 1 : -1) * fr.clientWidth, behavior: 'smooth' }); }

    if (e.key === 'Escape' && !document.body.classList.contains('bare') && !/^#\/(feed|command|work|learned|connectors|you)/.test(location.hash)) location.hash = '#/feed';
  });
  // Touch scrolls the feed natively and it stops on each card. A wheel or trackpad is turned into one card a gesture,
  // because a snapped list springs back unless the wheel travels half a card. A gesture starts small, so add it up.
  let wAcc = 0, wLast = 0, wAbs = 0, wArmed = true, wStep = 0;
  addEventListener('wheel', e => {
    if (e.ctrlKey || !/^#\/feed(\?|$)/.test(location.hash) || !(e.target.closest && e.target.closest('.feed')) || e.target.closest('.side,.scrim')) return;
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;                                            // sideways moves a carousel's frames
    e.preventDefault();
    const now = Date.now(), abs = Math.abs(e.deltaY);
    if (now - wLast > 180) { wAcc = 0; wArmed = true; }                                             // a new gesture
    else if (!wArmed && now - wStep > 500 && abs > wAbs + 6 && abs >= 10) { wAcc = 0; wArmed = true; } // pushed again while the last one coasts
    wLast = now; wAbs = abs;
    if (!wArmed) return;
    wAcc += e.deltaY;
    if (Math.abs(wAcc) >= 36) { wArmed = false; wStep = now; step(wAcc > 0 ? 1 : -1, false); }
  }, { passive: false });
  addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
