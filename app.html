<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jammie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/jammie/v3/jammie.css?v=5">
<style>
/* screens only: every token and shared piece comes from jammie.css */
body{padding-left:60px;min-height:100vh;overflow-x:hidden}
body.bare{padding-left:0}
body.bare .rail,body.bare .fab{display:none}
a{text-decoration:none}

/* ---------- onboarding: Jammie, one thought, one control ---------- */
.center{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:64px 24px 40px;text-align:center}
.h1{font-size:calc(var(--h-size) * .8);line-height:1.08}
.h2{font-size:calc(var(--h-size) * .58);line-height:1.12}
.lead{height:150px;width:auto;filter:drop-shadow(0 14px 10px rgba(0,0,0,.14))}
.dots{position:absolute;top:24px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.dots i{width:20px;height:4px;border-radius:4px;background:var(--s3)}
.dots i.on{background:var(--fg)}
.skip{position:absolute;top:14px;right:20px}
.onb{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:100vh}
.onb-art{background:var(--s2);display:grid;place-items:center;padding:40px;position:relative}
.onb-art .lead{height:min(300px,34vh)}
.onb-art .fcard.sm{width:min(270px,100%)}
.onb-art .brandmark{position:absolute;left:28px;top:22px;display:flex;align-items:center;gap:7px;color:var(--jam);font-weight:800;font-size:19px;letter-spacing:-.03em}
.onb-art .brandmark img{height:28px}
.onb-body{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:20px;padding:72px clamp(28px,6vw,88px);text-align:left}
.onb-body .dots{left:clamp(28px,6vw,88px);transform:none;top:34px}
.onb-body .h1,.onb-body .h2{max-width:14ch}
.onb-body .pair{justify-content:flex-start}
.store{display:flex;align-items:center;gap:10px;width:min(500px,100%);height:56px;padding:0 7px 0 20px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card);box-shadow:var(--shadow-2)}
.store:focus-within{border-color:var(--fg)}
.store input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font:inherit;font-size:16px}
.store .btn{border-radius:var(--r-pill);height:42px}
.store > [data-ico]{color:var(--fg-2)}
.todo{padding:0;margin:0}
.gbtn{gap:10px}
.gbtn svg{width:18px;height:18px}
.asks{display:grid;gap:18px;width:min(520px,100%);text-align:left}
.asks h4{font-size:14px;font-weight:600;letter-spacing:0;margin-bottom:8px}
.asks .chips{display:flex;flex-wrap:wrap;gap:8px}
.found{width:min(440px,100%);text-align:left}
.found .rowi b{text-align:right}
.swatches{display:flex;gap:6px}
.swatches i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.pair{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.book{position:relative;width:220px;aspect-ratio:3/4;border-radius:6px 14px 14px 6px;background:#2B50E0;color:#fff;padding:18px;text-align:left;box-shadow:var(--shadow-3),inset 6px 0 0 rgba(0,0,0,.14);transform:rotate(-3deg)}
.book small{font-size:11px;font-weight:600;opacity:.8}
.book b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.book p{font-size:12.5px;line-height:1.35;margin:6px 0 0;opacity:.9}
.book img{position:absolute;right:-18px;bottom:16px;width:58%;border-radius:8px;border:3px solid #fff;box-shadow:var(--shadow-2);transform:rotate(6deg)}

/* ---------- the feed ---------- */
.feed{position:relative;height:100vh;display:flex;flex-direction:column;align-items:center}
.stories{flex:none;display:flex;gap:16px;padding:14px 0 10px}
.story{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--fg-2)}
.story i{width:50px;height:50px;border-radius:50%;padding:2.5px;background:var(--jam);display:block}
.story.seen i{background:var(--line)}
.story i b{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);background:var(--s2) center/cover}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:22px;padding:0 24px 22px}
.feed-col{display:flex;align-items:flex-end;gap:8px}
.age{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--fg-2);padding:8px 0}
.age .ico{color:var(--fg)}
.feed-nav{position:absolute;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.corner{position:absolute;top:14px;right:20px;display:flex;align-items:center;gap:2px}
.count{position:absolute;left:24px;bottom:20px;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.orders{position:absolute;left:24px;top:110px;width:250px;display:grid;gap:8px}
.orders h4{font-size:12px;font-weight:600;letter-spacing:0;color:var(--fg-2)}
.order{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line-soft);border-radius:14px;background:var(--card);color:inherit}
.order:hover{border-color:var(--line)}
.feed.has-panel .orders,.feed.has-panel .feed-nav{display:none}
.order img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none}
.order b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.order small{display:block;font-size:12px;color:var(--fg-2)}
.order small em{font-style:normal;color:var(--jam);font-weight:600}
.feed-col .fcard:not(.plain){cursor:pointer}
.fcard.enter-down{animation:in-down .42s var(--ease)}
.fcard.enter-up{animation:in-up .42s var(--ease)}
@keyframes in-down{from{opacity:0;transform:translateY(32px)}}
@keyframes in-up{from{opacity:0;transform:translateY(-32px)}}
.fab{position:fixed;right:24px;bottom:20px;z-index:12;height:46px;padding:0 16px 0 6px;border-radius:99px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-2);display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:inherit}
.fab:hover{box-shadow:var(--shadow-3)}
.fab img{height:34px;width:auto}

/* ---------- side panel: idea, let's jam, a note, an order ---------- */
.side{position:relative;width:390px;max-height:calc(100vh - 150px);overflow-y:auto;align-self:center;animation:in-side .4s var(--ease);scrollbar-width:thin}
@keyframes in-side{from{opacity:0;transform:translateX(20px)}}
.side h2{font-size:21px;line-height:1.18;margin:10px 36px 6px 0}
.side .sub{color:var(--fg-2);font-size:14px;margin:0 0 16px}
.side h4{font-size:13px;margin:18px 0 8px;color:var(--fg-2);font-weight:600;letter-spacing:0}
.side p{margin:0;font-size:14.5px}
.x{position:absolute;top:10px;right:10px}
.cap{border:1px solid var(--line-soft);border-radius:12px;padding:12px;font-size:14px;display:grid;gap:8px}
.side .chips{display:flex;gap:6px;flex-wrap:wrap}
.side .chip{height:32px;padding:0 12px;font-size:13px}
.side-foot{position:sticky;bottom:-24px;margin:18px -24px -24px;padding:12px 24px;background:var(--card);border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:6px}
.side-foot .btn{margin-left:auto}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px 4px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;color:inherit}
.opt:last-of-type{border-bottom:0}
.opt:hover b{text-decoration:underline;text-underline-offset:3px}
.opt > i{width:34px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center;flex:none}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--fg-2);font-size:13.5px;line-height:1.35}
.note{position:relative;margin:4px 0 12px}
.note textarea{width:100%;min-height:120px;border:1px solid var(--fg-3);border-radius:14px;padding:12px 14px;font:inherit;color:var(--fg);background:var(--card);resize:vertical;outline:none}
.note textarea:focus{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.note .mic{position:absolute;right:10px;bottom:14px}

/* ---------- story viewer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:grid;place-items:center;padding:24px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sview{width:min(430px,100%);max-height:calc(100vh - 40px);overflow-y:auto;padding:16px 18px 18px;animation:in-down .4s var(--ease)}
.segs{display:flex;gap:4px;margin-bottom:12px}
.segs i{flex:1;height:3px;border-radius:3px;background:var(--s3)}
.segs i.on{background:var(--fg)}
.sview-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:600;font-size:14px}
.sview-h .ico-btn{width:32px;height:32px}
.sview img.pic{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}
.sview h2{font-size:22px;line-height:1.15;margin:8px 0}
.sview .btn{width:100%;margin-top:14px}
.unlock{width:min(430px,100%);position:relative;animation:in-down .4s var(--ease)}
.unlock h2{font-size:23px;margin:0 0 14px}
.unlock .lead{height:80px;margin:0 0 8px}
.unlock .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}

/* ---------- pages ---------- */
.page{max-width:1040px;margin:0 auto;padding:0 32px 90px}
.page.wide{max-width:none}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:16px;height:62px;margin-bottom:10px}
.page-h h1{font-size:19px;font-weight:600;letter-spacing:0}
.page-h .right{display:flex;align-items:center;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.sec-t{font-size:18px;margin:24px 0 12px}
.hello{display:flex;align-items:center;gap:12px;margin:2px 0 18px;font-size:16.5px}
.hello img{height:52px;width:auto}

/* command centre */
.cols{display:flex;gap:16px;overflow-x:auto;padding-bottom:18px;scrollbar-width:thin}
.col{flex:none;width:320px;display:grid;gap:12px;align-content:start}
.col-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px}
.col-h i{width:8px;height:8px;border-radius:50%;background:var(--fg)}
.col-h small{margin-left:auto;font-size:12px;font-weight:600;color:#1A7F4B}
.col > p{margin:-8px 0 0;font-size:13px;color:var(--fg-2)}
.stat .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat .top em{font-style:normal;font-size:12px;color:var(--fg-3)}
.stat .top em.need{color:var(--jam);font-weight:600}
.stat .big{display:flex;align-items:baseline;gap:8px}
.stat .line{font-size:13.5px;color:var(--fg-2);margin:2px 0 0}
.bars{display:flex;align-items:flex-end;gap:5px;height:70px;margin:12px 0 10px}
.bars i{flex:1;border-radius:5px 5px 2px 2px;background:var(--s3)}
.bars i.hi{background:var(--fg)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.mini button{border:0;background:none;padding:0;text-align:left;color:inherit}
.mini small{font-size:12px}
.mini b{font-size:15px;margin:0;letter-spacing:0}
.stat .foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.stat .foot .btn{height:30px;padding:0 10px;font-size:13px}

/* what we learned */
.learn{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ltile{border:1px solid var(--line-soft);border-radius:16px;background:var(--card);padding:14px;text-align:left;color:inherit;display:block}
.ltile:hover{border-color:var(--line)}
.ltile b{display:block;font-size:24px;font-weight:var(--h-weight);line-height:1.1}
.ltile b.t{font-size:15.5px;font-weight:600}
.ltile small{display:block;color:var(--fg-2);font-size:13px;margin-top:3px}

/* work board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.lane{background:var(--s2);border-radius:16px;padding:12px;min-height:220px;display:grid;gap:8px;align-content:start}
.lane h4{font-size:13px;font-weight:600;letter-spacing:0;display:flex;justify-content:space-between}
.lane h4 span{color:var(--fg-3)}
.lane p{margin:0;font-size:13px;color:var(--fg-2)}
.lane .order b{max-width:150px}

.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:grid;gap:8px;pointer-events:none}
.toasts .toast{animation:toast 2.6s var(--ease) forwards}
html.still *{animation-duration:0s!important;animation-delay:0s!important}
html.still ::-webkit-scrollbar{display:none}

/* ---------- phone ---------- */
@media (max-width:860px){
  body{padding-left:0;padding-bottom:58px}
  body.bare{padding-bottom:0}
  .rail{inset:auto 0 0 0;width:auto;height:58px;flex-direction:row;padding:0 8px;border-right:0;border-top:1px solid var(--line-soft)}
  .rail-brand{display:none}
  .rail-nav{flex-direction:row;margin:0;gap:0;width:100%;justify-content:space-around}
  .feed{height:calc(100vh - 58px)}
  .stories{gap:10px;padding:8px 0 6px}
  .story i{width:42px;height:42px}
  .stage{padding:0 8px 8px;gap:0}
  .fcard{height:100%;aspect-ratio:auto;width:100%}
  .feed-col{position:relative;width:100%;height:100%}
  .feed-col .acts{position:absolute;right:4px;bottom:210px;z-index:3}
  .feed-col .act,.feed-col .age,.feed-col .act .ico,.feed-col .age .ico{color:#fff}
  .feed-col .act:hover{background:rgba(0,0,0,.3)}
  .feed-nav,.count,.corner,.orders{display:none}
  .fab{bottom:70px;right:12px}
  .side{position:fixed;inset:auto 0 0 0;width:auto;max-height:84vh;border-radius:var(--r-card) var(--r-card) 0 0;z-index:30}
  .page{padding:0 16px 80px}
  .grid3,.tiles,.board{grid-template-columns:1fr}
  .learn{grid-template-columns:1fr}
  .col{width:86vw}
  .onb{grid-template-columns:1fr}
  .onb-art{min-height:34vh;padding:24px}
  .onb-art .lead{height:150px}
  .onb-body{padding:56px 20px 32px;justify-content:flex-start}
  .onb-body .dots{left:20px;top:22px}
}
</style>
</head>
<body>
<nav class="rail" aria-label="main">
  <a class="rail-brand" href="#/feed" aria-label="jammie"><img src="assets/jammie/v3/char-dollop.png" alt=""></a>
  <div class="rail-nav">
    <a class="draw" data-nav="feed" href="#/feed" aria-label="Feed"><i data-ico="home"></i></a>
    <a class="draw" data-nav="command" href="#/command" aria-label="Command centre"><i data-ico="chart"></i></a>
    <a class="draw" data-nav="work" href="#/work" aria-label="Work"><i data-ico="calendar"></i></a>
    <a class="draw" data-nav="bell" href="#/bell" aria-label="Updates"><i data-ico="bell"></i></a>
    <a class="draw" data-nav="learned" href="#/learned" aria-label="What we learned"><i data-ico="bookmark"></i></a>
    <a class="draw" data-nav="connectors" href="#/connectors" aria-label="Connectors"><i data-ico="link"></i></a>
    <a class="draw" data-nav="you" href="#/you" aria-label="You"><i data-ico="user"></i></a>
  </div>
</nav>
<a class="fab draw" href="#/new" aria-label="Start something new"><img src="assets/jammie/v3/pose-wave.png" alt="">New<i data-ico="plus"></i></a>
<main id="app"></main>
<div class="toasts" id="toasts"></div>

<script src="assets/jammie/v3/icons.js?v=5"></script>
<script src="assets/jammie/v3/data.js?v=5"></script>
<script>
(() => {
  const { A, D, IDEAS, real, av, fcard, icard, srow } = window.JAMMIE;
  const root = document.documentElement, app = document.getElementById('app');
  const STILL = new URLSearchParams(location.search).has('still');   // the flow map shows screens at rest
  if (STILL) root.classList.add('still');
  const ico = n => `<i data-ico="${n}"></i>`;

  // carry over whatever was tuned on the workbench
  try {
    const t = JSON.parse(localStorage.getItem('jammie-workbench-v4')) || {};
    root.dataset.theme = t.theme || 'light';
    Object.entries(t).forEach(([k, v]) => { if (k.startsWith('--')) root.style.setProperty(k, v); });
    Object.entries((t.themed && t.themed[root.dataset.theme]) || {}).forEach(([k, v]) => root.style.setProperty(k, v));
  } catch {}

  // ---- state: where we are in the feed, what was kept, what went to the team
  let cur = 0, timers = [];
  const store = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
  const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let liked = new Set(store('jammie-proto-liked', ['reviews']));
  let orders = STILL ? [{ id: 'reel', how: 'ship' }] : store('jammie-proto-orders', []);
  const HOW = { ship: ['With the team', 'Files land in your inbox'], change: ['With the team', 'They answer within 24 hours'], sloosh: ['Being made on Sloosh', 'About 4 minutes'], note: ['With the team', 'They answer within 24 hours'] };
  const idea = id => real.find(d => d.id === id) || real[0];
  function send(how, id){ orders = orders.filter(o => o.id !== id); orders.unshift({ id, how }); keep('jammie-proto-orders', orders); }

  function toast(text, pose = 'cheer'){
    const t = document.createElement('div'); t.className = 'toast';
    t.innerHTML = `<img src="${A}pose-${pose}.png" alt=""><span>${text}</span>`;
    document.getElementById('toasts').append(t); setTimeout(() => t.remove(), 2700);
  }
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  function runTodo(next){
    const li = [...app.querySelectorAll('.todo li')];
    if (STILL) return;
    li.forEach((el, i) => { el.className = i === 0 ? 'now' : ''; });
    li.forEach((el, i) => later(() => {
      el.className = 'done'; if (li[i + 1]) li[i + 1].className = 'now';
      if (i === li.length - 1) later(() => { location.hash = next; }, 600);
    }, 900 * (i + 1)));
  }
  const todo = (items, doneN) => `<ul class="todo">${items.map((t, i) =>
    `<li class="${i < doneN ? 'done' : i === doneN ? 'now' : ''}"><i>${ico('check')}</i>${t}</li>`).join('')}</ul>`;
  const dots = n => `<div class="dots">${[1, 2, 3, 4, 5, 6, 7, 8].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`;
  const chips = (list, on = 0) => `<div class="chips">${list.map((c, i) => `<button class="chip ${i === on ? 'on' : ''}">${c}</button>`).join('')}</div>`;
  const mark = `<span class="brandmark"><img src="${A}char-dollop.png" alt="">jammie</span>`;
  const onb = (n, art, body) => `<section class="onb"><div class="onb-art">${mark}${art}</div><div class="onb-body">${dots(n)}${body}</div></section>`;
  const pose = p => `<img class="lead" src="${A}pose-${p}.png" alt="">`;
  const G = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.300c0-.800-.100-1.600-.200-2.300H12v4.500h6.200a5.300 5.300 0 0 1-2.300 3.500v2.900h3.700c2.200-2 3.400-5 3.400-8.600Z"/><path fill="#34A853" d="M12 23.500c3.100 0 5.700-1 7.600-2.800l-3.700-2.900c-1 .700-2.400 1.100-3.900 1.100-3 0-5.500-2-6.400-4.700H1.800v3A11.500 11.500 0 0 0 12 23.500Z"/><path fill="#FBBC05" d="M5.600 14.200a6.900 6.900 0 0 1 0-4.400v-3H1.800a11.500 11.500 0 0 0 0 10.400Z"/><path fill="#EA4335" d="M12 5.100c1.700 0 3.200.600 4.400 1.700l3.300-3.300A11.500 11.500 0 0 0 1.800 6.800l3.800 3c.900-2.700 3.400-4.700 6.400-4.700Z"/></svg>`;

  // ---- pieces of the feed
  const STORIES = [['Today', 'reel.jpg'], ['Trends', 'midnight.jpg'], ['Popular ads', 'xlows.jpg'], ['Industry news', 'rival.jpg'], ['How to', 'sketch.jpg']];
  const stories = () => `<div class="stories">${STORIES.map(([n, f], i) => `<a class="story ${i > 2 ? 'seen' : ''}" href="#/story?s=${i}"><i><b style="background-image:url(${D}${f})"></b></i>${n}</a>`).join('')}</div>`;

        <h2 class="sec-t">Ads</h2><div class="rows">${row('Meta Ads', 'See which ads actually sell')}${row('Google Ads', 'See which searches bring buyers')}</div>
        <h2 class="sec-t">Customers</h2><div class="rows">${row('Klaviyo', 'See which emails earn')}${row('Judge.me', 'Hear what customers love and complain about')}</div>
        <h2 class="sec-t">Your team</h2><div class="rows">${row('Slack', 'Jam with your team in a thread')}</div>
      </section>`; } },

    you: { nav: 'you', html: () => { const row = (t, s, what) => `<button class="rowi" data-do="${what}"><span class="grow"><b>${t}</b>${s ? `<small>${s}</small>` : ''}</span>${ico('arrow')}</button>`; return `<section class="page" style="max-width:640px">
        ${pageHead('You')}
        <div class="rows"><div class="rowi">${av(40)}<span class="grow"><b>You</b><small>Admin · Comet</small></span><button class="btn b-line b-sm" data-do="rename">Change your name</button></div></div>
        <h2 class="sec-t">Look and sound</h2><div class="rows">${row('Theme', 'Auto', 'theme')}${row('Sound', 'On', 'sound')}</div>
        <h2 class="sec-t">Your jam</h2><div class="rows">${row('What Jammie learns', 'Learning from you', 'learns')}${row('Unlock everything', '', 'gounlock')}${row('Start again', '', 'restart')}</div>
        <h2 class="sec-t">Help</h2><div class="rows">${row('Email us', 'toast@jammie.ai', 'help')}${row('Privacy', '', 'legal')}${row('Terms', '', 'legal')}${row('Data deletion', '', 'legal')}</div>
      </section>`; } },
  };

  function render(){
    timers.forEach(clearTimeout); timers = [];
    const [name, query] = (location.hash.replace(/^#\/?/, '') || 'start').split('?');
    const s = SCREENS[name] || SCREENS.start, q = new URLSearchParams(query || '');
    if (q.get('i') !== null && IDEAS[+q.get('i')]) cur = +q.get('i');          // #/feed?i=2 opens on a given card
    if (name === 'unlock') cur = IDEAS.length - 1;
    document.body.classList.toggle('bare', !!s.bare);
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === s.nav));
    app.innerHTML = s.html(q);
    window.jammieIcons(document);
    window.scrollTo(0, 0);
    if (s.enter) s.enter();
  }
  function step(dir){
    cur = (cur + dir + IDEAS.length) % IDEAS.length;
    if (location.hash !== '#/feed') history.replaceState(null, '', '#/feed');
    render();
    const c = app.querySelector('.fcard'); if (c) c.classList.add(dir > 0 ? 'enter-down' : 'enter-up');
  }
  const go = h => { if (location.hash === h) render(); else location.hash = h; };

  const DO = {
    keep: b => { const d = curIdea(); liked.has(d.id) ? liked.delete(d.id) : liked.add(d.id); keep('jammie-proto-liked', [...liked]); b.classList.toggle('liked'); if (liked.has(d.id)) toast('Kept. Jammie brings more like it.'); },
    share: () => toast('Link copied'), copy: () => toast('Caption copied'),
    later: () => { toast('Saved for later', 'sleep'); step(1); },
    less: () => { toast('Got it. Fewer like this.', 'worry'); step(1); },
    feedback: () => go('#/change'), sound: () => toast('Sound on'), shuffle: () => { cur = Math.floor(Math.random() * real.length); go('#/feed'); toast('Shuffled'); },
    next: () => step(1), prev: () => step(-1),
    ship: () => { send('ship', curIdea().id); go('#/feed'); toast('Sent to the team. Files land in your inbox.'); },
    sendchange: () => { send('change', curIdea().id); go('#/feed'); toast('Sent. The team answers within 24 hours.'); },
    sendnote: () => { send('note', curIdea().id); go('#/feed'); toast('Sent. The team answers within 24 hours.'); },
    makesloosh: () => { send('sloosh', curIdea().id); go('#/feed'); toast('On it. About 4 minutes.'); },
    morelike: () => { toast('Noted. More like this one.'); step(1); },
    withdraw: b => { orders = orders.filter(o => o.id !== b.dataset.id); keep('jammie-proto-orders', orders); go('#/feed'); toast('Taken back', 'worry'); },
    noshopify: () => { toast('No problem. Estimates stay.', 'sleep'); step(1); }, more8: () => toast('8 more are on the way'),
    sent: () => { toast('Sent. We will be in touch.'); go('#/feed'); },
    connect: b => toast(`${b.dataset.id} opens its own sign-in`, 'search'), work: () => go('#/work'), feed: () => go('#/feed'),
    gounlock: () => go('#/unlock'), restart: () => go('#/start'), help: () => toast('Opens your email', 'search'),
    fix: () => toast('Fixing comes next', 'search'), mic: () => toast('Hold to talk', 'search'), wrong: () => toast('Tell me what’s wrong', 'worry'),
  };
  const LATER = ['report', 'costs', 'park', 'more', 'menu', 'source', 'plan', 'tile', 'openbook', 'addnote', 'pause', 'rename', 'theme', 'learns', 'legal'];

  document.addEventListener('click', e => {
    const like = e.target.closest('[data-like]');
    if (like) { e.preventDefault(); const id = like.dataset.id; liked.has(id) ? liked.delete(id) : liked.add(id); keep('jammie-proto-liked', [...liked]); like.classList.toggle('liked'); return; }
    const open = e.target.closest('[data-open]');
    if (open) { const i = IDEAS.findIndex(d => d.id === open.dataset.open); if (i > -1) cur = i; }
    const b = e.target.closest('[data-do]');
    if (b) { const what = b.dataset.do; if (DO[what]) DO[what](b); else if (LATER.includes(what)) toast('This opens in the full build', 'search'); return; }
    const card = e.target.closest('.feed-col .fcard:not(.plain)');           // the card itself opens the idea
    if (card && !e.target.closest('a,button') && /^#\/feed/.test(location.hash)) { location.hash = '#/idea'; return; }
    const chip = e.target.closest('.chip'); if (chip && chip.tagName === 'BUTTON') chip.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
    const sg = e.target.closest('.seg button'); if (sg) sg.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === sg));
  });
  document.addEventListener('submit', e => { const f = e.target.closest('[data-go]'); if (f) { e.preventDefault(); location.hash = f.dataset.go; } });
  document.addEventListener('keydown', e => {
    if (e.target.matches && e.target.matches('input,textarea')) return;
    const onFeed = /^#\/feed(\?|$)/.test(location.hash);
    if (onFeed && (e.key === 'ArrowDown' || e.key === 'j')) { e.preventDefault(); step(1); }
    if (onFeed && (e.key === 'ArrowUp' || e.key === 'k')) { e.preventDefault(); step(-1); }
    if (e.key === 'Escape' && !document.body.classList.contains('bare') && !/^#\/(feed|command|work|learned|connectors|you)/.test(location.hash)) location.hash = '#/feed';
  });
  addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
