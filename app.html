<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jammie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/jammie/v3/jammie.css?v=17">
<style>
/* screens only: every token and shared piece comes from jammie.css */
:root{--side-w:min(440px,100vw);--bar:64px;--t:.45s;--pp:#FBF7F0;--vh:100vh}
@supports (height:100dvh){:root{--vh:100dvh}}   /* on a phone, the height you can see while the browser's bars show */
:root[data-theme="dark"]{--pp:#1D1A16}
body{padding-left:60px;height:var(--vh);overflow:hidden}
body.bare{padding-left:0;height:auto;overflow-x:hidden;overflow-y:auto}
body.bare .rail,body.bare .fab,body.bare .topbar{display:none}
a{text-decoration:none}

/* ---------- the shell: one top bar that never moves, a page under it, and a panel that opens beside the page ---------- */
#app{position:relative;height:var(--vh);background:var(--bg);transition:margin-right var(--t) var(--ease),border-radius var(--t) var(--ease),background .3s var(--ease)}
body.bare #app{height:auto;min-height:var(--vh)}
.topbar{position:fixed;top:0;left:60px;right:0;z-index:8;height:var(--bar);display:flex;align-items:center;gap:24px;padding:0 24px;border-bottom:1px solid transparent;pointer-events:none;transition:right var(--t) var(--ease),border-radius var(--t) var(--ease)}
.topbar > *{pointer-events:auto}
.topbar.solid{background:var(--bg);border-bottom-color:var(--line-soft)}   /* the line is always there, so the two buttons never move by a pixel */
.topbar h1{font-size:19px;font-weight:600;letter-spacing:0;white-space:nowrap}
.top-right{margin-left:auto;display:flex;gap:8px}
.top-right .ico-btn{position:relative;width:40px;height:40px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.top-right .ico-btn:hover{background:var(--s3)}
.top-right .ico-btn.on{background:var(--s2)}
.top-right em[hidden]{display:none}
.top-right em{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--jam);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center}
/* a page change: the bar stays, the page under it fades up a little. The same curve and time as every other move */
.page-in{animation:page-in var(--t) var(--ease) both}
@keyframes page-in{from{opacity:0;transform:translateY(12px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
/* the page steps aside as a sheet with round corners, and the panel sits on the floor beside it */
body.has-side{background:var(--floor)}
body.has-side #app{margin-right:var(--side-w);border-radius:0 28px 28px 0;overflow:hidden;box-shadow:0 0 0 1px var(--line-soft),10px 0 34px rgba(0,0,0,.05)}
body.has-side .topbar{right:var(--side-w);border-top-right-radius:28px}
#side{position:fixed;top:0;right:0;bottom:0;z-index:5;width:var(--side-w);display:flex;flex-direction:column;visibility:hidden;opacity:0;transition:opacity var(--t) var(--ease),visibility 0s var(--t)}
body.has-side #side{visibility:visible;opacity:1;transition:opacity var(--t) .12s var(--ease)}
.side-h{flex:none;display:flex;align-items:center;gap:8px;height:var(--bar);padding:0 12px 0 24px}
.side-h h2{font-size:19px;font-weight:600;letter-spacing:0;margin-right:auto}
.side-h .back{margin-left:-12px}
.side-body{flex:1;min-height:0;overflow-y:auto;padding:8px 24px 24px;display:flex;flex-direction:column;scrollbar-width:thin;animation:rise var(--t) var(--ease) both}
.side-body > *{flex:none}
.side-foot{flex:none;display:flex;align-items:center;gap:8px;padding:16px 24px 24px}
.side-foot .btn{margin-left:auto}
.side-foot.ask{flex-direction:column;align-items:stretch;gap:12px}   /* what you might ask, then the box, 12px apart */
.side-foot .ico-btn:first-child{margin-left:-10px}   /* the heart's glyph, not its circle, lines up with the text above */
.side-empty{flex:1;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;padding-bottom:48px}   /* 48px: centred in the whole panel, not just under its header */
.side-empty img{height:120px;width:auto;margin-bottom:8px}
.side-empty h3{font-size:19px;font-weight:600;letter-spacing:0}
.side-empty p{margin:0;color:var(--fg-2);font-size:14.5px}
/* inside a panel: a lead, then sections with room between them */
.lead-t{font-size:22px;font-weight:600;letter-spacing:0;line-height:1.22;text-wrap:pretty}
.lead-p{margin:8px 0 0;color:var(--fg-2);font-size:15.5px;line-height:1.5}
.side-body > .lead-p:first-child{margin-top:0}
.sec{padding:24px 0;border-top:1px solid var(--line-soft)}
.sec:first-child{border-top:0;padding-top:8px}
.sec h4{font-size:15px;font-weight:600;letter-spacing:0;margin-bottom:8px}
.sec p{margin:0;font-size:15px;line-height:1.5;color:var(--fg-2)}
.sec .chips{display:flex;gap:8px;flex-wrap:wrap}
.cap{display:grid;gap:8px;justify-items:start;padding:16px;border-radius:16px;background:var(--card);font-size:15px;line-height:1.5}
.opt{display:flex;gap:16px;align-items:center;width:100%;padding:16px 0;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;color:inherit}
.opt:last-of-type{border-bottom:0}
.opt:hover b{text-decoration:underline;text-underline-offset:3px}
.opt > i{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--fg-2);font-size:13.5px;line-height:1.35}
.msg{display:flex;align-items:center;gap:16px;padding:12px 0;color:inherit}
.msg .av{width:48px;height:48px}
.msg img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--card)}
.msg > span:not(.av){flex:1;min-width:0}
.msg .av{flex:none}
.msg b{display:block;font-size:15.5px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg small{display:block;font-size:14px;line-height:1.35;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg em{flex:none;font-style:normal;font-size:13px;color:var(--fg-2)}
/* a note to the team: what you can ask sits above, the box you type in is always at the foot */
.asks-for{display:flex;flex-wrap:wrap;gap:8px}
.asks-for .chip{border-color:transparent;background:color-mix(in srgb,var(--fg) 7%,transparent)}   /* a soft grey, not a white pill */
.asks-for .chip:hover{background:color-mix(in srgb,var(--fg) 12%,transparent)}
.composer.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.composer{display:flex;align-items:flex-end;gap:8px;width:100%;padding:8px 8px 8px 18px;border:1px solid var(--line);border-radius:24px;background:var(--card)}
.composer:focus-within{border-color:var(--on-line)}
.composer textarea{flex:1;min-width:0;min-height:40px;max-height:168px;padding:9px 0;border:0;outline:0;background:none;resize:none;font:inherit;line-height:1.45;color:var(--fg);scrollbar-width:none}
.composer textarea::-webkit-scrollbar{display:none}
.composer .btn{flex:none;width:40px;height:40px;padding:0;border-radius:50%;margin:0}

/* ---------- onboarding: one column, centred. Jammie, one thought, one control ---------- */
.h1{font-size:calc(var(--h-size) * .8);line-height:1.08}
.h2{font-size:28px;line-height:1.14}
.lead{height:150px;width:auto}
.dots{position:absolute;top:36px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.dots i{width:20px;height:4px;border-radius:4px;background:var(--s3)}
.dots i.on{background:var(--on)}
.dots i.now{animation:fill .5s var(--ease) both;transform-origin:left}
.onb{position:relative;overflow-x:clip;min-height:var(--vh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:80px 24px 48px;text-align:center}
.brandmark{position:absolute;left:24px;top:24px;display:flex;align-items:center;gap:7px;color:var(--jam);font-weight:800;font-size:19px;letter-spacing:-.03em}
.brandmark img{height:28px}
.onb-art{position:relative;display:grid;place-items:center}
.onb-art .lead{height:min(240px,27vh)}
.onb-body{display:flex;flex-direction:column;align-items:center;gap:24px;width:100%}
.onb-body .h1,.onb-body .h2{max-width:18ch}
.pop{position:relative;animation:pop .7s var(--ease) both}   /* Jammie arrives by fading up a little. It never grows */
.bob{position:relative;animation:bob 3.4s ease-in-out .8s infinite}
.onb-body > *{animation:rise .65s var(--ease) both}
.onb-body > *:nth-child(2){animation-delay:.1s}
.onb-body > *:nth-child(3){animation-delay:.2s}
.curtain{position:fixed;inset:0;z-index:60;background:var(--jam);clip-path:circle(0% at var(--cx,50%) var(--cy,50%));animation:bloom .5s cubic-bezier(.6,0,.3,1) forwards}
.curtain.lift{clip-path:none;animation:lift .6s cubic-bezier(.6,0,.2,1) forwards}
.curtain img{position:absolute;left:50%;top:50%;height:120px;transform:translate(-50%,-50%);filter:brightness(0) invert(1);opacity:.9}
@keyframes pop{from{opacity:0;transform:translateY(16px)}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes land{from{opacity:0;transform:translateY(70px) rotate(-4deg) scale(.9)}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes bloom{to{clip-path:circle(150% at var(--cx,50%) var(--cy,50%))}}
@keyframes lift{to{transform:translateY(-100%)}}
@keyframes blink{50%{opacity:0}}
.feed.arrive .slide.at .fcard{animation:land .9s .25s cubic-bezier(.2,.9,.25,1.1) both}
.feed.arrive .story{animation:rise .5s both}
.feed.arrive .slide.at .acts > *{animation:rise .45s both}
/* Jammie moves: a short loop on white, laid onto the page */
.pop.v{mix-blend-mode:multiply}
.pop.v img{display:none}
.onb-art{--v:min(300px,32vh)}
.onb.small .onb-art{--v:min(170px,19vh)}
.pop.v video.lead{display:block;height:var(--v);aspect-ratio:1;object-fit:cover}
.onb.small .onb-art .lead{height:min(130px,15vh)}
/* in dark the white loops cannot be laid onto the page: the still stands in, at the size Jammie has inside the loop, and bobs */
html[data-theme="dark"] .pop.v{mix-blend-mode:normal;display:grid;place-items:center;height:var(--v)}
html[data-theme="dark"] .pop.v video{display:none!important}
html[data-theme="dark"] .pop.v img.lead{display:block;height:calc(var(--v) * .78);animation:bob 3.4s ease-in-out .8s infinite}
/* sign-in is a popup over the first screen: Google, or a name and an email */
.gate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.36);backdrop-filter:blur(3px);animation:fade var(--t) var(--ease)}
.gate-card{position:relative;width:min(392px,100%);max-height:calc(var(--vh) - 32px);overflow-y:auto;padding:24px;text-align:center;display:grid;justify-items:center;gap:16px;animation:rise var(--t) var(--ease) both;scrollbar-width:none}
.gate-card{--v:150px}
.gate-card .lead{height:120px}
.gate-card h2{font-size:24px;line-height:1.14}
.gate-card .btn{width:100%}
.gate-card form{display:grid;gap:8px;width:100%}
.gate-card .input{padding:9px 16px;text-align:left}
.x{position:absolute;top:12px;right:12px}
.or{display:flex;align-items:center;gap:12px;width:100%;color:var(--fg-2);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.store{display:flex;align-items:center;gap:8px;width:min(504px,100%);height:56px;padding:0 8px 0 24px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card)}
.store:focus-within{border-color:var(--on-line)}
.store input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font:inherit;font-size:16px}
.store .btn{border-radius:var(--r-pill);height:40px}
.store > [data-ico]{color:var(--fg-2)}
.gbtn{gap:10px}
.gbtn svg{width:18px;height:18px}
/* reading the store: the lines write themselves as each thing is read, and what was found hops in beside Jammie */
.hopstage{position:relative;display:grid;place-items:center;width:min(460px,92vw)}
.hop{position:absolute;left:var(--x);top:var(--y);height:min(68px,8vh);width:auto;opacity:0;filter:var(--felt)}
.hop.on{opacity:1;animation:in3d .85s cubic-bezier(.2,.9,.25,1.1) both,hop var(--d,2.2s) .85s infinite}
@keyframes hop{0%,100%{translate:0 0;animation-timing-function:cubic-bezier(.2,.6,.4,1)}50%{translate:0 -18px;animation-timing-function:cubic-bezier(.6,0,.8,.4)}}
.reading-line{margin:0;min-height:28px;font-size:18px;line-height:28px;font-weight:500;color:var(--fg-2)}
.reading-line span{display:inline-block;color:transparent;background:linear-gradient(90deg,var(--fg-3) 0%,var(--fg-3) 38%,var(--fg) 50%,var(--fg-3) 62%,var(--fg-3) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:rise var(--t) var(--ease) both,shimmer 2.6s linear infinite}   /* a light passes across the words while that thing is being read */
@keyframes shimmer{from{background-position:110% 0}to{background-position:-110% 0}}
/* three taps: every pick shows up on Jammie, or lands beside it */
.tapstage{display:flex;align-items:center;justify-content:center;gap:8px;height:min(250px,28vh)}
.tapstage .slot{position:relative;z-index:1;width:132px;height:100%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px}
.tapstage .slot img{height:min(84px,10vh);width:auto;filter:var(--felt)}
.tapstage .me .ground::after{width:min(150px,38%)}
/* where you post: four fixed places, one size. An icon lands in its own place and nothing already there moves */
#chanSlot{--ci:min(52px,6vh);display:grid;grid-template-rows:repeat(4,var(--ci));gap:6px;align-content:center;justify-items:center}
#chanSlot img{height:var(--ci)}
.tapstage .me{--v:min(250px,28vh);--lh:min(232px,26vh);flex:none;height:100%;width:var(--v);margin:0 calc((192px - var(--v)) / 2);display:grid;place-items:center}   /* as wide as the loop that stands on it, so Jammie is centred and the page around it never shifts */
.tapstage .me .lead{height:var(--lh)}
/* the plain still is cropped tighter than the dressed ones: draw it smaller and push it down so its size and feet match theirs */
.tapstage .me .pop:not(.v) img.lead,html[data-theme="dark"] .tapstage .me .pop.v img.lead{height:calc(var(--lh) * .86);margin-top:calc(var(--lh) * .14)}
html[data-theme="dark"] .tapstage .me .pop.v{height:auto}
/* a role change moves like one strip scrolled sideways: the look on stage and the next one travel the same distance together.
   Each one fades as it goes, from fully there to gone. Nothing clips them, so there is no edge to slide into */
.tapstage .me > *{grid-area:1/1;width:100%;display:grid;place-items:center}
.slide-in{animation:slide-in .62s cubic-bezier(.65,0,.35,1) both}
.slide-out{animation:slide-out .62s cubic-bezier(.65,0,.35,1) both}
@keyframes slide-in{from{opacity:0;transform:translateX(100%)}}
@keyframes slide-out{to{opacity:0;transform:translateX(-100%)}}
.in3d{animation:in3d .85s cubic-bezier(.2,.9,.25,1.1) both,sway3d 6s ease-in-out .85s infinite}
@keyframes in3d{0%{opacity:0;transform:perspective(500px) translateY(30px) rotateY(-80deg) rotateX(18deg) scale(.8)}60%{opacity:1;transform:perspective(500px) translateY(-5px) rotateY(14deg) rotateX(-3deg) scale(1.03)}100%{opacity:1;transform:perspective(500px) rotateY(0) scale(1)}}
@keyframes sway3d{0%,100%{transform:perspective(500px) rotateY(0)}25%{transform:perspective(500px) rotateY(14deg)}75%{transform:perspective(500px) rotateY(-14deg)}}
.asks{display:grid;gap:16px;width:min(560px,100%)}
.asks h4{font-size:14px;font-weight:600;letter-spacing:0;margin-bottom:8px}
.asks .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
/* from a laptop up, three taps is two sides: Jammie at full size, the questions beside it */
@media (min-width:1061px){
  .onb.split{flex-direction:row;gap:clamp(24px,5vw,84px)}
  .onb.split .onb-body{width:min(430px,100%);align-items:flex-start;text-align:left}
  .onb.split .asks{width:100%;gap:24px}
  .onb.split .asks .chips{justify-content:flex-start}
  .onb.split .tapstage{height:min(440px,52vh);gap:4px}
  .onb.split .tapstage .slot{width:150px}
  .onb.split .tapstage .slot img{height:min(104px,12vh)}
  .onb.split #chanSlot{--ci:min(80px,9.5vh);gap:8px}
  .onb.split .tapstage .me{--v:min(440px,52vh);--lh:min(400px,47vh);margin:0 calc((294px - var(--v)) / 2)}
}
/* hey, here it is: what Jammie read comes back as a passport for the brand. An open booklet lying on the table:
   a red cover showing round the edge, pages stacked under it, a fold down the middle, a shadow on the table, a stamp */
.pp-wrap{width:min(760px,100%);perspective:1600px;animation:land .9s cubic-bezier(.2,.9,.25,1.12) both}
.pp-cover{position:relative;padding:8px 8px 14px;border-radius:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--jam) 86%,#fff),var(--jam) 40%,color-mix(in srgb,var(--jam-2) 82%,#3A0B22));transform:rotateX(9deg) rotateZ(-1.4deg);transform-origin:50% 100%;box-shadow:0 2px 0 color-mix(in srgb,var(--jam-2) 70%,#000),0 34px 44px -22px rgba(70,20,30,.42),0 10px 18px -8px rgba(0,0,0,.2);transition:transform .6s var(--ease)}
.pp-cover:hover{transform:rotateX(3deg) rotateZ(-.4deg)}
.passport{position:relative;display:grid;grid-template-columns:5fr 6fr;border-radius:18px;overflow:hidden;text-align:left;background:var(--pp);
  background-image:repeating-radial-gradient(circle at 78% 16%,transparent 0 14px,color-mix(in srgb,var(--fg) 4%,transparent) 14px 15px);   /* the fine rings a passport page is printed with */
  box-shadow:0 2px 0 color-mix(in srgb,var(--pp) 86%,#000),0 4px 0 var(--pp),0 6px 0 color-mix(in srgb,var(--pp) 82%,#000)}   /* the edges of the pages under this one */
.pp-left{position:relative;min-width:0;padding:24px}
.pp-left::after{content:"";position:absolute;inset:0 0 0 auto;width:34px;background:linear-gradient(270deg,rgba(0,0,0,.13),transparent);pointer-events:none}   /* the page curls down into the fold */
.pp-photo{width:100%;height:100%;min-height:min(300px,34vh);object-fit:cover;border-radius:12px;box-shadow:0 0 0 4px var(--card),0 2px 8px rgba(0,0,0,.18)}
.pp-stamp{position:absolute;right:16px;bottom:10px;height:min(104px,12vh);width:auto;transform:rotate(-10deg);filter:drop-shadow(0 8px 6px rgba(0,0,0,.22));animation:stamp .5s .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes stamp{from{opacity:0;transform:rotate(-10deg) translateY(-26px)}}
.pp-right{position:relative;display:flex;flex-direction:column;min-width:0;gap:16px;padding:24px}
.pp-right::before{content:"";position:absolute;inset:0 auto 0 0;width:34px;background:linear-gradient(90deg,rgba(0,0,0,.13),transparent);pointer-events:none}
.pp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.pp-top img{height:40px;width:auto;filter:var(--felt)}
.pp-name{font-size:42px;font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:1}
.pp-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0}
.pp-facts dt{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-2)}
.pp-facts dd{margin:2px 0 0;font-size:16px;font-weight:600}
.pp-mrz{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);font:500 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap;overflow:hidden}
.swatches{display:flex;gap:6px}
.swatches i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 22%,transparent)}
@media (max-height:800px) and (min-width:861px){
  .onb.small{gap:16px;padding:64px 24px 24px}
  .onb.small .onb-art{--v:112px}
  .onb.small .onb-art .lead{height:96px}
  .pp-name{font-size:34px}
  .pp-right{gap:12px;padding:20px 24px 16px}
  .pp-photo{min-height:0}
}

/* ---------- the feed: stories across the card's width, then one tall card a stop ---------- */
.feed{--col-w:calc(var(--fc-h) * .625);height:100%;display:flex;flex-direction:column}
.stories-row{flex:none;display:flex;justify-content:center;padding:12px 24px 8px}
.stories{display:flex;justify-content:space-between;width:var(--col-w);max-width:100%}
.story{flex:none;width:60px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--fg-2);white-space:nowrap}
.story i{width:60px;height:60px;border-radius:50%;padding:2.5px;background:var(--jam);display:block}
.story.seen i{background:var(--line)}
.story i b{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);background:var(--s2) center/cover}
.story:hover{color:var(--fg)}
.story:focus-visible,.act:focus-visible{outline:0}
.story:focus-visible i,.act:focus-visible > i{outline:2px solid var(--on-line);outline-offset:2px}   /* the focus ring is a circle too */
.stage{flex:1;min-height:0;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:flex-start;justify-content:center;padding:6px 24px 0}   /* the top gap keeps a hairline of the next card from showing at the foot */
/* as on Winning Ads: the card itself is centred, and its actions hang outside it on the right, level with its foot */
.feed-col{position:relative;min-width:0}
.feed-col .acts{position:absolute;left:calc(100% + 12px);top:0;height:var(--fc-h);justify-content:flex-end;gap:4px}
body.has-side .stage,body.has-modal .stage{overflow:hidden}
.fab{position:fixed;right:24px;bottom:24px;z-index:4;height:52px;padding:0 20px 0 6px;border-radius:99px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-2);display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:inherit;transition:opacity var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.fab:hover{box-shadow:var(--shadow-3)}
.fab span{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center}   /* Jammie sits in a circle */
.fab img{height:30px;width:auto}
body.has-side .fab{opacity:0;pointer-events:none}

/* ---------- story viewer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:grid;place-items:center;padding:24px 24px 24px 84px;animation:fade var(--t) var(--ease)}   /* 84px: centred over the page, not the rail */
.sview{width:min(432px,100%);max-height:calc(var(--vh) - 48px);overflow-y:auto;padding:16px;animation:rise var(--t) var(--ease) both}
.sview-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;font-size:14px}
.sview-h .ico-btn{width:32px;height:32px}
.sview-h .story{width:34px;pointer-events:none}
.sview-h .story i{width:34px;height:34px}
.sview img.pic{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}
.sview h2{font-size:22px;line-height:1.18;margin:16px 0 8px;text-wrap:pretty}
.sview p{margin:0;color:var(--fg-2);font-size:14.5px}
.sview .btn{width:100%;margin-top:16px}

/* ---------- every page is a deck: equal columns that run the full height and scroll on their own ---------- */
.deck{height:100%;display:flex;flex-direction:column;padding-top:var(--bar)}
.deck-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.deck-tabs button{flex:none;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:0;border-radius:var(--r-pill);background:none;font-size:13.5px;color:var(--fg-2)}
.deck-tabs button:hover{background:var(--s2);color:var(--fg)}
.deck-tabs i,.dcol-h i{width:7px;height:7px;border-radius:50%;background:var(--s3);flex:none}
.deck-tabs i.need,.dcol-h i.need{background:var(--jam)}
.deck-cols{flex:1;min-height:0;display:flex;overflow-x:auto;scrollbar-width:thin}
.dcol{flex:1 0 0;min-width:272px;max-width:480px;display:flex;flex-direction:column;border-right:1px solid var(--line-soft)}   /* the columns share the width, so five of them fill a laptop */
.dcol.flash .dcol-h{animation:flash 1s var(--ease)}
@keyframes flash{from{background:var(--s3)}}
.dcol-h{flex:none;display:flex;align-items:center;gap:8px;height:56px;padding:0 24px;font-weight:600;font-size:15.5px;border-bottom:1px solid var(--line-soft)}
.dcol-h small{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--fg-2)}
.dcol-h small.need{color:var(--jam);font-weight:600}
.dcol-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column}
.dcol-body > *{flex:none}
.dcard{display:block;width:100%;padding:16px 24px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;color:inherit}
button.dcard{min-height:88px}
button.dcard:hover{background:var(--s2)}
.dcard.need{box-shadow:inset 3px 0 0 var(--jam)}
.dcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--fg-2)}
.dcard .top em{font-style:normal;font-size:12px;color:var(--fg-2)}
.dcard .top em.need{color:var(--jam);font-weight:600}
.dcard .big{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.dcard .delta{color:var(--fg-2)}   /* red is kept for the one card that needs you */
.dcard .big:first-child{margin-top:0}
.dcard .big b{font-size:30px;font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:1.1}
.dcard .big b.t{font-size:17px;font-weight:600;letter-spacing:0;line-height:1.3}
.dcard .line{margin:4px 0 0;font-size:13.5px;line-height:1.4;color:var(--fg-2)}
.bars{display:flex;align-items:flex-end;gap:4px;height:48px;margin:16px 0 0}
.bars i{flex:1;border-radius:3px 3px 1px 1px;background:var(--s3)}
.bars i.hi{background:var(--on)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:8px;margin-top:16px}
.mini button{border:0;background:none;padding:0;text-align:left;color:inherit}
.mini small{display:block;font-size:12px;color:var(--fg-2)}
.mini b{display:block;font-size:15px;font-weight:600}
.dcard .foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin-top:16px}
.dcard .foot button{border:0;background:none;padding:0;font-size:13px;font-weight:500;color:var(--fg-2)}
.dcard .foot button:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.dcard .foot .btn{height:32px;padding:0 12px;font-size:13px;margin-left:auto}
/* the second row under the top bar: a page's own tabs live here, never in the top bar */
.subbar{flex:none;display:flex;align-items:center;height:48px;padding:0 16px;border-bottom:1px solid var(--line-soft);background:var(--bg)}
.subbar .deck-tabs button.on{background:var(--s2);color:var(--fg);font-weight:600}
/* the smaller pages (Saved, Memory, Connectors): one column in the middle, scrolling under the bar */
.page{height:100%;display:flex;flex-direction:column;padding-top:var(--bar)}
.page-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.page-body{max-width:1040px;margin:0 auto;padding:32px 32px 96px}
.page-body.narrow{max-width:720px}
.sec-t{font-size:18px;margin:32px 0 16px;scroll-margin-top:16px}
.sec-t:first-child{margin-top:0}
.hello{display:flex;align-items:center;gap:12px;margin:0 0 24px;font-size:16.5px}
.hello img{height:52px;width:auto}
/* saved: plain idea cards */
.ideas{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.page-empty{display:grid;justify-items:center;gap:4px;padding:80px 0;text-align:center;color:var(--fg-2)}
.page-empty img{height:120px;width:auto;margin-bottom:8px}
.page-empty h3{font-size:19px;font-weight:600;letter-spacing:0;color:var(--fg)}
/* memory: the brand book with everything written on it, standing at an angle, and what Jammie knows as tiles */
.learn{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start}
.shelf{position:sticky;top:0;display:grid;justify-items:center;gap:24px;padding-top:8px}
.bk{position:relative;width:216px;aspect-ratio:3/4;transform:perspective(900px) rotateY(-22deg) rotateX(5deg);transform-origin:0 50%;transition:transform .6s var(--ease)}
.bk:hover{transform:perspective(900px) rotateY(-8deg) rotateX(2deg)}
.bk::before{content:"";position:absolute;inset:5px -11px 5px auto;width:13px;border-radius:0 3px 3px 0;background:repeating-linear-gradient(180deg,#F6EFE3 0 2px,#E3D8C6 2px 3px);transform:skewY(-28deg);transform-origin:0 0}   /* the edges of its pages */
.bk::after{content:"";position:absolute;left:4%;right:-12%;bottom:-18px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.22),transparent);z-index:-1}   /* where it stands */
.bk-cover{position:absolute;inset:0;padding:20px 18px 18px 26px;border-radius:4px 12px 12px 4px;color:#fff;text-align:left;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--jam) 84%,#fff),var(--jam) 42%,color-mix(in srgb,var(--jam-2) 84%,#3A0B22));
  box-shadow:inset 12px 0 0 rgba(0,0,0,.14),inset 14px 0 0 rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.3)}   /* the band is its spine */
.bk-cover small{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.86}
.bk-cover b{display:block;margin-top:8px;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.bk-cover p{margin:8px 0 0;font-size:13px;line-height:1.35;opacity:.92;max-width:15ch}
.bk-cover img{position:absolute;right:14px;bottom:16px;width:52%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);transform:rotate(5deg)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ltile{display:block;min-height:96px;padding:16px;border:1px solid var(--line-soft);border-radius:16px;background:var(--card);text-align:left;color:inherit}
.ltile:hover{border-color:var(--line)}
.ltile b{display:block;font-size:24px;font-weight:var(--h-weight);line-height:1.15}
.ltile b.t{font-size:16px;font-weight:600;line-height:1.3}
.ltile small{display:block;margin-top:4px;color:var(--fg-2);font-size:13.5px;line-height:1.4}
/* connectors: Shopify first, then everything else in one list */
.rowi img.logo{flex:none;width:36px;height:36px;object-fit:contain;filter:var(--felt)}
.rowi.first{padding:20px 16px}
.rowi.first img.logo{width:48px;height:48px}
.rowi.first b{font-size:17px}
.logo-tile{flex:none;width:36px;height:36px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-weight:700;font-size:14px}

.toasts{position:fixed;left:calc(30px + 50vw);top:72px;transform:translateX(-50%);z-index:40;display:grid;justify-items:center;gap:8px;pointer-events:none;transition:left var(--t) var(--ease)}   /* under the bar and centred on the page, clear of the card's words and its actions */
body.has-side .toasts{left:calc(30px + 50vw - var(--side-w) / 2)}
body.bare .toasts{left:50%}
.toasts .toast{animation:toast 2.6s var(--ease) forwards}
html.still *{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important}
html.still ::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){.reading-line span{animation:none;color:var(--fg);background:none}.pp-cover{transform:none}.pop,.bob,.pp-wrap,.in3d,.hop,.slide-in,.slide-out,.curtain,.onb-body > *,.feed.arrive *,.page-in,.side-body,.pp-stamp{animation:none!important}.hop{opacity:1}}

/* ---------- phone: one 16px gutter everywhere, everything you tap at least 40px ---------- */
@media (max-width:860px){
  body{padding-left:0}
  #app{height:calc(var(--vh) - 58px)}
  .rail{inset:auto 0 0 0;width:auto;height:calc(58px + env(safe-area-inset-bottom));flex-direction:row;justify-content:space-around;padding:0 8px env(safe-area-inset-bottom);border-right:0;border-top:1px solid var(--line-soft)}
  .rail .rail-brand{display:none}
  .rail-nav,.rail-nav.low{display:contents}   /* five icons, evenly spaced */
  .rail-nav a::after{display:none}
  .rail a{width:44px;height:44px}
  .topbar{left:0;padding:0 16px}
  .subbar{padding:0 8px}
  .deck-tabs button{height:36px}
  .page-body{padding:24px 16px 96px}
  .learn{grid-template-columns:1fr;gap:32px}
  .shelf{position:static}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .ideas{grid-template-columns:1fr 1fr;gap:16px}
  .icard-body{padding:12px}
  .toasts,body.has-side .toasts,body.bare .toasts{left:16px;right:16px;top:72px;transform:none}
  .ico-btn,.sview-h .ico-btn{width:44px;height:44px}
  .b-sm,.chip,.seg button{height:40px}
  button.pill{height:40px;min-width:40px;justify-content:center}
  .composer textarea,.input input{font-size:16px}   /* under 16px, iOS zooms the page when you tap a field */
  /* a panel is a sheet that rises from the foot, over a shade you can tap to close it */
  body.has-side{background:var(--bg)}
  body.has-side #app{margin-right:0;border-radius:0;box-shadow:none}
  body.has-side .topbar{right:0;border-radius:0}
  #shade{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity var(--t) var(--ease)}
  body.has-side #shade{opacity:1;pointer-events:auto}
  #side{top:auto;left:0;width:auto;max-height:calc(var(--vh) * .86);z-index:30;background:var(--card);border-top:1px solid var(--line-soft);border-radius:24px 24px 0 0;box-shadow:var(--shadow-3);visibility:visible;opacity:1;transform:translateY(105%);transition:transform var(--t) var(--ease)}
  body.has-side #side{transform:none;transition:transform var(--t) var(--ease)}
  #side::before{content:"";flex:none;width:36px;height:4px;margin:8px auto -4px;border-radius:4px;background:var(--line)}
  .side-h{padding:0 8px 0 16px}
  .side-foot .ico-btn:first-child{margin-left:-13px}
  .scrim{padding:16px}
  .dcol,.dcol.wide{flex:none;max-width:none}
  .dcard{padding:16px}
  .side-body{padding:8px 16px 24px}
  .side-foot{padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .side-empty{padding:32px 0}
  .opt > i,.cap{background:var(--s2)}
  /* feed: the picture fills the screen, so everything on it sits on a dark backing and stays readable */
  .feed{--fc-h:calc(var(--vh) - 58px - 104px)}
  .stories-row{justify-content:flex-start;margin-right:108px;padding:10px 0 6px 16px;overflow-x:auto;scrollbar-width:none}   /* the row stops before the two buttons top right, and scrolls */
  .stories-row::-webkit-scrollbar{display:none}
  .stories{width:auto;max-width:none;gap:8px;justify-content:flex-start}
  .story{width:46px;font-size:11px;overflow:hidden;text-overflow:ellipsis;display:block;text-align:center}
  .story i{width:46px;height:46px;margin-bottom:4px}
  .slide{padding:8px 16px 0}
  .feed-col,.fcard{width:100%}
  .fc-media,.fcard.plain{width:100%;height:var(--fc-h);aspect-ratio:auto}
  .fc-over{padding:64px 72px 16px 16px}
  .fcard-top{justify-content:flex-start}
  .feed-col .acts{left:auto;right:8px;top:auto;bottom:72px;z-index:3;height:auto;gap:2px}
  .feed-col .act{width:48px;padding:0 0 2px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .feed-col .act > i{width:38px;height:38px;background:rgba(0,0,0,.34);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .feed-col .act .ico{color:#fff}
  .feed-col .act:hover > i{background:rgba(0,0,0,.5)}
  .feed-col .act.jam > i{width:46px;height:46px;background:linear-gradient(135deg,color-mix(in srgb,var(--jam) 78%,#fff),var(--jam) 45%,var(--jam-2))}
  .fab{right:16px;bottom:74px;height:52px;width:52px;padding:0;justify-content:center;font-size:0;gap:0}
  .fab span{width:42px;height:42px}
  /* decks: one column a screen, with its cards' actions big enough to tap */
  .deck-cols{scroll-snap-type:x mandatory}
  .dcol,.dcol.wide{width:88vw;scroll-snap-align:start}
  .dcol-h{padding:0 16px}
  .dcard .foot{gap:0 16px;margin-top:8px}
  .dcard .foot button{min-height:40px}
  .dcard .foot .btn{height:40px}
  .mini{margin-top:16px}
  /* onboarding */
  .onb{padding:64px 16px 32px;gap:16px}
  .brandmark{left:16px}
  .onb-art{--v:200px}
  .hop{height:48px}
  .store{flex-wrap:wrap;height:auto;gap:8px;padding:0;border:0;background:none}   /* the field gets the whole row, the button its own */
  .store > [data-ico]{display:none}
  .store input{flex:none;width:100%;height:56px;padding:0 20px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card)}
  .store .btn{width:100%;height:48px}
  .tapstage{height:176px;gap:2px}
  .tapstage .slot{width:92px}
  .tapstage .slot img{height:58px}
  #chanSlot{--ci:36px;gap:4px}
  .tapstage .me{--v:176px;--lh:164px;width:190px;margin:0 -30px}
  .asks .chips{display:grid;grid-template-columns:1fr 1fr}
  .asks .chip{justify-content:center}
  .onb.small .onb-art{--v:112px}
  .onb.small .onb-art .lead{height:96px}
  .pp-cover{padding:6px 6px 10px;border-radius:22px;transform:rotateX(5deg) rotateZ(-.8deg)}
  .passport{grid-template-columns:minmax(0,1fr);border-radius:16px}
  .pp-left{padding:16px 16px 0}
  .pp-left::after,.pp-right::before{display:none}
  .pp-photo{min-height:0;height:120px}
  .pp-stamp{height:72px;right:8px;bottom:-16px}
  .pp-top img{display:none}
  .pp-right{padding:16px;gap:12px}
  .pp-name{font-size:32px}
  .pp-facts{gap:8px 16px}
  .pp-mrz{display:none}
}
/* a short phone: fewer actions on the picture (Less and Note are in Why), a shorter stage for the three taps */
@media (max-width:860px) and (max-height:700px){
  .feed-col .act[data-do="less"],.feed-col .act[data-do="feedback"]{display:none}
  .tapstage{height:128px}
  .tapstage .me{--v:128px;--lh:120px;width:150px;margin:0 -24px}
  .tapstage .slot img{height:44px}
  #chanSlot{--ci:28px}
}

<body>
<nav class="rail" aria-label="main">
  <a class="rail-brand" href="#/feed" aria-label="jammie"><img src="assets/jammie/v3/char-dollop.png" alt=""></a>
  <div class="rail-nav">
    <a class="draw" data-nav="feed" href="#/feed" aria-label="Feed"><i data-ico="home"></i></a>
    <a class="draw" data-nav="command" href="#/command" aria-label="Command centre"><i data-ico="chart"></i></a>
    <a class="draw" data-nav="saved" href="#/saved" aria-label="Saved"><i data-ico="bookmark"></i></a>
  </div>
  <div class="rail-nav low">
    <a class="draw" data-nav="memory" href="#/memory" aria-label="Memory"><i data-ico="book"></i></a>
    <a class="draw" data-nav="connectors" href="#/connectors" aria-label="Connectors"><i data-ico="link"></i></a>
  </div>
</nav>
<header class="topbar" id="topbar">
  <h1 id="barTitle"></h1>
  <div class="top-right">
    <a class="ico-btn draw" id="bellBtn" href="#/bell" aria-label="Updates"><i data-ico="bell"></i><em id="bellN" hidden></em></a>
    <a class="ico-btn draw" id="youBtn" href="#/you" aria-label="You"><i data-ico="user"></i></a>
  </div>
</header>
<a class="fab draw" href="#/new" aria-label="Ask the team for something new"><span><img src="assets/jammie/v3/char-dollop.png" alt=""></span>New</a>
<main id="app"></main>
<aside id="side" aria-label="panel"></aside>
<div id="shade"></div>
<div id="modal"></div>
<div class="toasts" id="toasts"></div>

<script src="assets/jammie/v3/icons.js?v=17"></script>
<script src="assets/jammie/v3/data.js?v=17"></script>
<script>
(() => {
  const { A, D, IDEAS, real, av, fcard, turnFrame } = window.JAMMIE;
  const $ = id => document.getElementById(id);
  const root = document.documentElement, app = $('app'), sideEl = $('side'), modal = $('modal');
  const STILL = new URLSearchParams(location.search).has('still');   // the flow map shows screens at rest
  if (STILL) root.classList.add('still');
  const ico = n => `<i data-ico="${n}"></i>`;

  // the workbench and the prototype share one saved look: tuned tokens, and light or dark
  const KEY = 'jammie-workbench-v5';
  let tune = {}; try { tune = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  const forced = new URLSearchParams(location.search).get('theme');   // ?theme=dark shows a screen dark without saving it
  function paint(theme){
    root.dataset.theme = theme;
    [...root.style].filter(k => k.startsWith('--')).forEach(k => root.style.removeProperty(k));
    Object.entries(tune).forEach(([k, v]) => { if (k.startsWith('--')) root.style.setProperty(k, v); });
    Object.entries((tune.themed && tune.themed[theme]) || {}).forEach(([k, v]) => root.style.setProperty(k, v));
  }
  paint(forced || tune.theme || 'light');
  function setTheme(theme){ tune.theme = theme; try { localStorage.setItem(KEY, JSON.stringify(tune)); } catch {} paint(theme); }

  // ---- state: where we are in the feed, what was kept or put aside, what went to the team

            ${KNOWS.map(([name, tiles], i) => `<h2 class="sec-t" id="know${i}">${name}</h2><div class="tiles">${tiles.map(t => tile(...t)).join('')}</div>`).join('')}
          </div>
        </div>`, KNOWS.map(([name], i) => `<button data-do="jump" data-id="know${i}">${name}</button>`).join('')) },
    connectors: { title: 'Connectors', page: () => page(`
        <div class="hello"><img src="${A}pose-wave.png" alt=""><span>I can only see your public pages. Start with Shopify.</span></div>
        <div class="rows"><div class="rowi first">${logo('Shopify', 'shopify')}<span class="grow"><b>Shopify</b><small>See what actually sells</small></span><button class="btn b-jam draw" data-do="connect" data-id="Shopify">Connect Shopify${ico('arrow')}</button></div></div>
        <h2 class="sec-t">All tools</h2>
        <div class="rows">${TOOLS.map(([n, line, f]) => `<div class="rowi">${logo(n, f)}<span class="grow"><b>${n}</b><small>${line}</small></span><button class="btn b-line b-sm" data-do="connect" data-id="${n}">Connect</button></div>`).join('')}</div>`, '', 'narrow') },

    // ================= panels over the feed: they are about the card on screen =================
    idea: { under: 'feed', panel: () => { const d = curIdea(); return { title: 'Why this idea', body: `
        <div class="sec"><h3 class="lead-t">${d.title}</h3><p class="lead-p">${d.line}</p></div>
        <div class="sec"><h4>Caption</h4><div class="cap">${d.id === 'reel' ? 'A girl walks into a ramen bar. Her sneaker orders seconds. Comet × Naru. Sound on.' : d.title + '. Only at Comet.'}<button class="btn b-soft b-sm draw" data-do="copy">${ico('link')}Copy caption</button></div></div>
        <div class="sec"><h4>Why this · 3 sources</h4><div class="rows">
          <button class="rowi" data-do="source"><span class="grow"><b>₹5,499 · Comet Aeres</b><small>Your own ad that kept running · 4 versions, 2 days live</small></span>${ico('arrow')}</button>
          <button class="rowi" data-do="source"><span class="grow"><b>The Comet Collection</b><small>Your own ad that kept running · 2 versions, 24 days live</small></span>${ico('arrow')}</button>
          <button class="rowi" data-do="plan"><span class="grow"><b>The full plan</b></span>${ico('arrow')}</button></div></div>
        <div class="sec"><h4>Check it against your real numbers</h4><div class="chips"><a class="chip" href="#/connectors">Meta Ads</a><a class="chip" href="#/connectors">Shopify</a><a class="chip" href="#/connectors">Google Analytics</a></div></div>
        <div class="sec"><h4>How we’ll know</h4><p>Saves and shares per 1,000 people reached, read after 7 days.</p></div>
        <div class="sec"><h4>Where it goes</h4><p>${d.goes}. You post it yourself.</p></div>`,
        foot: `<button class="ico-btn draw ${liked.has(d.id) ? 'liked' : ''}" data-do="keep" aria-label="Keep">${ico('heart')}</button><button class="ico-btn draw" data-do="share" aria-label="Share">${ico('share')}</button><a class="btn b-jam draw" href="#/jam">Let’s jam${ico('arrow')}</a>` }; } },
    jam: { under: 'feed', panel: () => ({ title: 'Let’s jam on this', body: `
        <button class="opt" data-do="ship"><i>${ico('share')}</i><span><b>Ship as is</b><small>The files, the caption and a make-it-yourself kit. In your inbox too.</small></span></button>
        <a class="opt" href="#/change"><i>${ico('message')}</i><span><b>Change first</b><small>Say what to change. The team answers within 24 hours.</small></span></a>
        <button class="opt" data-do="morelike"><i>${ico('heart')}</i><span><b>More like this</b><small>Jammie learns it. More ideas like this one.</small></span></button>
        <a class="opt" href="#/sloosh"><i>${ico('spark')}</i><span><b>Make it with Sloosh</b><small>A full video, made on Sloosh. You see the exact credits first.</small></span></a>` }) },
    change: { under: 'feed', panel: () => ({ title: 'Change first', back: '#/jam', body: `
        <p class="lead-p">A person from our team takes it from here.</p>`, ask: 1, foot: ask(['A different opening line', 'Make it shorter', 'Use another photo'], 'What to change, what to keep…', 'sendchange') }) },
    note: { under: 'feed', panel: () => ({ title: 'Note to the team', body: `
        <p class="lead-p">Say anything about this idea. A person from our team reads it.</p>`, ask: 1, foot: ask(['Not right for us', 'Wrong product', 'Make more like this'], 'Your note about this idea…', 'sendchange') }) },
    sloosh: { under: 'feed', panel: () => ({ title: 'Make it with Sloosh', back: '#/jam', body: `
        <p class="lead-p" style="margin-bottom:16px">You see the cost before anything is made.</p>
        <div class="rows"><div class="rowi"><small class="grow">What</small><b>${curIdea().goes}</b></div><div class="rowi"><small class="grow">Takes</small><b>About 4 minutes</b></div><div class="rowi"><small class="grow">Credits</small><b>120</b></div></div>`,
        foot: `<a class="btn b-out" href="#/jam" style="margin:0">Not now</a><button class="btn b-jam draw" data-do="makesloosh">Make it${ico('arrow')}</button>` }) },
    // ================= panels over any page =================
    new: { panel: () => ({ title: 'Ask the team', body: `
        <p class="lead-p">A person from our team takes it from here. Ask for anything, big or small.</p>`, ask: 1, foot: ask(['A launch film', 'A reply to a thread', 'A new product page'], 'Tell us what you need…', 'sendnote') }) },
    bell: { panel: () => ({ title: 'Updates', foot: orders.length ? `<button class="btn b-text" data-do="clearall" style="margin:0">Clear all</button>` : '', body: orders.length ? orders.map(msgRow).join('')
        : `<div class="side-empty"><img src="${A}pose-sleep.png" alt=""><h3>All quiet.</h3><p>Nothing new since you looked.</p></div>` }) },
    you: { panel: () => { const row = (t, s, what) => `<button class="rowi" data-do="${what}"><span class="grow"><b>${t}</b>${s ? `<small>${s}</small>` : ''}</span>${ico('arrow')}</button>`; return { title: 'You', body: `
        <div class="sec"><div class="rows"><div class="rowi">${av(40)}<span class="grow"><b>You</b><small>Admin · Comet</small></span><button class="btn b-line b-sm" data-do="rename">Change name</button></div></div></div>
        <div class="sec"><h4>Look</h4><div class="seg">${['light', 'dark'].map(t => `<button class="${root.dataset.theme === t ? 'on' : ''}" data-do="theme" data-id="${t}">${t === 'light' ? 'Light' : 'Dark'}</button>`).join('')}</div></div>
        <div class="sec"><h4>Your jam</h4><div class="rows">${row('What Jammie learns', 'Learning from you', 'learns')}${row('Start again from the first screen', '', 'restart')}</div></div>
        <div class="sec"><h4>Help</h4><div class="rows">${row('Email us', 'toast@jammie.ai', 'help')}${row('Privacy', '', 'legal')}${row('Terms', '', 'legal')}</div></div>` }; } },
    // ================= a story, over the feed =================
    story: { under: 'feed', modal: q => { const s = +(q.get('s') || 0) % STORIES.length, [name, id] = STORIES[s], d = idea(id); seen.add(s);
        app.querySelectorAll('.stories .story').forEach((el, i) => el.classList.toggle('seen', seen.has(i)));
        return `<div class="scrim"><div class="sheet sview">
        <div class="sview-h"><span class="story"><i><b style="background-image:url(${D}${d.img})"></b></i></span>${name}
          <span style="margin-left:auto;display:flex">
            <a class="ico-btn draw" href="#/story?s=${(s + STORIES.length - 1) % STORIES.length}" aria-label="Previous">${ico('back')}</a>
            <a class="ico-btn draw" href="#/story?s=${(s + 1) % STORIES.length}" aria-label="Next">${ico('arrow')}</a>
            <a class="ico-btn draw" href="#/feed" aria-label="Close">${ico('close')}</a></span></div>
        <img class="pic" src="${D}${d.img}" alt="">
        <h2>${d.title}</h2><p>${d.line}</p>
        <a class="btn b-jam draw" href="#/jam" data-open="${d.id}">Make this${ico('arrow')}</a></div></div>`; } },
  };

  // ---- drawing a screen. The page is redrawn only when it changes, so the feed keeps its place and the bar never flickers
  const slideH = sc => sc.scrollHeight / sc.children.length;   // a card's true height, which is rarely a whole pixel: rounding it cut later cards at the top
  const markSlides = () => app.querySelectorAll('.slide').forEach((el, i) => { el.inert = i !== cur; });   // only the card on screen takes the keyboard
  function wireFeed(){
    const sc = app.querySelector('.stage'); if (!sc) return;
    sc.scrollTop = cur * slideH(sc); markSlides();
    sc.addEventListener('scroll', () => { const i = Math.round(sc.scrollTop / slideH(sc)); if (IDEAS[i]) { cur = i; markSlides(); } }, { passive: true });
  }
  function render(force){
    timers.forEach(clearTimeout); timers = [];
    const [raw, query] = (location.hash.replace(/^#\/?/, '') || 'start').split('?');
    const name = SCREENS[raw] ? raw : 'start', s = SCREENS[name], q = new URLSearchParams(query || '');
    const over = q.get('on'), layer = !!(s.panel || s.modal);                 // ?on=command: show this panel over that page
    const pageName = layer ? (s.under || (SCREENS[over] && SCREENS[over].page && !SCREENS[over].bare ? over : lastPage)) : name, pg = SCREENS[pageName];
    const jump = q.get('i') !== null && IDEAS[+q.get('i')]; if (jump) cur = +q.get('i');
    if (!pg.bare) lastPage = pageName;
    document.body.classList.toggle('bare', !!pg.bare);
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === pageName));
    if (force || shown !== pageName) {
      app.innerHTML = pg.page(q); shown = pageName;
      window.jammieIcons(app); wireFeed();
      if (!pg.bare && !STILL) app.firstElementChild.classList.add('page-in');
      app.scrollTop = 0; if (pg.bare) window.scrollTo(0, 0);
      if (pg.enter) pg.enter();
    } else if (pageName === 'feed') { const sc = app.querySelector('.stage');                 // the feed was not redrawn: bring it to the card we mean
      if (Math.round(sc.scrollTop / slideH(sc)) !== cur) sc.scrollTo({ top: cur * slideH(sc), behavior: jump || calm ? 'auto' : 'smooth' });
      markSlides(); }
    arriving = false;
    // the panel and the modal
    const p = s.panel ? s.panel(q) : null, home = '#/' + pageName;
    document.body.classList.toggle('has-side', !!p); document.body.classList.toggle('has-modal', !!s.modal);
    if (p) { sideEl.innerHTML = `<header class="side-h">${p.back ? `<a class="ico-btn back draw" href="${p.back}" aria-label="Back">${ico('back')}</a>` : ''}<h2>${p.title}</h2><a class="ico-btn draw" href="${home}" aria-label="Close">${ico('close')}</a></header>
      <div class="side-body">${p.body}</div>${p.foot ? `<footer class="side-foot ${p.ask ? 'ask' : ''}">${p.foot}</footer>` : ''}`; window.jammieIcons(sideEl); }
    modal.innerHTML = s.modal ? s.modal(q) : ''; window.jammieIcons(modal); app.inert = !!s.modal;   // what is under a popup takes no clicks or keys
    // the top bar: same place on every page. It only changes its words
    $('topbar').classList.toggle('solid', pageName !== 'feed');
    $('barTitle').textContent = pg.title || '';
    [['bellBtn', 'bell'], ['youBtn', 'you']].forEach(([id, n]) => { $(id).classList.toggle('on', name === n); $(id).setAttribute('href', name === n ? home : '#/' + n); });
    if (name === 'bell') { readN = orders.length; keep('jammie-proto-read', readN); }
    const unread = Math.max(0, orders.length - readN); $('bellN').hidden = !unread; $('bellN').textContent = unread;
  }
  // move the feed's own scroll to a card; a second press while it is still moving counts from where it is heading
  let aim = 0, aimAt = 0;
  const onFeed = () => /^#\/feed(\?|$)/.test(location.hash);
  function show(n){
    const sc = app.querySelector('.stage');
    if (!sc || !onFeed()) { cur = n; if (location.hash === '#/feed') render(true); else location.hash = '#/feed'; return; }
    const from = Date.now() - aimAt < 600 ? aim : cur; aim = n; aimAt = Date.now();
    sc.scrollTo({ top: n * slideH(sc), behavior: calm || Math.abs(n - from) > 1 ? 'auto' : 'smooth' });
  }
  function step(dir, wrap = true){ const from = Date.now() - aimAt < 600 ? aim : cur, n = from + dir;
    if (!wrap && (n < 0 || n >= IDEAS.length)) return; show((n + IDEAS.length) % IDEAS.length); }
  const go = h => { if (location.hash === h) render(true); else location.hash = h; };
  const home = () => go('#/' + lastPage);

  const DO = {
    keep: b => { const d = curIdea(); liked.has(d.id) ? liked.delete(d.id) : liked.add(d.id); saveSet('liked'); document.querySelectorAll('[data-do="keep"]').forEach(x => { if (!x.closest('.slide') || x.closest('.slide:not([inert])')) x.classList.toggle('liked', liked.has(d.id)); }); if (liked.has(d.id)) toast('Kept. It is in Saved.'); },
    share: () => toast('Link copied'), copy: () => toast('Caption copied'),
    later: () => { SETS.later.add(curIdea().id); saveSet('later'); toast('Put aside. It is in Saved.', 'sleep'); step(1, false); },
    less: () => { toast('Got it. Fewer like this.', 'worry'); step(1, false); },
    unsave: b => { ['liked', 'later'].forEach(n => { SETS[n].delete(b.dataset.id); saveSet(n); }); render(true); },
    savedtab: b => { savedTab = b.dataset.id; render(true); },
    jump: b => { const el = $(b.dataset.id); if (el) el.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' }); },
    sound: b => { const v = b.closest('.fc-media').querySelector('video'); v.muted = !v.muted; b.innerHTML = ico(v.muted ? 'mute' : 'sound'); window.jammieIcons(b); b.setAttribute('aria-label', v.muted ? 'Sound on' : 'Sound off'); toast(v.muted ? 'Sound off' : 'Sound on'); },
    ship: () => { send('ship', curIdea().id); go('#/feed'); toast('Sent to the team. Files land in your inbox.'); },
    sendchange: () => { send('change', curIdea().id); go('#/feed'); toast('Sent to the team. They answer within 24 hours.'); },
    sendnote: text => { send('note', null, text); home(); toast('Sent to the team. They answer within 24 hours.'); },
    makesloosh: () => { send('sloosh', curIdea().id); go('#/feed'); toast('On it. About 4 minutes.'); },
    morelike: () => { toast('Noted. More like this one.'); step(1, false); },
    suggest: b => { const t = sideEl.querySelector('.composer textarea'); if (t) { t.value = b.textContent; t.focus(); } },
    noshopify: () => { toast('No problem. Estimates stay.', 'sleep'); step(1, false); }, more8: () => toast('8 more are on the way'),
    connect: b => toast(`${b.dataset.id} opens its own sign-in`, 'search'), feed: () => go('#/feed'), bell: () => go('#/bell'),
    col: b => { const c = $('dcol' + b.dataset.id); if (!c) return; c.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', inline: 'start', block: 'nearest' });
      c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); },   // the column you jumped to lights up for a moment
    theme: b => { setTheme(b.dataset.id); b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); },   // only the switch changes: the panel is not redrawn
    clearall: () => { orders = []; keep('jammie-proto-orders', orders); readN = 0; keep('jammie-proto-read', 0); render(); },
    restart: () => go('#/start'), help: () => toast('Opens your email', 'search'),
  };
  const LATER = ['report', 'costs', 'park', 'more', 'source', 'plan', 'tile', 'openbook', 'addnote', 'rename', 'learns', 'legal'];

  document.addEventListener('click', e => {
    if (e.target.id === 'shade') { location.hash = '#/' + lastPage; return; }   // on a phone, a tap outside the sheet closes it
    if (e.target.matches('.gate,.scrim')) { location.hash = e.target.matches('.gate') ? '#/start' : '#/feed'; return; }   // a tap outside a popup closes it
    const bl = e.target.closest('[data-bloom]'); if (bl) { e.preventDefault(); bloom(e, bl.getAttribute('href')); return; }
    const sl = e.target.closest('.slide'); if (sl) cur = +sl.dataset.i;        // whatever was pressed belongs to this card
    const open = e.target.closest('[data-open]');
    if (open) { const i = IDEAS.findIndex(d => d.id === open.dataset.open); if (i > -1) cur = i; }
    const b = e.target.closest('[data-do]');
    if (b) { const what = b.dataset.do; if (DO[what]) DO[what](b); else if (LATER.includes(what)) toast('This opens in the full build', 'search'); return; }
    const card = e.target.closest('.feed-col .fcard:not(.plain)');           // the card itself opens the idea
    if (card && !e.target.closest('a,button')) { location.hash = '#/idea'; return; }
    const chip = e.target.closest('.chip');
    if (chip && chip.tagName === 'BUTTON') { const ask = chip.closest('[data-ask]'); if (!ask) return;
      if (ask.dataset.ask === 'chan') chip.classList.toggle('on');           // you can post in more than one place
      else ask.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
      tapPicked(ask); }
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-go]'); if (f) { e.preventDefault(); location.hash = f.dataset.go; return; }
    const c = e.target.closest('[data-send]'); if (c) { e.preventDefault(); const t = c.querySelector('textarea'), text = t.value.trim();
      if (!text) { t.focus(); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); return; }   // an empty note is not sent
      DO[c.dataset.send](text); }
  });
  document.addEventListener('input', e => { const t = e.target; if (t.matches && t.matches('.composer textarea')) { t.style.height = 'auto'; t.style.height = Math.min(168, t.scrollHeight) + 'px'; } });
  document.addEventListener('keydown', e => {
    const typing = e.target.matches && e.target.matches('input,textarea');
    if (typing && e.key === 'Enter' && !e.shiftKey && e.target.closest('.composer')) { e.preventDefault(); e.target.closest('form').requestSubmit(); return; }
    if (e.key === 'Escape') { if (/^#\/signin/.test(location.hash)) location.hash = '#/start'; else if (document.body.matches('.has-side,.has-modal')) location.hash = '#/' + lastPage; return; }
    if (typing || !onFeed()) return;
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); step(1, false); }   // the keys stop at the ends, as the wheel does
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); step(-1, false); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const fr = app.querySelector('.slide:not([inert]) .frames'); if (fr) turnFrame(fr, e.key === 'ArrowRight' ? 1 : -1); }
  });
  // Touch scrolls the feed natively and it stops on each card. A wheel or trackpad is turned into one card a gesture,
  // because a snapped list springs back unless the wheel travels half a card. A gesture starts small, so add it up.
  let wAcc = 0, wLast = 0, wAbs = 0, wArmed = true, wStep = 0;
  addEventListener('wheel', e => {
    if (e.ctrlKey || !onFeed() || !(e.target.closest && e.target.closest('.feed'))) return;
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;                                            // sideways moves a carousel's frames
    e.preventDefault();
    const now = Date.now(), abs = Math.abs(e.deltaY);
    if (now - wLast > 180) { wAcc = 0; wArmed = true; }                                             // a new gesture
    else if (!wArmed && now - wStep > 500 && abs > wAbs + 6 && abs >= 10) { wAcc = 0; wArmed = true; } // pushed again while the last one coasts
    wLast = now; wAbs = abs;
    if (!wArmed) return;
    wAcc += e.deltaY;
    if (Math.abs(wAcc) >= 36) { wArmed = false; wStep = now; step(wAcc > 0 ? 1 : -1, false); }
  }, { passive: false });
  addEventListener('hashchange', () => render());
  window.jammieIcons(document);   // the rail and the top bar are drawn once
  render();
})();
</script>
