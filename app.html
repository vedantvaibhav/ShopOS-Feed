<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jammie</title>
<link rel="icon" href="assets/jammie/v3/char-dollop-sm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/jammie/v3/jammie.css?v=28">
<style>
/* screens only: every token and shared piece comes from jammie.css */
:root{--side-w:min(440px,100vw);--bar:64px;--t:.45s;--t2:.32s;--pp:#FBF7F0;--vh:100vh}
@supports (height:100dvh){:root{--vh:100dvh}}   /* on a phone, the height you can see while the browser's bars show */
:root[data-theme="dark"]{--pp:#1D1A16}
body{padding-left:60px;height:var(--vh);overflow:hidden}
body.bare{padding-left:0;height:auto;overflow-x:hidden;overflow-y:auto}
body.bare .rail,body.bare .fab,body.bare .topbar{display:none}
a{text-decoration:none}

/* ---------- the shell: one top bar that never moves, a page under it, and a panel that opens beside the page ---------- */
#app{position:relative;height:var(--vh);background:var(--bg);transition:margin-right var(--t2) var(--ease),border-radius var(--t2) var(--ease),box-shadow var(--t2) var(--ease),background .3s var(--ease)}
body.bare #app{height:auto;min-height:var(--vh)}
.topbar{position:fixed;top:0;left:60px;right:0;z-index:8;height:var(--bar);display:flex;align-items:center;gap:24px;padding:0 24px;pointer-events:none;transition:right var(--t2) var(--ease),border-radius var(--t2) var(--ease)}
.topbar > *{pointer-events:auto}
.topbar.solid{background:var(--bg)}
.topbar h1{font-size:19px;font-weight:600;letter-spacing:0;white-space:nowrap}
.topbar small{margin-left:-12px;font-size:13.5px;color:var(--fg-2);white-space:nowrap}
.top-right{margin-left:auto;display:flex;gap:8px}
.top-right .ico-btn{position:relative;width:40px;height:40px;background:var(--s2)}   /* a soft fill, not a ring */
.top-right .ico-btn:hover{background:var(--s3)}
.top-right .ico-btn.on{background:var(--s3)}
.top-right em{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--jam);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center}
/* a page change: the bar stays, the page under it fades up a little. The same curve and time as every other move */
.page-in{animation:page-in .28s var(--ease) both}
@keyframes page-in{from{opacity:0;transform:translateY(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
/* the page steps aside as a sheet with round corners, and the panel sits on the floor beside it */
body.has-side{background:var(--floor)}
body.has-side #app{margin-right:var(--side-w);border-radius:0 28px 28px 0;overflow:hidden;box-shadow:0 0 0 1px var(--line-soft),10px 0 34px rgba(0,0,0,.05)}
body.has-side .topbar{right:var(--side-w);border-top-right-radius:28px}
#side{--blk:var(--card);position:fixed;top:0;right:0;bottom:0;z-index:5;width:var(--side-w);display:flex;flex-direction:column;visibility:hidden;opacity:0;transform:translateX(28px);transition:opacity var(--t2) var(--ease),transform var(--t2) var(--ease),visibility 0s var(--t2)}
/* the panel lands first; its title, contents and foot follow a beat later, so you see the surface before the words */
body.has-side #side{visibility:visible;opacity:1;transform:none;transition:opacity var(--t2) var(--ease),transform var(--t2) var(--ease)}
.side-h{flex:none;display:flex;align-items:center;gap:8px;height:var(--bar);padding:0 12px 0 24px}
.side-h h2{font-size:19px;font-weight:600;letter-spacing:0;margin-right:auto}
.side-h .back{margin-left:-12px}
.side-body{flex:1;min-height:0;overflow-y:auto;padding:8px 24px 24px;display:flex;flex-direction:column;scrollbar-width:thin}
#side:not(.swap) .side-h h2,#side:not(.swap) .side-body,#side:not(.swap) .side-foot{animation:side-in .3s var(--ease) .14s both}
@keyframes side-in{from{opacity:0;transform:translateY(6px)}}
#side.swap .side-body{animation:fade .25s var(--ease)}   /* when one panel replaces another, only its inside fades */
.side-body > *{flex:none}
.side-foot{flex:none;display:flex;align-items:center;gap:8px;padding:16px 24px 24px}
.side-foot > .btn:last-child:not(:first-child){margin-left:auto}   /* the main action goes right when something sits before it */
.side-foot.ask{flex-direction:column;align-items:stretch;gap:12px}   /* what you might ask, then the box, 12px apart */
.side-foot .ico-btn:first-child{margin-left:-10px}   /* the heart's glyph, not its circle, lines up with the text above */
.side-empty{flex:1;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;padding-bottom:48px}   /* 48px: centred in the whole panel, not just under its header */
.side-empty img,.page-empty img{height:120px;width:auto;margin-bottom:8px}   /* an empty panel and an empty page are the same picture and title */
.side-empty h3,.page-empty h3{font-size:19px;font-weight:600;letter-spacing:0;color:var(--fg)}
.side-empty p{margin:0;color:var(--fg-2);font-size:14.5px}
/* inside a panel: a lead, then sections with room between them */
.lead-t{font-size:22px;font-weight:600;letter-spacing:0;line-height:1.22;text-wrap:pretty}
.lead-p{margin:8px 0 0;color:var(--fg-2);font-size:15.5px;line-height:1.5}
.side-body > .lead-p:first-child{margin-top:0}
.sec{margin-top:32px}   /* room between sections, never a rule */
.sec:first-child{margin-top:8px}
:root[data-theme="dark"] #side{--blk:var(--s2)}
.sec h4{font-size:15px;font-weight:600;letter-spacing:0;margin-bottom:8px}
.sec p{margin:0;font-size:15px;line-height:1.5;color:var(--fg-2)}
.sec .chips{display:flex;gap:8px;flex-wrap:wrap}
.cap{display:grid;gap:8px;justify-items:start;padding:16px;border-radius:16px;background:var(--blk,var(--s2));font-size:15px;line-height:1.5}
.opt{display:flex;gap:16px;align-items:center;width:100%;margin-bottom:8px;padding:16px;border:0;border-radius:16px;background:var(--blk);text-align:left;color:inherit;transition:background .15s}   /* each choice is its own block */
.opt:hover{background:var(--s3)}
.opt > i{width:40px;height:40px;border-radius:50%;background:var(--floor);display:grid;place-items:center;flex:none}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--fg-2);font-size:13.5px;line-height:1.35}
.msg{display:flex;align-items:center;gap:16px;padding:12px 0;color:inherit}
.msg img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--card)}
.msg > span:not(.av){flex:1;min-width:0}
.msg b{display:block;font-size:15.5px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg small{display:block;font-size:14px;line-height:1.35;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg em{flex:none;font-style:normal;font-size:13px;color:var(--fg-2)}
/* a note to the team: what you can ask sits above, the box you type in is always at the foot */
.asks-for{display:flex;flex-wrap:wrap;gap:8px}
.asks-for .chip{border-color:transparent;background:color-mix(in srgb,var(--fg) 7%,transparent)}   /* a soft grey, not a white pill */
.asks-for .chip:hover{background:color-mix(in srgb,var(--fg) 12%,transparent)}
.composer.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.composer{display:flex;align-items:flex-end;gap:8px;width:100%;padding:8px 8px 8px 18px;border:1px solid var(--line);border-radius:24px;background:var(--card)}
.composer:focus-within{border-color:var(--on-line)}
.composer textarea{flex:1;min-width:0;min-height:40px;max-height:168px;padding:9px 0;border:0;outline:0;background:none;resize:none;font:inherit;line-height:1.45;color:var(--fg);scrollbar-width:none}
.composer textarea::-webkit-scrollbar{display:none}
.composer .btn{flex:none;width:40px;height:40px;padding:0;border-radius:50%}

/* ---------- onboarding: one column, centred. Jammie, one thought, one control ---------- */
.h1{font-size:calc(var(--h-size) * .8);line-height:1.08}
.h2{font-size:28px;line-height:1.14}
.lead{height:150px;width:auto}
.dots{position:absolute;top:36px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.dots i{width:20px;height:4px;border-radius:4px;background:var(--s3)}
.dots i.on{background:var(--on)}
.dots i.now{animation:fill .5s var(--ease) both;transform-origin:left}
.onb{position:relative;overflow-x:clip;min-height:var(--vh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:80px 24px 48px;text-align:center}
.brandmark{position:absolute;left:24px;top:24px;display:flex;align-items:center;gap:7px;color:var(--jam);font-weight:800;font-size:19px;letter-spacing:-.03em}
.brandmark img{height:28px}
.onb-art{position:relative;display:grid;place-items:center}
.onb-art .lead{height:min(240px,27vh)}
.onb-body{display:flex;flex-direction:column;align-items:center;gap:24px;width:100%}
.onb-body .h1,.onb-body .h2{max-width:18ch}
.pop{position:relative;animation:pop .7s var(--ease) both}   /* Jammie arrives by fading up a little. It never grows */
.bob{position:relative;animation:bob 3.4s ease-in-out .8s infinite}
.onb-body > *{animation:rise .65s var(--ease) both}
.onb-body > *:nth-child(2){animation-delay:.1s}
.onb-body > *:nth-child(3){animation-delay:.2s}
.curtain{position:fixed;inset:0;z-index:60;background:var(--jam);clip-path:circle(0% at var(--cx,50%) var(--cy,50%));animation:bloom .5s cubic-bezier(.6,0,.3,1) forwards}
.curtain.lift{clip-path:none;animation:lift .6s cubic-bezier(.6,0,.2,1) forwards}
.curtain img{position:absolute;left:50%;top:50%;height:120px;transform:translate(-50%,-50%);filter:brightness(0) invert(1);opacity:.9}
@keyframes pop{from{opacity:0;transform:translateY(16px)}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes land{from{opacity:0;transform:translateY(70px) rotate(-4deg) scale(.9)}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes bloom{to{clip-path:circle(150% at var(--cx,50%) var(--cy,50%))}}
@keyframes lift{to{transform:translateY(-100%)}}
.feed.arrive .slide.at .fcard{animation:land .9s .25s cubic-bezier(.2,.9,.25,1.1) both}
.feed.arrive .story{animation:rise .5s both}
.feed.arrive .slide.at .acts > *{animation:rise .45s both}
/* where Jammie stands: a soft patch of shade at its feet. It sits behind the loop, which is laid on with multiply, so the feet cover it and it never moves or fades */
.stand{position:relative;display:grid;place-items:center}
.gnd{position:absolute;z-index:0;left:50%;top:calc(var(--gy) * 100%);width:46%;height:6%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.22),rgba(0,0,0,.08) 55%,transparent);pointer-events:none;animation:fade .9s var(--ease) both}
html[data-theme="dark"] .gnd{display:none}
/* Jammie moves: a short loop on white, laid onto the page */
.pop.v{mix-blend-mode:multiply}
.pop.v img{display:none}
.onb-art{--v:min(300px,32vh)}
.onb.small .onb-art{--v:min(170px,19vh)}
.pop.v video.lead{display:block;height:var(--v);aspect-ratio:1;object-fit:cover}
.onb.small .onb-art .lead{height:min(130px,15vh)}
/* in dark the white loops cannot be laid onto the page: the still stands in, at the size Jammie has inside the loop, and bobs */
html[data-theme="dark"] .pop.v{mix-blend-mode:normal;display:grid;place-items:center;height:var(--v)}
html[data-theme="dark"] .pop.v video{display:none!important}
html[data-theme="dark"] .pop.v img.lead{display:block;height:calc(var(--v) * .78);animation:bob 3.4s ease-in-out .8s infinite}
/* sign-in is a popup over the first screen: Google, or a name and an email */
.gate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.36);backdrop-filter:blur(3px);animation:fade var(--t) var(--ease)}
.gate-card{position:relative;width:min(392px,100%);max-height:calc(var(--vh) - 32px);overflow-y:auto;padding:24px;text-align:center;display:grid;justify-items:center;gap:16px;animation:rise var(--t) var(--ease) both;scrollbar-width:none}
.gate-card{--v:150px}
.gate-card .lead{height:120px}
.gate-card h2{font-size:24px;line-height:1.14}
.gate-card .btn{width:100%}
.gate-card form{display:grid;gap:8px;width:100%}
.gate-card .input{padding:9px 16px;text-align:left}
.gate-card .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.x{position:absolute;top:12px;right:12px}
.or{display:flex;align-items:center;gap:12px;width:100%;color:var(--fg-2);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.store{display:flex;align-items:center;gap:8px;width:min(504px,100%);height:56px;padding:0 8px 0 24px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card)}
.store:focus-within{border-color:var(--on-line)}
.store input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font:inherit;font-size:16px}
.store .btn{border-radius:var(--r-pill);height:40px}
.store > [data-ico]{color:var(--fg-2)}
.gbtn{gap:10px}
.gbtn svg{width:18px;height:18px}
/* reading the store: the lines write themselves as each thing is read, and what was found hops in beside Jammie */
.hopstage{position:relative;display:grid;place-items:center;width:min(460px,92vw)}
.hop{position:absolute;left:var(--x);top:var(--y);height:min(68px,8vh);width:auto;opacity:0;filter:var(--felt)}
.hop.on{opacity:1;animation:in3d .85s cubic-bezier(.2,.9,.25,1.1) both,hop var(--d,2.2s) .85s infinite}
@keyframes hop{0%,100%{translate:0 0;animation-timing-function:cubic-bezier(.2,.6,.4,1)}50%{translate:0 -18px;animation-timing-function:cubic-bezier(.6,0,.8,.4)}}
.reading-line{margin:0;min-height:28px;font-size:18px;line-height:28px;font-weight:500;color:var(--fg-2)}
.reading-line span{display:inline-block;color:transparent;background:linear-gradient(90deg,var(--fg-3) 0%,var(--fg-3) 38%,var(--fg) 50%,var(--fg-3) 62%,var(--fg-3) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:rise var(--t) var(--ease) both,shimmer 2.6s linear infinite}   /* a light passes across the words while that thing is being read */
@keyframes shimmer{from{background-position:110% 0}to{background-position:-110% 0}}
/* three taps: every pick shows up on Jammie, or lands beside it */
.tapstage{display:flex;align-items:center;justify-content:center;gap:8px;height:min(250px,28vh)}
.tapstage .slot{position:relative;z-index:1;width:132px;height:100%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px}
.tapstage .slot img{height:min(84px,10vh);width:auto;filter:var(--felt)}
.tapstage .me .ground::after{width:min(150px,38%)}
/* where you post: one place is big. Each one you add makes them all a little smaller, so they always fit the slot */
#chanSlot{--c1:min(92px,10.5vh);--k:1;flex-direction:column;flex-wrap:nowrap;align-items:center;justify-content:center;gap:6px}
#chanSlot[data-n="2"]{--k:.86}
#chanSlot[data-n="3"]{--k:.7}
#chanSlot[data-n="4"]{--k:.58}
#chanSlot img{height:calc(var(--c1) * var(--k));max-width:100%;object-fit:contain;transition:height var(--t) var(--ease)}
.tapstage .me{--v:min(250px,28vh);--lh:min(232px,26vh);flex:none;height:100%;width:var(--v);margin:0 calc((192px - var(--v)) / 2);display:grid;place-items:center}   /* as wide as the loop that stands on it, so Jammie is centred and the page around it never shifts */
.tapstage .me .lead{height:var(--lh)}
/* the plain still is cropped tighter than the dressed ones: draw it smaller and push it down so its size and feet match theirs */
.tapstage .me .pop:not(.v) img.lead,html[data-theme="dark"] .tapstage .me .pop.v img.lead{height:calc(var(--lh) * .86);margin-top:calc(var(--lh) * .14)}
html[data-theme="dark"] .tapstage .me .pop.v{height:auto}
/* a role change moves like one strip scrolled sideways: the look on stage and the next one travel the same distance together.
   Each one fades as it goes, from fully there to gone. Nothing clips them, so there is no edge to slide into */
.tapstage .me > *{grid-area:1/1;width:100%;display:grid;place-items:center}
.slide-in{animation:slide-in .62s cubic-bezier(.65,0,.35,1) both}
.slide-out{animation:slide-out .62s cubic-bezier(.65,0,.35,1) both}
@keyframes slide-in{from{opacity:0;transform:translateX(100%)}}
@keyframes slide-out{to{opacity:0;transform:translateX(-100%)}}
.in3d{animation:in3d .85s cubic-bezier(.2,.9,.25,1.1) both,sway3d 6s ease-in-out .85s infinite}
@keyframes in3d{0%{opacity:0;transform:perspective(500px) translateY(30px) rotateY(-80deg) rotateX(18deg) scale(.8)}60%{opacity:1;transform:perspective(500px) translateY(-5px) rotateY(14deg) rotateX(-3deg) scale(1.03)}100%{opacity:1;transform:perspective(500px) rotateY(0) scale(1)}}
@keyframes sway3d{0%,100%{transform:perspective(500px) rotateY(0)}25%{transform:perspective(500px) rotateY(14deg)}75%{transform:perspective(500px) rotateY(-14deg)}}
.asks{display:grid;gap:16px;width:min(560px,100%)}
.asks h4{font-size:14px;font-weight:600;letter-spacing:0;margin-bottom:8px}
.asks .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
/* from a laptop up, three taps is two sides: Jammie at full size, the questions beside it */
@media (min-width:1061px){
  .onb.split{flex-direction:row;gap:clamp(24px,5vw,84px)}
  .onb.split .onb-body{width:min(430px,100%);align-items:flex-start;text-align:left}
  .onb.split .asks{width:100%;gap:24px}
  .onb.split .asks .chips{justify-content:flex-start}
  .onb.split .tapstage{height:min(440px,52vh);gap:4px}
  .onb.split .tapstage .slot{width:150px}
  .onb.split .tapstage .slot img{height:min(104px,12vh)}
  .onb.split #chanSlot{--c1:min(112px,13vh);gap:8px}
  .onb.split .tapstage .me{--v:min(440px,52vh);--lh:min(400px,47vh);margin:0 calc((294px - var(--v)) / 2)}
}
/* hey, here it is: what Jammie read comes back as a passport for the brand. It arrives shut, then its cover swings open
   on the spine, as Airbnb's host passport does. The open booklet is the resting state; the animation only plays it from shut */
.pp-wrap{--hi:rgba(255,255,255,.62);--red:linear-gradient(160deg,color-mix(in srgb,var(--jam) 86%,#fff),var(--jam) 40%,color-mix(in srgb,var(--jam-2) 82%,#3A0B22));
  width:min(820px,100%);display:grid;grid-template-columns:1fr 1fr;perspective:1800px;animation:land .9s cubic-bezier(.2,.9,.25,1.12) both}
:root[data-theme="dark"] .pp-wrap{--hi:rgba(255,255,255,.05)}
.pp-book{grid-column:2;position:relative;transform-style:preserve-3d;transform:rotateX(6deg);transform-origin:50% 100%;transition:transform .6s var(--ease);animation:pp-shift 1.1s 1.05s cubic-bezier(.6,0,.2,1) backwards}
.pp-book:hover{transform:rotateX(2deg)}
@keyframes pp-shift{from{transform:rotateX(6deg) translateX(-50%)}}   /* shut, the booklet sits in the middle; open, its spine does */
/* one side of the open booklet: the red cover showing round a page */
.pp-side{position:relative;padding:8px 8px 12px 0;border-radius:4px 22px 22px 4px;background:var(--red);box-shadow:0 2px 0 color-mix(in srgb,var(--jam-2) 70%,#000),0 30px 40px -22px rgba(70,20,30,.4),0 10px 18px -8px rgba(0,0,0,.18)}
/* the cover: its front is what you see shut, its back is the left page */
.pp-leaf{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:0 50%;transform:rotateY(-180deg);animation:pp-open 1.1s 1.05s cubic-bezier(.6,0,.2,1) backwards}
@keyframes pp-open{from{transform:rotateY(0)}}
.pp-leaf > *{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pp-front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border-radius:4px 22px 22px 4px;background:var(--red);color:#fff;text-align:center;box-shadow:inset 10px 0 0 rgba(0,0,0,.13),inset 12px 0 0 rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.3)}
.pp-front small{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.pp-front .ico{width:76px;height:76px;stroke-width:1;opacity:.92}
.pp-front b{font-size:32px;font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:1}
.pp-side.l{position:absolute;transform:rotateY(180deg);padding:8px 0 12px 8px;border-radius:22px 4px 4px 22px}
.pp-page{position:relative;height:100%;min-width:0;padding:24px;background-color:var(--pp);text-align:left}
/* the left page lies in the shade of the fold; under its outer edge, the pages beneath it */
.pp-side.l .pp-page{border-radius:16px 2px 2px 16px;box-shadow:-1px 2px 0 color-mix(in srgb,var(--pp) 84%,#000),-2px 4px 0 var(--pp),-3px 6px 0 color-mix(in srgb,var(--pp) 80%,#000)}
.pp-side.l .pp-page::after{content:"";position:absolute;inset:0 0 0 auto;width:84px;border-radius:0 2px 2px 0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.04) 40%,rgba(0,0,0,.11) 78%,rgba(0,0,0,.26));pointer-events:none}
/* the right page rises out of the fold: a thin dark line where the pages meet, then the paper catches the light */
.pp-side.r .pp-page{display:flex;flex-direction:column;gap:16px;min-height:min(360px,40vh);border-radius:2px 16px 16px 2px;
  background-image:repeating-radial-gradient(circle at 62% 16%,transparent 0 14px,color-mix(in srgb,var(--fg) 4%,transparent) 14px 15px);   /* the fine rings a passport page is printed with */
  box-shadow:1px 2px 0 color-mix(in srgb,var(--pp) 84%,#000),2px 4px 0 var(--pp),3px 6px 0 color-mix(in srgb,var(--pp) 80%,#000)}
.pp-side.r .pp-page::before{content:"";position:absolute;inset:0 auto 0 0;width:72px;border-radius:2px 0 0 2px;background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(0,0,0,.1) 8%,var(--hi) 24%,transparent 62%);pointer-events:none}
.pp-side.r .pp-page > *{position:relative}
.pp-photo{width:100%;height:100%;object-fit:cover;border-radius:12px;box-shadow:0 0 0 4px var(--card),0 2px 8px rgba(0,0,0,.18)}
/* the stamp is ink on the page, not an object: it thumps down once the booklet is open */
.pp-side.r .pp-page > .pp-ink{position:absolute;right:20px;top:16px;width:88px;height:88px;border-radius:50%;border:2px solid currentColor;outline:1px solid currentColor;outline-offset:3px;color:var(--jam);opacity:.74;display:grid;place-content:center;text-align:center;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1.35;transform:rotate(-11deg);animation:stamp .4s 2.3s cubic-bezier(.3,1.5,.5,1) backwards}
.pp-ink b{display:block;font-size:12.5px;letter-spacing:.03em}
@keyframes stamp{from{opacity:0;transform:rotate(-11deg) scale(1.6)}}
.pp-top{display:flex;align-items:center;min-height:40px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.pp-name{font-size:42px;font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:1}
.pp-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0}
.pp-facts dt{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-2)}
.pp-facts dd{margin:2px 0 0;font-size:16px;font-weight:600}
.swatches{display:flex;gap:6px}
.swatches i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 22%,transparent)}
@media (max-height:800px) and (min-width:861px){
  .onb.small{gap:16px;padding:64px 24px 24px}
  .onb.small .onb-art{--v:112px}
  .onb.small .onb-art .lead{height:96px}
  .pp-name{font-size:34px}
  .pp-side.r .pp-page{gap:12px;padding:20px 24px 16px;min-height:0}
}

/* ---------- the feed: stories across the card's width, then one tall card a stop ---------- */
.feed{position:relative;--col-w:calc(var(--fc-h) * .625);--st:clamp(44px,calc((var(--col-w) - 80px) / 6),72px);height:100%;display:flex;flex-direction:column}   /* six rings and five 16px gaps are exactly the card's width */
.stories-row{flex:none;display:flex;justify-content:center;padding:12px 24px 8px}
.stories{display:flex;justify-content:space-between;width:var(--col-w);max-width:100%}
.story:focus-visible,.act:focus-visible{outline:0}
.story:focus-visible i,.act:focus-visible > i{outline:2px solid var(--on-line);outline-offset:2px}   /* the focus ring is a circle too */
.stage{flex:1;min-height:0;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:flex-start;justify-content:center;padding:6px 24px 0}   /* the top gap keeps a hairline of the next card from showing at the foot */
/* as on Winning Ads: the card itself is centred, and its actions hang outside it on the right, level with its foot */
.feed-col{position:relative;min-width:0}
/* the action column floats over the feed in the same place a card's column would be, so it stays still while the cards scroll under it */
.stage-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.feed-over{position:absolute;inset:0;z-index:3;pointer-events:none;display:flex;align-items:flex-start;justify-content:center;padding:6px 24px 0}
.feed-over .feed-col{width:var(--col-w);height:var(--fc-h)}
.feed-over .acts{pointer-events:auto}
.feed-col .acts{position:absolute;left:calc(100% + 12px);top:0;height:var(--fc-h);justify-content:flex-end;gap:4px}
body.has-side .stage,body.has-modal .stage{overflow:hidden}
.fab{position:fixed;right:24px;bottom:24px;z-index:4;height:52px;padding:0 20px 0 6px;border-radius:99px;border:0;background:var(--card);box-shadow:var(--shadow-2);display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:inherit;transition:opacity var(--t2) var(--ease),box-shadow var(--t2) var(--ease)}
.fab:hover{box-shadow:var(--shadow-3)}
.fab span{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center}   /* Jammie sits in a circle */
.fab img{height:30px;width:auto}
body.has-side .fab{opacity:0;pointer-events:none}

/* ---------- a story: the whole screen goes dark and one tall picture plays, as on Instagram.
   Bars along the top fill as it plays, a tap on the left or right moves on, and it moves on by itself ---------- */
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:16px;padding:16px;background:rgba(20,20,20,.94);animation:fade var(--t) var(--ease)}
.sv{position:relative;flex:none;height:min(calc(var(--vh) - 32px),880px);aspect-ratio:9/16;max-width:calc(100vw - 136px);border-radius:16px;overflow:hidden;isolation:isolate;background:#111;color:#fff}
.sv-pic{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover}
.scrim.quiet{animation:none}   /* going from one story to the next, nothing fades: the picture just changes */
/* a picture with words on it is shown whole, over a blurred copy of itself, so nothing is cut off */
.sv.fit{background-size:cover;background-position:center}
.sv.fit .sv-pic{object-fit:contain;backdrop-filter:blur(30px) brightness(.62);-webkit-backdrop-filter:blur(30px) brightness(.62)}
.sv::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 18%,transparent 52%,rgba(0,0,0,.78))}
.sv-bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px}
.sv-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.36);overflow:hidden}
.sv-bars b{display:block;height:100%;border-radius:3px;background:#fff;transform:scaleX(0);transform-origin:left}
.sv-bars .done b{transform:none}
.sv-bars .now b{animation:sv-fill 5s linear forwards}
@keyframes sv-fill{to{transform:none}}
html.still .sv-bars .now b{animation:none;transform:scaleX(.45)}
.sv-h{position:absolute;z-index:2;top:22px;left:12px;right:6px;display:flex;align-items:center;gap:8px;font-size:14px;line-height:1}
.sv-h .ring{flex:none;width:34px;height:34px;border-radius:50%;background:center/cover;box-shadow:0 0 0 1.5px rgba(255,255,255,.92)}
.sv-h b{font-weight:600}
.sv-h small{font-size:13px;opacity:.76}
.sv-h .ico-btn{margin-left:auto;color:#fff}
.sv-h .ico-btn:hover,.sv-nav:hover{background:rgba(255,255,255,.2)}
.sv-tap{position:absolute;z-index:1;top:64px;bottom:0;left:0;width:34%}
.sv-tap.next{left:auto;right:0;width:66%}
.sv-foot{position:absolute;z-index:2;left:16px;right:16px;bottom:16px;display:grid;gap:8px;pointer-events:none}
.sv-foot h2{font-size:20px;font-weight:600;letter-spacing:0;line-height:1.22;text-wrap:pretty}
.sv-foot p{margin:0;font-size:14px;line-height:1.4;opacity:.88;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sv-foot .btn{margin-top:8px;border-radius:var(--r-pill);pointer-events:auto}
.sv-nav{flex:none;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;transition:background .15s}
.sv-nav.off{visibility:hidden}

/* ---------- the command centre is a deck: columns that stand apart as their own panels, each scrolling on its own.
   Nothing here is ruled off with a line. A column is a tinted panel, a card is a lighter block on it, and the gaps do the rest ---------- */
.deck{height:100%;display:flex;flex-direction:column;padding-top:var(--bar)}
.deck-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.deck-tabs button{flex:none;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:0;border-radius:var(--r-pill);background:none;font-size:13.5px;color:var(--fg-2)}
.deck-tabs button:hover{background:var(--s2);color:var(--fg)}
.deck-tabs i.dot{width:7px;height:7px;border-radius:50%;background:var(--jam);flex:none}
.deck-tabs .short,.deck-tabs [data-ico]{display:none}   /* a red dot only where something needs you */
.deck-cols{flex:1;min-height:0;display:flex;padding:8px 8px 24px 24px;overflow-x:auto;scrollbar-width:none}
.deck-cols::-webkit-scrollbar{display:none}
/* the gap between two columns is a handle: drag it to make the column on its left wider or narrower */
.grip{flex:none;position:relative;width:16px;cursor:col-resize;touch-action:none}
.grip::after{content:"";position:absolute;left:6px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:4px;background:var(--line);opacity:0;transition:opacity .15s,height .15s,margin .15s}
.grip:hover::after,.grip.on::after{opacity:1}
.grip.on::after{height:72px;margin-top:-36px;background:var(--on-line)}
body.sizing{cursor:col-resize;user-select:none;-webkit-user-select:none}
.dcol.flash{animation:flash 1s var(--ease)}
@keyframes flash{from{background:var(--s3)}}
/* the second row under the top bar: a page's own tabs live here, never in the top bar. They start where the page's content starts */
.subbar{flex:none;display:flex;align-items:center;height:48px;padding:0 24px;background:var(--bg)}
.subbar .deck-tabs{flex:1;min-width:0}
.subbar.fit .deck-tabs{flex:none;width:100%;max-width:1040px;margin:0 auto;padding:0 32px}
.subbar .deck-tabs button.on{background:var(--s2);color:var(--fg);font-weight:600}
/* the smaller pages (Saved, Memory, Connectors): one column in the middle, scrolling under the bar */
.page{height:100%;display:flex;flex-direction:column;padding-top:var(--bar)}
.page .edge{flex:none;position:relative;z-index:1;height:1px;margin-bottom:-1px;background:var(--line-soft);opacity:0;transition:opacity .2s}   /* shows only once the page has scrolled under the bar */
.page.scrolled .edge{opacity:1}
.page-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.page-body{max-width:1040px;margin:0 auto;padding:16px 32px 96px}
.page-body.narrow{max-width:720px}
.sec-t{font-size:18px;margin:32px 0 16px;scroll-margin-top:16px}
.sec-t:first-child{margin-top:0}
.hello{display:flex;align-items:center;gap:12px;margin:0 0 24px;font-size:16.5px}
.hello img{height:52px;width:auto}
.page-empty{display:grid;justify-items:center;gap:4px;padding:80px 0;text-align:center;color:var(--fg-2)}
/* memory: the brand book with everything written on it, standing at an angle, and what Jammie knows as tiles */
.learn{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start}
.shelf{position:sticky;top:0;display:grid;justify-items:center;gap:24px;padding-top:8px}
.bk{position:relative;width:216px;aspect-ratio:3/4;transform:perspective(900px) rotateY(-22deg) rotateX(5deg);transform-origin:0 50%;transition:transform .6s var(--ease)}
.bk:hover{transform:perspective(900px) rotateY(-8deg) rotateX(2deg)}
.bk::before{content:"";position:absolute;inset:5px -11px 5px auto;width:13px;border-radius:0 3px 3px 0;background:repeating-linear-gradient(180deg,#F6EFE3 0 2px,#E3D8C6 2px 3px);transform:skewY(-28deg);transform-origin:0 0}   /* the edges of its pages */
.bk::after{content:"";position:absolute;left:4%;right:-12%;bottom:-18px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.22),transparent);z-index:-1}   /* where it stands */
.bk-cover{position:absolute;inset:0;padding:20px 18px 18px 26px;border-radius:4px 12px 12px 4px;color:#fff;text-align:left;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--jam) 84%,#fff),var(--jam) 42%,color-mix(in srgb,var(--jam-2) 84%,#3A0B22));
  box-shadow:inset 12px 0 0 rgba(0,0,0,.14),inset 14px 0 0 rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.3)}   /* the band is its spine */
.bk-cover small{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.86}
.bk-cover b{display:block;margin-top:8px;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.bk-cover p{margin:12px 0 0;font-size:14px;line-height:1.4;opacity:.92;max-width:16ch}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
/* connectors: Shopify first, then everything else in one list */
.rowi img.logo{flex:none;width:36px;height:36px;object-fit:contain;filter:var(--felt)}
.rowi.first{padding:20px 16px}
.rowi.first img.logo{width:48px;height:48px}
.rowi.first b{font-size:17px}
.logo-tile{flex:none;width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}

.toasts .toast{animation:toast 2.6s var(--ease) forwards}
html.still *{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important}
html.still ::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){.reading-line span{animation:none;color:var(--fg);background:none}.pop,.bob,.pp-wrap,.pp-book,.pp-leaf,.pp-ink,.in3d,.hop,.slide-in,.slide-out,.curtain,.onb-body > *,.feed.arrive *,.page-in,.side-body,.side-h h2,.side-foot{animation:none!important}.hop{opacity:1}}

/* ---------- the rest of the live product: stores, the check, settings, work, reports, memory's pages, connecting a tool, your account ---------- */
.topbar .back{margin:0 -16px 0 -8px;background:none}
#barActs{display:flex;gap:8px}
/* a plain page outside the app: pick a store, a store's profile */
.pick{position:relative;min-height:var(--vh);max-width:1104px;margin:0 auto;padding:104px 32px 64px;display:grid;gap:24px;align-content:start;justify-items:start}
.pick.narrow{max-width:720px}
.pick .ideas,.pick .wide{width:100%}
.pick .sec-t{margin:16px 0 -8px}
.pick .tagline{margin:-12px 0 0;font-size:17px;color:var(--fg-2)}
.pick .sub{margin:-8px 0 0;font-size:13.5px;color:var(--fg-2)}
.pick .tiles.wide{grid-template-columns:repeat(4,minmax(0,1fr))}
.ltile.off{opacity:.5}
.tiles.two{grid-template-columns:1fr 1fr}
.adder{display:flex;gap:8px;width:100%}
.adder .input{flex:1;min-width:0;padding:10px 14px}
.coach{position:absolute;z-index:4;left:50%;top:calc(var(--st) + 64px);transform:translateX(-50%);width:min(400px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:12px 12px 12px 8px;border-radius:20px;background:var(--card);box-shadow:var(--shadow-3);font-size:14.5px;line-height:1.35;font-weight:500}
.coach img{flex:none;height:44px;width:auto}
.coach span{flex:1}
/* deck cards that hold an idea or a job, and a column with nothing in it */
.dcard.work img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin-bottom:12px}
.dcard p.t{margin:6px 0 0;font-size:15px;font-weight:600;line-height:1.3;color:var(--fg)}
.dcard.flat{background:var(--blk,var(--s2))}
.bars.tall{height:96px}
.dempty{margin:0;padding:32px 16px;text-align:center;font-size:14px;color:var(--fg-2)}
.subbar .tools{flex:none;display:flex;align-items:center;gap:8px;margin-left:16px}
.seg.sm button{height:28px;padding:0 12px;font-size:13px}
.rowi .v{flex:none;max-width:55%;font-weight:600;text-align:right}
.rowi .meter{display:block;margin-top:8px}
.sec .sub{margin:-4px 0 8px;font-size:13.5px}
.sec .rows + .adder,.sec .chips + .adder{margin-top:8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fields .wide{grid-column:1/-1}
.addrow{display:grid;gap:8px;margin-top:16px;justify-items:start}
.swatch{display:block;height:40px;border-radius:10px;margin-bottom:8px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.2)}
a.bk{display:block}
/* a question about a number, and its answer with where it came from */
.qa{display:grid;gap:8px;margin-bottom:16px}
.qa .q{justify-self:end;max-width:86%;margin:0;padding:10px 14px;border-radius:16px 16px 4px 16px;background:var(--s3);color:var(--fg)}
.qa .a{display:flex;gap:10px;align-items:flex-start}
.qa .a > span:last-child{padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--blk,var(--s2));font-size:15px;line-height:1.45}
.qa .a small{display:block;margin-top:4px;font-size:12.5px;color:var(--fg-2)}
.side-empty img.felt{height:128px;filter:var(--felt)}
.logo-tile.big{width:96px;height:96px;margin-bottom:8px;background:var(--s2);font-size:36px}
.side-empty .reading-line{font-size:16.5px}
/* the mic in a note: hold it and talk */
.composer .mic{flex:none;width:40px;height:40px;color:var(--fg-2)}
.composer.listening{border-color:var(--jam)}
.composer.listening .mic{background:var(--jam)}
.composer.listening .mic .ico{color:#fff}
.fab,#newTab{-webkit-touch-callout:none}
/* the Demo button floats outside the product's own UI: a small dark tab, bottom left. It opens the prototype's controls */
.demo-btn{position:fixed;left:76px;bottom:20px;z-index:6;height:32px;padding:0 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:600;letter-spacing:.02em;opacity:.86;transition:opacity .15s}
.demo-btn:hover,.demo-btn.on{opacity:1}
body.bare .demo-btn{left:20px}

.bar-brand,.rail .tab-new,.rail .tab-you,.phone-only,.rail .tl{display:none}

/* ---------- phone: built like Instagram. A top bar with the logo, a tab bar at the foot with your profile last,
   every popup a sheet from the foot, and everything you tap at least 44px (48px for icons, as YouTube does) ---------- */
@media (max-width:860px){
  :root{--bar:56px;--tab:60px}
  body{padding-left:0}
  #app{height:var(--vh)}   /* the page runs under the tab bar, so the bar can step away while you read */
  .phone-only{display:block}
  /* the tab bar, as Airbnb does it: a word under every icon, the one you are on in red. Each is a fifth of the width, so it is easy to hit.
     It steps away while you scroll down a page and comes back as soon as you scroll up */
  .rail{inset:auto 0 0 0;width:auto;height:calc(var(--tab) + env(safe-area-inset-bottom));flex-direction:row;align-items:stretch;padding:0 0 env(safe-area-inset-bottom);border-right:0;transition:transform .3s var(--ease);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
  .rail .rail-brand,.rail .rail-nav a[data-nav="memory"],.rail .rail-nav a[data-nav="connectors"]{display:none}   /* those two live in the You sheet */
  .rail-nav,.rail-nav.low{display:contents}
  .rail-nav a::after{display:none}
  body.tabs-away .rail{transform:translateY(100%)}
  .rail a,.rail a:hover,.rail a.on{flex:1;width:auto;height:auto;border-radius:0;background:none;color:var(--fg-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .rail a.on,body[data-page="memory"] .rail .tab-you,body[data-page="connectors"] .rail .tab-you{color:var(--jam)}   /* Memory and Connectors sit under You */
  .rail .tl{display:block;font-size:11px;font-weight:500;line-height:1}
  .rail a.on .tl{font-weight:600}
  .rail a .ico{width:24px;height:24px;stroke-width:1.8}
  .rail a.on .ico{stroke-width:2.3}
  .rail a[data-nav="feed"]{order:1}.rail a[data-nav="command"]{order:2}.tab-new{order:3}.rail a[data-nav="saved"]{order:4}.tab-you{order:5}
  .rail .tab-new,.rail .tab-you{display:flex}
  .tab-new .ico{padding:1px;border:1.7px solid currentColor;border-radius:7px;stroke-width:2!important}
  .tab-you .me{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);font-size:11.5px;font-weight:700}
  .tab-you.on .me{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--jam)}   /* your profile gets a red ring once it is open */
  .fab,#youBtn{display:none}   /* New and You are in the tab bar */
  .topbar{left:0;gap:12px;padding:0 4px 0 16px}
  .topbar:not(.solid){background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .topbar small{display:none}
  body[data-page="feed"] .bar-brand{display:inline-flex;align-items:center;gap:6px}
  .bar-brand img{height:30px;width:auto}

<script>
(() => {
  const { A, D, STORES: SHOPS, STORE: S, IDEAS: ALL, real, av, ico, fcard, scard, story, dnum, dcard, ltile, turnFrame } = window.JAMMIE;
  let IDEAS = ALL;   // the feed's list: the store's ideas, in the order you shuffled them to
  const RICH = S.key === 'comet';   // Comet is drawn in full depth; the other demo stores carry what the live demo shows for them
  const n0 = v => Number(v).toLocaleString('en-US');
  const $ = id => document.getElementById(id);
  const root = document.documentElement, app = $('app'), sideEl = $('side'), modal = $('modal');
  const STILL = new URLSearchParams(location.search).has('still');   // the flow map shows screens at rest
  if (STILL) { root.classList.add('still'); $('demoBtn').hidden = true; }   // the flow map's frames show the product only

  // light or dark: one saved choice, shared with the flow map and the design system
  const KEY = 'jammie-workbench-v5';
  let look = {}; try { look = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  const forced = new URLSearchParams(location.search).get('theme');   // ?theme=dark shows a screen dark without saving it
  const paint = theme => { root.dataset.theme = theme; };
  paint(forced || look.theme || 'light');
  function setTheme(theme, auto){ look = auto ? { theme, auto } : { theme }; try { localStorage.setItem(KEY, JSON.stringify(look)); } catch {} paint(theme); }

  // ---- state: where we are in the feed, what was kept or put aside, what went to the team
  let cur = 0, timers = [], arriving = false, shown = null, lastPage = 'feed';
  // The flow map shows screens at rest (?still). Those read a fixed sample and never write, so looking at the map cannot change the real prototype
  const SAMPLE = { 'jammie-proto-intro': true, 'jammie-proto-liked': [S.stories[1]], 'jammie-proto-later': [S.stories[2]], 'jammie-proto-orders': [{ id: S.stories[0], how: 'ship' }] };
  const store = (k, d) => { if (STILL) return SAMPLE[k] || d; try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
  const keep = (k, v) => { if (STILL) return; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const SETS = { liked: new Set(store('jammie-proto-liked', [S.stories[1]])), later: new Set(store('jammie-proto-later', [])) };
  const liked = SETS.liked, saveSet = n => keep('jammie-proto-' + n, [...SETS[n]]);
  let orders = store('jammie-proto-orders', []);
  const HOW = { ship: ['With the team', 'Files land in your inbox'], change: ['With the team', 'They answer within 24 hours'], sloosh: ['Being made on Sloosh', 'About 4 minutes'], note: ['With the team', 'They answer within 24 hours'] };
  const idea = id => real.find(d => d.id === id) || real[0];
  function send(how, id, text){ const key = how === 'note' ? 'note' + Date.now() : id; orders = orders.filter(o => o.id !== key); orders.unshift({ id: key, how, text }); keep('jammie-proto-orders', orders); }
  let readN = store('jammie-proto-read', 0);   // how many updates you have already opened the bell on

  function toast(text, pose = 'cheer'){
    const t = document.createElement('div'); t.className = 'toast';
    t.innerHTML = `<img src="${A}pose-${pose}-sm.png" alt=""><span>${text}</span>`;
    $('toasts').append(t); setTimeout(() => t.remove(), 2700);
  }
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  // ---- onboarding pieces
  const dots = n => !n ? '' : `<div class="dots">${[1, 2, 3, 4].map(i => `<i class="${i < n ? 'on' : i === n ? 'on now' : ''}"></i>`).join('')}</div>`;
  const chips = list => `<div class="chips">${list.map(c => `<button class="chip">${c}</button>`).join('')}</div>`;
  const mark = `<span class="brandmark"><img src="${A}char-dollop-sm.png" alt="">jammie</span>`;
  // the onboarding stage: one centred column. Jammie on top, then one thought and one control
  const onb = (n, art, body, cls = '') => `<section class="onb ${cls}">${mark}${dots(n)}<div class="onb-art">${art}</div><div class="onb-body">${body}</div></section>`;
  // four short loops (idle, wave, cheer, sit); the flow map and reduced motion get the still
  let calm = STILL || matchMedia('(prefers-reduced-motion:reduce)').matches;   // also set by the Reduce motion switch
  const stillOf = p => p === 'idle' ? `${A}char-dollop.png` : `${A}pose-${p}.png`;
  // Every loop stands on one patch of ground that never changes. The loops' own shadows were taken out of the videos, because they
  // lightened and darkened as Jammie moved. gy is how far down the frame its feet are: 0.94 in all four loops
  const LOOPS = ['idle', 'wave', 'cheer', 'sit'];   // the poses that have a loop; the rest are stills
  const pose = (p, gy) => { if (calm || !LOOPS.includes(p)) return `<div class="pop ground"><div class="bob"><img class="lead" src="${stillOf(p)}" alt=""></div></div>`;
    const dark = root.dataset.theme === 'dark';   // dark draws the still, since the loops are on white: fetch only the one that will show
    return `<div class="stand" style="--gy:${gy || .94}"><i class="gnd"></i><div class="pop v">${dark ? '' : `<video class="lead" autoplay loop muted playsinline src="${A}anim/${p}.mp4"></video>`}<img class="lead" ${dark ? '' : 'loading="lazy"'} src="${stillOf(p)}" alt=""></div></div>`; };
  // a coral bloom from where you pressed, then it lifts off the next screen
  function bloom(e, next){
    if (calm) { location.hash = next; return; }
    const c = document.createElement('div'); c.className = 'curtain'; c.style.setProperty('--cx', e.clientX + 'px'); c.style.setProperty('--cy', e.clientY + 'px');
    c.innerHTML = `<img src="${A}pose-cheer-sm.png" alt="">`; document.body.append(c);
    setTimeout(() => { arriving = true; location.hash = next; }, 520);
    setTimeout(() => c.classList.add('lift'), 760); setTimeout(() => c.remove(), 1400);
  }
  // reading the store: one line says what is being read right now, a light passes across it, and it changes as Jammie moves on.
  // What was found hops in beside Jammie as its line comes up
  const READS = [[`Opening ${S.host}`], [`Reading ${n0(S.products)} products`, 'bag'], [`Reading ${n0(S.reviews)} reviews`, 'heart'], [`Watching ${S.rivals} rivals and their ${S.rivalAds} live ads`, 'megaphone'], ['Looking at your own ads', 'chart']];
  const HOPS = [['bag', 2, 12, 2.1], ['heart', 80, 4, 2.5], ['megaphone', 0, 62, 2.3], ['chart', 82, 58, 2.7]];
  function runRead(next){
    const line = app.querySelector('.reading-line');
    const say = i => { const [text, el] = READS[i]; line.innerHTML = '<span></span>'; line.firstChild.textContent = text;
      const h = el && app.querySelector(`.hop[data-el="${el}"]`); if (h) h.classList.add('on'); };
    if (STILL) { READS.slice(0, 3).forEach((_, i) => say(i)); return; }
    const EACH = 2300;                                                        // how long each line stays
    READS.forEach((_, i) => later(() => say(i), i * EACH));
    later(() => { location.replace(next); }, READS.length * EACH);            // replace: Back from the next screen must not land here and be pushed forward again
  }
  // three taps: the role dresses Jammie, the goal and the channels land beside it
  const ROLES = { Founder: 'founder', Marketer: 'marketer', Designer: 'designer', Agency: 'agency' };
  const GOALS = { Sales: 'bag', 'Repeat buyers': 'heart', Reach: 'megaphone', 'Better ads': 'clapper' };
  const CHANS = { Instagram: 'instagram', 'Meta ads': 'meta', Google: 'google', Email: 'email' };
  const picks = { role: [], goal: [], chan: [] };   // kept, so coming Back to this screen shows what you chose
  function tapPicked(ask){
    const kind = ask.dataset.ask, on = [...ask.querySelectorAll('.chip.on')].map(c => c.textContent.trim()); picks[kind] = on;
    if (kind === 'role' && on[0]) { const me = $('meSlot'); if (me.dataset.role === on[0]) return; me.dataset.role = on[0];

    const ad = e.target.closest('[data-add]'); if (ad) { e.preventDefault(); const i = ad.querySelector('input'), v = i.value.trim(); if (!v) { i.focus(); return; }
      LISTS[ad.dataset.add].push(v); keep('jammie-proto-' + ad.dataset.add, LISTS[ad.dataset.add]); changed(); return; }
    const f = e.target.closest('[data-go]'); if (f) { e.preventDefault(); location.hash = f.dataset.go; return; }
    const c = e.target.closest('[data-send]'); if (c) { e.preventDefault(); const t = c.querySelector('textarea'), text = t.value.trim();
      if (!text) { t.focus(); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); return; }   // an empty note is not sent
      DO[c.dataset.send](text); }
  });
  document.addEventListener('input', e => { const t = e.target;
    if (t.dataset && t.dataset.filter) { const v = t.value.toLowerCase(); document.querySelectorAll(t.dataset.filter + ' > *').forEach(r => { r.hidden = !r.textContent.toLowerCase().includes(v); }); }
    if (t.matches && t.matches('.composer textarea')) { t.style.height = 'auto'; t.style.height = Math.min(168, t.scrollHeight) + 'px'; } });
  document.addEventListener('keydown', e => {
    const typing = e.target.matches && e.target.matches('input,textarea');
    if (typing && e.key === 'Enter' && !e.shiftKey && e.target.closest('.composer')) { e.preventDefault(); e.target.closest('form').requestSubmit(); return; }
    if (e.key === 'Escape') { if (/^#\/signin/.test(location.hash)) location.hash = '#/start'; else if (document.body.matches('.has-side,.has-modal')) location.hash = '#/' + lastPage; return; }
    if (/^#\/story/.test(location.hash) && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {   // a story turns with the arrow keys
      const a = modal.querySelector(e.key === 'ArrowRight' ? '.sv-tap.next' : '.sv-tap:not(.next)'); if (a) location.hash = a.getAttribute('href'); return; }
    if (typing || !onFeed()) return;
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); step(1); }   // the keys stop at the ends, as the wheel does
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); step(-1); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const fr = app.querySelector('.slide:not([inert]) .frames'); if (fr) turnFrame(fr, e.key === 'ArrowRight' ? 1 : -1); }
  });
  // Touch scrolls the feed natively and it stops on each card. A wheel or trackpad is turned into one card a gesture,
  // because a snapped list springs back unless the wheel travels half a card. A gesture starts small, so add it up.
  let wAcc = 0, wLast = 0, wAbs = 0, wArmed = true, wStep = 0;
  function onWheel(e){
    if (e.ctrlKey || !onFeed()) return;
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;                                            // sideways moves a carousel's frames
    e.preventDefault();
    const now = Date.now(), abs = Math.abs(e.deltaY);
    if (now - wLast > 180) { wAcc = 0; wArmed = true; }                                             // a new gesture
    else if (!wArmed && now - wStep > 500 && abs > wAbs + 6 && abs >= 10) { wAcc = 0; wArmed = true; } // pushed again while the last one coasts
    wLast = now; wAbs = abs;
    if (!wArmed) return;
    wAcc += e.deltaY;
    if (Math.abs(wAcc) >= 36) { wArmed = false; wStep = now; step(wAcc > 0 ? 1 : -1); }
  }
  addEventListener('hashchange', () => render());
  window.jammieIcons(document);   // the rail and the top bar are drawn once
  render();
})();
</script>
</body>
