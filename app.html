<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jammie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/jammie/v3/jammie.css?v=15">
<style>
/* screens only: every token and shared piece comes from jammie.css */
:root{--side-w:min(440px,100vw);--bar:64px;--t:.45s;--pp:#FBF7F0}
:root[data-theme="dark"]{--pp:#1D1A16}
body{padding-left:60px;height:100vh;overflow:hidden}
body.bare{padding-left:0;height:auto;overflow-x:hidden;overflow-y:auto}
body.bare .rail,body.bare .fab,body.bare .topbar{display:none}
a{text-decoration:none}

/* ---------- the shell: one top bar that never moves, a page under it, and a panel that opens beside the page ---------- */
#app{position:relative;height:100vh;background:var(--bg);transition:margin-right var(--t) var(--ease),border-radius var(--t) var(--ease)}
body.bare #app{height:auto;min-height:100vh}
.topbar{position:fixed;top:0;left:60px;right:0;z-index:8;height:var(--bar);display:flex;align-items:center;gap:20px;padding:0 20px 0 24px;pointer-events:none;transition:right var(--t) var(--ease),border-radius var(--t) var(--ease)}
.topbar > *{pointer-events:auto}
.topbar.solid{background:var(--bg);border-bottom:1px solid var(--line-soft)}
.topbar h1{font-size:19px;font-weight:600;letter-spacing:0;white-space:nowrap}
.top-right{margin-left:auto;display:flex;gap:8px}
.top-right .ico-btn{position:relative;width:40px;height:40px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.top-right .ico-btn:hover,.top-right .ico-btn.on{background:var(--s2)}
.top-right em{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--jam);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center}
/* a page change: the bar stays, the page under it fades up a little. The same curve and time as every other move */
.page-in{animation:page-in var(--t) var(--ease) both}
@keyframes page-in{from{opacity:0;transform:translateY(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
/* the page steps aside as a sheet with round corners, and the panel sits on the floor beside it */
body.has-side{background:var(--floor)}
body.has-side #app{margin-right:var(--side-w);border-radius:0 28px 28px 0;overflow:hidden;box-shadow:0 0 0 1px var(--line-soft),10px 0 34px rgba(0,0,0,.05)}
body.has-side .topbar{right:var(--side-w);border-top-right-radius:28px}
#side{position:fixed;top:0;right:0;bottom:0;z-index:5;width:var(--side-w);display:flex;flex-direction:column;visibility:hidden;opacity:0;transition:opacity .25s var(--ease),visibility 0s .25s}
body.has-side #side{visibility:visible;opacity:1;transition:opacity var(--t) .12s var(--ease)}
.side-h{flex:none;display:flex;align-items:center;gap:6px;height:var(--bar);padding:0 14px 0 26px}
.side-h h2{font-size:19px;font-weight:600;letter-spacing:0;margin-right:auto}
.side-h .back{margin-left:-12px}
.side-body{flex:1;min-height:0;overflow-y:auto;padding:4px 26px 24px;display:flex;flex-direction:column;scrollbar-width:thin;animation:rise .4s var(--ease) both}
.side-body > *{flex:none}
.side-foot{flex:none;display:flex;align-items:center;gap:8px;padding:12px 26px 22px}
.side-foot .btn{margin-left:auto}
.side-empty{flex:1;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;padding-bottom:var(--bar)}
.side-empty img{height:120px;width:auto;margin-bottom:10px}
.side-empty h3{font-size:19px;font-weight:600;letter-spacing:0}
.side-empty p{margin:0;color:var(--fg-2);font-size:14.5px}
/* inside a panel: a lead, then sections with room between them */
.lead-t{font-size:22px;font-weight:600;letter-spacing:0;line-height:1.22;text-wrap:pretty}
.lead-p{margin:8px 0 0;color:var(--fg-2);font-size:15.5px;line-height:1.5}
.sec{padding:22px 0;border-top:1px solid var(--line-soft)}
.sec:first-child{border-top:0;padding-top:6px}
.sec h4{font-size:15px;font-weight:600;letter-spacing:0;margin-bottom:10px}
.sec p{margin:0;font-size:15px;line-height:1.5;color:var(--fg-2)}
.sec .chips{display:flex;gap:8px;flex-wrap:wrap}
.cap{display:grid;gap:10px;justify-items:start;padding:14px 16px;border-radius:16px;background:var(--card);font-size:15px;line-height:1.5}
.opt{display:flex;gap:14px;align-items:center;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;color:inherit}
.opt:last-of-type{border-bottom:0}
.opt:hover b{text-decoration:underline;text-underline-offset:3px}
.opt > i{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--fg-2);font-size:13.5px;line-height:1.35}
.msg{display:flex;align-items:center;gap:14px;padding:11px 0}
.msg img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--card)}
.msg span{flex:1;min-width:0}
.msg b{display:block;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg small{display:block;font-size:14px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg em{flex:none;font-style:normal;font-size:13px;color:var(--fg-2)}
/* a note to the team: what you can ask sits above, the box you type in is always at the foot */
.asks-for{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}
.composer{display:flex;align-items:flex-end;gap:8px;width:100%;padding:8px 8px 8px 18px;border:1px solid var(--line);border-radius:24px;background:var(--card)}
.composer:focus-within{border-color:var(--on-line)}
.composer textarea{flex:1;min-width:0;min-height:40px;max-height:168px;padding:9px 0;border:0;outline:0;background:none;resize:none;font:inherit;line-height:1.45;color:var(--fg)}
.composer .btn{flex:none;width:40px;height:40px;padding:0;border-radius:50%;margin:0}

/* ---------- onboarding: one column, centred. Jammie, one thought, one control ---------- */
.h1{font-size:calc(var(--h-size) * .8);line-height:1.08}
.h2{font-size:calc(var(--h-size) * .58);line-height:1.12}
.lead{height:150px;width:auto}
.dots{position:absolute;top:28px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.dots i{width:20px;height:4px;border-radius:4px;background:var(--s3)}
.dots i.on{background:var(--on)}
.dots i.now{animation:fill .5s var(--ease) both;transform-origin:left}
.onb{position:relative;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:76px 24px 44px;text-align:center}
.brandmark{position:absolute;left:28px;top:20px;display:flex;align-items:center;gap:7px;color:var(--jam);font-weight:800;font-size:19px;letter-spacing:-.03em}
.brandmark img{height:28px}
.onb-art{position:relative;display:grid;place-items:center}
.onb-art .lead{height:min(240px,27vh)}
.onb-body{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
.onb-body .h1,.onb-body .h2{max-width:18ch}
.pop{position:relative;animation:pop .7s var(--ease) both}   /* Jammie arrives by fading up a little. It never grows */
.bob{position:relative;animation:bob 3.4s ease-in-out .8s infinite}
.land{animation:land .9s cubic-bezier(.2,.9,.25,1.12) both}
.land::before{content:"";position:absolute;inset:0;z-index:5;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-120%);animation:shine 1.1s .5s ease-out both;pointer-events:none}
.onb-body > *{animation:rise .65s var(--ease) both}
.onb-body > *:nth-child(2){animation-delay:.1s}
.onb-body > *:nth-child(3){animation-delay:.2s}
.onb-body > *:nth-child(4){animation-delay:.3s}
.curtain{position:fixed;inset:0;z-index:60;background:var(--jam);clip-path:circle(0% at var(--cx,50%) var(--cy,50%));animation:bloom .5s cubic-bezier(.6,0,.3,1) forwards}
.curtain.lift{clip-path:none;animation:lift .6s cubic-bezier(.6,0,.2,1) forwards}
.curtain img{position:absolute;left:50%;top:50%;height:120px;transform:translate(-50%,-50%);filter:brightness(0) invert(1);opacity:.9}
@keyframes pop{from{opacity:0;transform:translateY(16px)}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes land{from{opacity:0;transform:translateY(70px) rotate(-4deg) scale(.9)}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes bloom{to{clip-path:circle(150% at var(--cx,50%) var(--cy,50%))}}
@keyframes lift{to{transform:translateY(-100%)}}
@keyframes blink{50%{opacity:0}}
.feed.arrive .slide.at .fcard{animation:land .9s .25s cubic-bezier(.2,.9,.25,1.1) both}
.feed.arrive .story{animation:rise .5s both}
.feed.arrive .slide.at .acts > *{animation:rise .45s both}
/* Jammie moves: a short loop on white, laid onto the page */
.pop.v{mix-blend-mode:multiply}
.pop.v img{display:none}
.onb-art .pop.v video.lead{display:block;height:min(300px,32vh);aspect-ratio:1;object-fit:cover}
.onb.small .onb-art .pop.v video.lead{height:min(170px,19vh)}
.onb.small .onb-art .lead{height:min(130px,15vh)}
html[data-theme="dark"] .pop.v{mix-blend-mode:normal}
html[data-theme="dark"] .pop.v video{display:none!important}
html[data-theme="dark"] .pop.v img{display:block}
/* sign-in is a popup over the first screen: Google, or a name and an email */
.gate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.36);backdrop-filter:blur(3px);animation:fade .25s}
.gate-card{position:relative;width:min(390px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:22px 28px 26px;text-align:center;display:grid;justify-items:center;gap:12px;animation:rise var(--t) var(--ease) both;scrollbar-width:none}
.gate-card .pop.v video.lead{display:block;height:150px;aspect-ratio:1;object-fit:cover}
.gate-card .lead{height:120px}
.gate-card h2{font-size:24px;line-height:1.14}
.gate-card .btn{width:100%}
.gate-card form{display:grid;gap:8px;width:100%}
.gate-card .input{padding:11px 14px;text-align:left}
.x{position:absolute;top:12px;right:12px}
.or{display:flex;align-items:center;gap:10px;width:100%;color:var(--fg-3);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.store{display:flex;align-items:center;gap:10px;width:min(500px,100%);height:56px;padding:0 7px 0 20px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card)}
.store:focus-within{border-color:var(--on-line)}
.store input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font:inherit;font-size:16px}
.store .btn{border-radius:var(--r-pill);height:42px}
.store > [data-ico]{color:var(--fg-2)}
.gbtn{gap:10px}
.gbtn svg{width:18px;height:18px}
/* reading the store: the lines write themselves as each thing is read, and what was found hops in beside Jammie */
.hopstage{position:relative;display:grid;place-items:center;width:min(460px,92vw)}
.hop{position:absolute;left:var(--x);top:var(--y);height:min(68px,8vh);width:auto;opacity:0;filter:var(--felt)}
.hop.on{opacity:1;animation:in3d .85s cubic-bezier(.2,.9,.25,1.1) both,hop var(--d,2.2s) .85s infinite}
@keyframes hop{0%,100%{translate:0 0;animation-timing-function:cubic-bezier(.2,.6,.4,1)}50%{translate:0 -18px;animation-timing-function:cubic-bezier(.6,0,.8,.4)}}
.stream{list-style:none;margin:0;padding:0;display:grid;gap:10px;align-content:start;width:min(400px,100%);min-height:172px;text-align:left}
.stream li{display:flex;align-items:center;gap:10px;font-size:16px;animation:rise .35s var(--ease) both}
.stream .tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.stream .tick .ico{width:11px;height:11px;stroke-width:2.6;opacity:0}
.stream li.now .tick{border-color:var(--on);border-top-color:transparent;animation:spin .9s linear infinite}
.stream li.now span::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-3px;background:var(--jam);animation:blink 1s steps(2) infinite}
.stream li.done{color:var(--fg-2)}
.stream li.done .tick{background:var(--on);border-color:var(--on);color:var(--bg)}
.stream li.done .tick .ico{opacity:1}
.eta{margin:0;font-size:13.5px;color:var(--fg-3)}
/* three taps: every pick shows up on Jammie, or lands beside it */
.tapstage{display:flex;align-items:center;justify-content:center;gap:10px;height:min(250px,28vh)}
.tapstage .slot{position:relative;z-index:1;width:132px;height:100%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px}
.tapstage .slot img{height:min(84px,10vh);width:auto;filter:var(--felt)}
.tapstage .me .ground::after{width:min(150px,38%)}
.tapstage .slot.many img{height:min(56px,7vh)}
.tapstage .me{flex:none;height:100%;width:240px;margin:0 -24px;display:grid;place-items:center}   /* a fixed width: whatever stands on it, the page around it never shifts */
.tapstage .me .lead{height:min(232px,26vh)}
.tapstage .me .pop.v video.lead{height:min(250px,28vh)}
/* a role change moves like one strip scrolled sideways: the look on stage and the next one travel the same distance together.
   Each one fades as it goes, from fully there to gone. Nothing clips them, so there is no edge to slide into */
.tapstage .me > *{grid-area:1/1;width:100%;display:grid;place-items:center}
.slide-in{animation:slide-in .62s cubic-bezier(.65,0,.35,1) both}
.slide-out{animation:slide-out .62s cubic-bezier(.65,0,.35,1) both}
@keyframes slide-in{from{opacity:0;transform:translateX(100%)}}
@keyframes slide-out{to{opacity:0;transform:translateX(-100%)}}
.in3d{animation:in3d .85s cubic-bezier(.2,.9,.25,1.1) both,sway3d 6s ease-in-out .85s infinite}
@keyframes in3d{0%{opacity:0;transform:perspective(500px) translateY(30px) rotateY(-80deg) rotateX(18deg) scale(.8)}60%{opacity:1;transform:perspective(500px) translateY(-5px) rotateY(14deg) rotateX(-3deg) scale(1.03)}100%{opacity:1;transform:perspective(500px) rotateY(0) scale(1)}}
@keyframes sway3d{0%,100%{transform:perspective(500px) rotateY(0)}25%{transform:perspective(500px) rotateY(14deg)}75%{transform:perspective(500px) rotateY(-14deg)}}
.asks{display:grid;gap:16px;width:min(560px,100%)}
.asks h4{font-size:14px;font-weight:600;letter-spacing:0;margin-bottom:8px}
.asks .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
/* from a laptop up, three taps is two sides: Jammie at full size, the questions beside it */
@media (min-width:1061px){
  .onb.split{flex-direction:row;gap:clamp(24px,5vw,84px)}
  .onb.split .onb-body{width:min(430px,100%);align-items:flex-start;text-align:left}
  .onb.split .asks{width:100%;gap:20px}
  .onb.split .asks .chips{justify-content:flex-start}
  .onb.split .tapstage{height:min(440px,52vh);gap:4px}
  .onb.split .tapstage .slot{width:150px}
  .onb.split .tapstage .slot img{height:min(104px,12vh)}
  .onb.split .tapstage .slot.many img{height:min(80px,9.5vh)}
  .onb.split .tapstage .me{width:390px;margin:0 -48px}
  .onb.split .tapstage .me .lead{height:min(400px,47vh)}
  .onb.split .tapstage .me .pop.v video.lead{height:min(440px,52vh)}
}
/* hey, here it is: what Jammie read comes back as a passport for the brand, stamped */
.passport{position:relative;width:min(760px,100%);display:grid;grid-template-columns:5fr 6fr;border:1px solid var(--line-soft);border-radius:22px;background:var(--pp);overflow:hidden;text-align:left}
.pp-left{position:relative;padding:22px}
.pp-photo{width:100%;height:100%;min-height:min(300px,34vh);object-fit:cover;border-radius:14px}
.pp-stamp{position:absolute;right:6px;bottom:8px;height:min(104px,12vh);width:auto;transform:rotate(-10deg);filter:var(--felt);animation:stamp .5s .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes stamp{from{opacity:0;transform:rotate(-10deg) translateY(-26px)}}
.pp-right{display:flex;flex-direction:column;gap:16px;padding:24px 26px 20px;border-left:1px dashed var(--line)}
.pp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.pp-top img{height:40px;width:auto;filter:var(--felt)}
.pp-name{font-size:42px;font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:1}
.pp-facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0}
.pp-facts dt{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-2)}
.pp-facts dd{margin:2px 0 0;font-size:16px;font-weight:600}
.pp-mrz{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);font:500 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap;overflow:hidden}
.swatches{display:flex;gap:6px}
.swatches i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

/* ---------- the feed: stories across the card's width, then one tall card a stop ---------- */
.feed{--col-w:calc(var(--fc-h) * .625);height:100%;display:flex;flex-direction:column}
.stories-row{flex:none;display:flex;justify-content:center;padding:12px 24px 8px}
.stories{display:flex;justify-content:space-between;width:var(--col-w);max-width:100%}
.story{flex:none;width:60px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--fg-2);white-space:nowrap}
.story i{width:60px;height:60px;border-radius:50%;padding:2.5px;background:var(--jam);display:block}
.story.seen i{background:var(--line)}
.story i b{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);background:var(--s2) center/cover}
.story:hover{color:var(--fg)}
.stage{flex:1;min-height:0;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:flex-start;justify-content:center;padding:6px 24px 0}   /* the top gap keeps a hairline of the next card from showing at the foot */
/* as on Winning Ads: the card itself is centred, and its actions hang outside it on the right, level with its foot */
.feed-col{position:relative;min-width:0}
.feed-col .acts{position:absolute;left:calc(100% + 12px);top:0;height:var(--fc-h);justify-content:flex-end;gap:4px}
body.has-side .stage,body.has-modal .stage{overflow:hidden}
.fab{position:fixed;right:24px;bottom:20px;z-index:4;height:52px;padding:0 20px 0 6px;border-radius:99px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-2);display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:inherit;transition:opacity .25s,box-shadow .2s}
.fab:hover{box-shadow:var(--shadow-3)}
.fab span{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center}   /* Jammie sits in a circle */
.fab img{height:30px;width:auto}
body.has-side .fab{opacity:0;pointer-events:none}

/* ---------- story viewer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:grid;place-items:center;padding:24px;animation:fade .25s}
.sview{width:min(430px,100%);max-height:calc(100vh - 40px);overflow-y:auto;padding:16px 18px 18px;animation:rise var(--t) var(--ease) both}
.segs{display:flex;gap:4px;margin-bottom:12px}
.segs i{flex:1;height:3px;border-radius:3px;background:var(--s3)}
.segs i.on{background:var(--on)}
.sview-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:600;font-size:14px}
.sview-h .ico-btn{width:32px;height:32px}
.sview-h .story{width:34px;pointer-events:none}
.sview-h .story i{width:34px;height:34px}
.sview img.pic{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}
.sview h2{font-size:22px;line-height:1.18;margin:12px 0 6px;text-wrap:pretty}
.sview p{margin:0;color:var(--fg-2);font-size:14.5px}
.sview .btn{width:100%;margin-top:16px}

/* ---------- every page is a deck: equal columns that run the full height and scroll on their own ---------- */
.deck{height:100%;display:flex;flex-direction:column;padding-top:var(--bar)}
.deck-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.deck-tabs button{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:0;border-radius:var(--r-pill);background:none;font-size:13.5px;color:var(--fg-2)}
.deck-tabs button:hover{background:var(--s2);color:var(--fg)}
.deck-tabs i,.dcol-h i{width:7px;height:7px;border-radius:50%;background:var(--s3);flex:none}
.deck-tabs i.need,.dcol-h i.need{background:var(--jam)}
.deck-cols{flex:1;min-height:0;display:flex;overflow-x:auto;scrollbar-width:thin}
.dcol{flex:none;width:340px;display:flex;flex-direction:column;border-right:1px solid var(--line-soft)}
.dcol.wide{width:400px}
.dcol-h{flex:none;display:flex;align-items:center;gap:9px;height:52px;padding:0 20px;font-weight:600;font-size:15.5px;border-bottom:1px solid var(--line-soft)}
.dcol-h small{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--fg-3)}
.dcol-h small.need{color:var(--jam);font-weight:600}
.dcol-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column}
.dcol-body > *{flex:none}
.dcard{display:block;width:100%;padding:18px 20px 16px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;color:inherit}
button.dcard:hover{background:var(--s2)}
.dcard.need{box-shadow:inset 3px 0 0 var(--jam)}
.dcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--fg-2)}
.dcard .top em{font-style:normal;font-size:12px;color:var(--fg-3)}
.dcard .top em.need{color:var(--jam);font-weight:600}
.dcard .big{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.dcard .top + .big{margin-top:6px}
.dcard .big:first-child{margin-top:0}
.dcard .big b{font-size:30px;font-weight:var(--h-weight);letter-spacing:var(--h-track);line-height:1.1}
.dcard .big b.t{font-size:17px;font-weight:600;letter-spacing:0;line-height:1.3}
.dcard .line{margin:4px 0 0;font-size:13.5px;line-height:1.4;color:var(--fg-2)}
.bars{display:flex;align-items:flex-end;gap:4px;height:44px;margin:14px 0 2px}
.bars i{flex:1;border-radius:3px 3px 1px 1px;background:var(--s3)}
.bars i.hi{background:var(--on)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini button{border:0;background:none;padding:0;text-align:left;color:inherit}
.mini small{display:block;font-size:12px;color:var(--fg-2)}
.mini b{display:block;font-size:15px;font-weight:600}
.dcard .foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin-top:14px}
.dcard .foot button{border:0;background:none;padding:0;font-size:13px;font-weight:500;color:var(--fg-2)}
.dcard .foot button:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.dcard .foot .btn{height:30px;padding:0 12px;font-size:13px;margin-left:auto}
.dnote{padding:16px 20px;border-bottom:1px solid var(--line-soft);font-size:14.5px;line-height:1.45;color:var(--fg-2)}
.dempty{flex:1;display:grid;place-content:center;justify-items:center;gap:4px;padding:24px;text-align:center;color:var(--fg-2);font-size:14.5px}
.dempty img{height:96px;width:auto;margin-bottom:8px}
/* memory: the brand book is a thing you can pick up */
.bookcase{display:grid;justify-items:center;gap:10px;padding:30px 24px 26px;border-bottom:1px solid var(--line-soft);text-align:center}
.bookcase img{height:min(230px,28vh);width:auto;filter:var(--felt);transition:transform .5s var(--ease)}
.bookcase:hover img{transform:rotate(-3deg) translateY(-4px)}
.bookcase h2{font-size:28px;line-height:1.1}
.bookcase p{margin:0;color:var(--fg-2);font-size:14.5px;max-width:26ch}
.bookcase .pair{display:flex;gap:8px;margin-top:8px}
/* saved and tools: plain rows */
.drow{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 20px;border-bottom:1px solid var(--line-soft)}
.drow > img{flex:none;width:52px;height:52px;border-radius:12px;object-fit:cover}
.drow > img.logo{width:38px;height:38px;border-radius:0;object-fit:contain;filter:var(--felt)}
.drow .grow{flex:1;min-width:0;color:inherit}
.drow b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:14.5px;line-height:1.3}
.drow small{display:block;color:var(--fg-2);font-size:13px}
.logo-tile{flex:none;width:38px;height:38px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-weight:700;font-size:14px}
.shop{display:grid;justify-items:center;gap:8px;padding:30px 24px 28px;border-bottom:1px solid var(--line-soft);text-align:center}
.shop img{height:min(150px,18vh);width:auto;filter:var(--felt)}
.shop h2{font-size:26px}
.shop p{margin:0 0 8px;color:var(--fg-2);font-size:14.5px}

.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:grid;gap:8px;pointer-events:none}
.toasts .toast{animation:toast 2.6s var(--ease) forwards}
html.still *{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important}
html.still ::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){.pop,.bob,.land,.in3d,.hop,.slide-in,.slide-out,.curtain,.onb-body > *,.feed.arrive *,.page-in,.side-body,.pp-stamp{animation:none!important}.hop{opacity:1}}

/* ---------- phone ---------- */
@media (max-width:860px){
  body{padding-left:0}
  #app{height:calc(100vh - 58px)}
  .rail{inset:auto 0 0 0;width:auto;height:58px;flex-direction:row;padding:0 8px;border-right:0;border-top:1px solid var(--line-soft)}
  .rail .rail-brand{display:none}
  .rail-nav,.rail-nav.low{flex:1;flex-direction:row;margin:0;gap:0;justify-content:space-around}
  .rail-nav a::after{display:none}
  .topbar{left:0;padding:0 12px 0 16px}
  .topbar .deck-tabs{display:none}
  /* the panel is a sheet that rises from the foot; the page behind it stays where it is */
  body.has-side{background:var(--bg)}
  body.has-side #app{margin-right:0;border-radius:0;box-shadow:none}
  body.has-side .topbar{right:0;border-radius:0}
  #side{top:auto;left:0;width:auto;max-height:86vh;z-index:30;background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--shadow-3);visibility:visible;opacity:1;transform:translateY(105%);transition:transform var(--t) var(--ease)}
  body.has-side #side{transform:none;transition:transform var(--t) var(--ease)}
  .side-h{padding-left:20px}
  .side-body{padding:4px 20px 20px}
  .side-foot{padding:12px 20px 18px}
  .side-empty{padding:28px 0}
  .opt > i{background:var(--s2)}
  .cap{background:var(--s2)}
  .asks-for{margin-top:18px}
  /* feed */
  .feed{--fc-h:calc(100vh - 58px - 104px)}
  .stories-row{justify-content:flex-start;padding:10px 104px 6px 12px;overflow-x:auto;scrollbar-width:none}
  .stories{width:auto;gap:12px;justify-content:flex-start}
  .story{width:54px;font-size:11.5px}
  .story i{width:54px;height:54px}
  .slide{padding:4px 10px 0}
  .feed-col,.fcard{width:100%}
  .fc-media,.fcard.plain{width:100%;height:var(--fc-h);aspect-ratio:auto}
  .fc-over{padding:64px 70px 16px 16px}
  .fcard-top{justify-content:flex-start}
  .feed-col .acts{left:auto;right:6px;top:auto;bottom:70px;z-index:3;height:auto;gap:2px}
  .feed-col .act,.feed-col .act .ico{color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .feed-col .act.jam,.feed-col .act.jam .ico{filter:none}
  .feed-col .act.jam{text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .feed-col .act:hover > i{background:rgba(255,255,255,.18)}
  .fab{right:14px;bottom:72px;height:52px;width:52px;padding:0;justify-content:center;font-size:0;gap:0}
  .fab span{width:42px;height:42px}
  /* decks */
  .deck-cols{scroll-snap-type:x mandatory}
  .dcol,.dcol.wide{width:88vw;scroll-snap-align:start}
  /* onboarding */
  .onb{padding:64px 18px 32px;gap:16px}
  .onb-art .pop.v video.lead{height:200px}
  .hop{height:48px}
  .tapstage{height:176px;gap:2px}
  .tapstage .slot{width:92px}
  .tapstage .slot img{height:58px}
  .tapstage .slot.many img{height:42px}
  .tapstage .me{width:190px;margin:0 -30px}
  .tapstage .me .lead{height:164px}
  .tapstage .me .pop.v video.lead{height:176px}
  .passport{grid-template-columns:1fr}
  .pp-left{padding:16px 16px 0}
  .pp-photo{min-height:0;height:170px}
  .pp-right{border-left:0;padding:18px 18px 16px;gap:14px}
  .pp-name{font-size:34px}
}
</style>
</head>
<body>
<nav class="rail" aria-label="main">
  <a class="rail-brand" href="#/feed" aria-label="jammie"><img src="assets/jammie/v3/char-dollop.png" alt=""></a>
  <div class="rail-nav">
    <a class="draw" data-nav="feed" href="#/feed" aria-label="Feed"><i data-ico="home"></i></a>
    <a class="draw" data-nav="command" href="#/command" aria-label="Command centre"><i data-ico="chart"></i></a>
    <a class="draw" data-nav="saved" href="#/saved" aria-label="Saved"><i data-ico="bookmark"></i></a>
  </div>
  <div class="rail-nav low">
    <a class="draw" data-nav="memory" href="#/memory" aria-label="Memory"><i data-ico="book"></i></a>
    <a class="draw" data-nav="connectors" href="#/connectors" aria-label="Connectors"><i data-ico="link"></i></a>
  </div>
</nav>
<header class="topbar" id="topbar">
  <h1 id="barTitle"></h1>
  <nav class="deck-tabs" id="barTabs"></nav>
  <div class="top-right">
    <a class="ico-btn draw" id="bellBtn" href="#/bell" aria-label="Updates"><i data-ico="bell"></i><em id="bellN" hidden></em></a>
    <a class="ico-btn draw" id="youBtn" href="#/you" aria-label="You"><i data-ico="user"></i></a>
  </div>
</header>
<a class="fab draw" href="#/new" aria-label="Ask the team for something new"><span><img src="assets/jammie/v3/char-dollop.png" alt=""></span>New</a>
<main id="app"></main>
<aside id="side" aria-label="panel"></aside>
<div id="modal"></div>
<div class="toasts" id="toasts"></div>

<script src="assets/jammie/v3/icons.js?v=15"></script>
<script src="assets/jammie/v3/data.js?v=15"></script>
<script>
(() => {
  const { A, D, IDEAS, real, av, fcard, frameW } = window.JAMMIE;
  const $ = id => document.getElementById(id);
  const root = document.documentElement, app = $('app'), sideEl = $('side'), modal = $('modal');
  const STILL = new URLSearchParams(location.search).has('still');   // the flow map shows screens at rest
  if (STILL) root.classList.add('still');
  const ico = n => `<i data-ico="${n}"></i>`;

  // the workbench and the prototype share one saved look: tuned tokens, and light or dark
  const KEY = 'jammie-workbench-v5';
  let tune = {}; try { tune = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  const forced = new URLSearchParams(location.search).get('theme');   // ?theme=dark shows a screen dark without saving it
  function paint(theme){
    root.dataset.theme = theme;
    [...root.style].filter(k => k.startsWith('--')).forEach(k => root.style.removeProperty(k));
    Object.entries(tune).forEach(([k, v]) => { if (k.startsWith('--')) root.style.setProperty(k, v); });
    Object.entries((tune.themed && tune.themed[theme]) || {}).forEach(([k, v]) => root.style.setProperty(k, v));
  }
  paint(forced || tune.theme || 'light');
  function setTheme(theme){ tune.theme = theme; try { localStorage.setItem(KEY, JSON.stringify(tune)); } catch {} paint(theme); }

  // ---- state: where we are in the feed, what was kept or put aside, what went to the team
  let cur = 0, timers = [], arriving = false, shown = null, lastPage = 'feed';
  const store = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
  const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const SETS = { liked: new Set(store('jammie-proto-liked', ['reviews'])), later: new Set(STILL ? ['midnight'] : store('jammie-proto-later', [])) };
  const liked = SETS.liked, saveSet = n => keep('jammie-proto-' + n, [...SETS[n]]);
  let orders = STILL ? [{ id: 'reel', how: 'ship' }] : store('jammie-proto-orders', []);
  const HOW = { ship: ['With the team', 'Files land in your inbox'], change: ['With the team', 'They answer within 24 hours'], sloosh: ['Being made on Sloosh', 'About 4 minutes'], note: ['With the team', 'They answer within 24 hours'] };
  const idea = id => real.find(d => d.id === id) || real[0];
  function send(how, id){ orders = orders.filter(o => o.id !== id); orders.unshift({ id, how }); keep('jammie-proto-orders', orders); }

  function toast(text, pose = 'cheer'){
    const t = document.createElement('div'); t.className = 'toast';
    t.innerHTML = `<img src="${A}pose-${pose}.png" alt=""><span>${text}</span>`;
    $('toasts').append(t); setTimeout(() => t.remove(), 2700);
  }
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  // ---- onboarding pieces
  const dots = n => `<div class="dots">${[1, 2, 3, 4].map(i => `<i class="${i < n ? 'on' : i === n ? 'on now' : ''}"></i>`).join('')}</div>`;
  const chips = list => `<div class="chips">${list.map(c => `<button class="chip">${c}</button>`).join('')}</div>`;
  const mark = `<span class="brandmark"><img src="${A}char-dollop.png" alt="">jammie</span>`;
  // the onboarding stage: one centred column. Jammie on top, then one thought and one control
  const onb = (n, art, body, cls = '') => `<section class="onb ${cls}">${mark}${dots(n)}<div class="onb-art">${art}</div><div class="onb-body">${body}</div></section>`;
  // five short loops (idle, wave, search, cheer, sit); the flow map and reduced motion get the still
  const LOOPS = ['idle', 'wave', 'search', 'cheer', 'sit'], calm = STILL || matchMedia('(prefers-reduced-motion:reduce)').matches;
  const stillOf = p => p === 'idle' ? `${A}char-dollop.png` : `${A}pose-${p}.png`;
  const pose = p => LOOPS.includes(p) && !calm
    ? `<div class="pop v"><video class="lead" autoplay loop muted playsinline src="${A}anim/${p}.mp4"></video><img class="lead" src="${stillOf(p)}" alt=""></div>`
    : `<div class="pop ground"><div class="bob"><img class="lead" src="${stillOf(p)}" alt=""></div></div>`;
  // a coral bloom from where you pressed, then it lifts off the next screen
  function bloom(e, next){
    if (calm) { location.hash = next; return; }
    const c = document.createElement('div'); c.className = 'curtain'; c.style.setProperty('--cx', e.clientX + 'px'); c.style.setProperty('--cy', e.clientY + 'px');
    c.innerHTML = `<img src="${A}pose-cheer.png" alt="">`; document.body.append(c);
    setTimeout(() => { arriving = true; location.hash = next; }, 520);
    setTimeout(() => c.classList.add('lift'), 760); setTimeout(() => c.remove(), 1400);
  }
  // reading the store: each line writes itself as that thing is read, and what was found hops in beside Jammie.
  // The time left is worked out from what is still to read, so a bigger store would say a bigger number
  const READS = [['Opening wearcomet.com'], ['Found 229 products', 'bag'], ['Reading 1,171 things customers said', 'heart'], ['Watching 6 rivals and their 1,103 live ads', 'megaphone'], ['Looking at your own ads', 'chart']];
  const HOPS = [['bag', 2, 12, 2.1], ['heart', 80, 4, 2.5], ['megaphone', 0, 62, 2.3], ['chart', 82, 58, 2.7]];
  function runRead(next){
    const ul = app.querySelector('.stream'), eta = app.querySelector('.eta');
    const add = (text, cls) => { const li = document.createElement('li'); li.className = cls; li.innerHTML = `<i class="tick">${ico('check')}</i><span></span>`; li.lastChild.textContent = text; ul.append(li); window.jammieIcons(li); return li; };
    const hop = n => { const el = n && app.querySelector(`.hop[data-el="${n}"]`); if (el) el.classList.add('on'); };
    if (STILL) { READS.slice(0, 3).forEach(([t, e]) => { add(t, 'done'); hop(e); }); add(READS[3][0], 'now'); hop(READS[3][1]); eta.textContent = 'About 3 seconds left'; return; }
    const SPEED = 22, PAUSE = 460, total = READS.reduce((n, [t]) => n + t.length * SPEED + PAUSE, 0); let spent = 0;
    (function line(i){
      if (i === READS.length) { eta.textContent = 'All read'; later(() => { location.hash = next; }, 520); return; }
      const [text, el] = READS[i], li = add('', 'now'), span = li.lastChild; hop(el); let c = 0;
      (function type(){ span.textContent = text.slice(0, ++c); spent += SPEED; eta.textContent = `About ${Math.max(1, Math.ceil((total - spent) / 1000))} seconds left`;
        if (c < text.length) later(type, SPEED); else later(() => { li.className = 'done'; spent += PAUSE; line(i + 1); }, PAUSE); })();
    })(0);
  }
  // three taps: the role dresses Jammie, the goal and the channels land beside it
  const ROLES = { Founder: 'founder', Marketer: 'marketer', Designer: 'designer', Agency: 'agency' };
  const GOALS = { Sales: 'bag', 'Repeat buyers': 'heart', Reach: 'megaphone', 'Better ads': 'clapper' };
  const CHANS = { Instagram: 'instagram', 'Meta ads': 'meta', Google: 'google', Email: 'email' };
  function tapPicked(ask){
    const kind = ask.dataset.ask, on = [...ask.querySelectorAll('.chip.on')].map(c => c.textContent.trim());
    if (kind === 'role' && on[0]) { const me = $('meSlot'), old = me.lastElementChild;                 // the one on stage leaves to the left as the new one comes in from the right
      [...me.children].forEach(el => { if (el !== old) el.remove(); });
      if (old) { old.classList.remove('slide-in'); old.classList.add('slide-out'); setTimeout(() => old.remove(), calm ? 0 : 640); }
      me.insertAdjacentHTML('beforeend', `<div class="look ground slide-in"><div class="bob"><img class="lead" src="${A}look-${ROLES[on[0]]}.png" alt=""></div></div>`); }
    if (kind === 'goal' && on[0]) $('goalSlot').innerHTML = `<img class="in3d" src="${A}el-${GOALS[on[0]]}.png" alt="">`;
    if (kind === 'chan') { const slot = $('chanSlot');
      [...slot.children].forEach(el => { if (!on.includes(el.dataset.n)) el.remove(); });
      on.forEach(n => { if (!slot.querySelector(`[data-n="${n}"]`)) slot.insertAdjacentHTML('beforeend', `<img class="in3d" data-n="${n}" src="${A}el-${CHANS[n]}.png" alt="">`); });
      slot.classList.toggle('many', on.length > 2); }
  }
  const gate = inner => `<div class="gate"><div class="sheet gate-card">${inner}</div></div>`;
  const startScreen = () => onb(1, pose('search'), `
        <h1 class="h1">Add your store.</h1>
        <form class="store" data-go="#/signin">${ico('link')}<input placeholder="Paste a link or type its name" aria-label="Store link" value="wearcomet.com">
          <button class="btn b-jam draw">Read my store${ico('arrow')}</button></form>`);
  const G = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.300c0-.800-.100-1.600-.200-2.300H12v4.500h6.200a5.300 5.300 0 0 1-2.300 3.500v2.900h3.700c2.200-2 3.400-5 3.400-8.600Z"/><path fill="#34A853" d="M12 23.500c3.100 0 5.700-1 7.600-2.800l-3.700-2.900c-1 .700-2.400 1.100-3.900 1.100-3 0-5.500-2-6.400-4.700H1.800v3A11.500 11.500 0 0 0 12 23.500Z"/><path fill="#FBBC05" d="M5.600 14.200a6.900 6.900 0 0 1 0-4.400v-3H1.800a11.500 11.500 0 0 0 0 10.400Z"/><path fill="#EA4335" d="M12 5.100c1.700 0 3.200.600 4.400 1.700l3.300-3.300A11.500 11.500 0 0 0 1.800 6.800l3.800 3c.900-2.700 3.400-4.700 6.400-4.700Z"/></svg>`;
  const today = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

  // ---- pieces of the feed
  const STORIES = [['Today', 'reel.jpg'], ['Trends', 'midnight.jpg'], ['Popular ads', 'xlows.jpg'], ['Industry news', 'rival.jpg'], ['How to', 'sketch.jpg']];
  const stories = () => `<div class="stories-row"><div class="stories">${STORIES.map(([n, f], i) => `<a class="story ${i > 2 ? 'seen' : ''}" href="#/story?s=${i}"><i><b style="background-image:url(${D}${f})"></b></i>${n}</a>`).join('')}</div></div>`;
  // the actions hang beside the card. Jam is one of them: the main one, so it is red and a little larger
  const acts = d => d.special ? '' : `<div class="acts">
      <button class="act draw ${liked.has(d.id) ? 'liked' : ''}" data-do="keep">${ico('heart')}Keep</button>
      <button class="act draw" data-do="share">${ico('share')}Share</button>
      <button class="act draw" data-do="later">${ico('calendar')}Later</button>
      <button class="act draw" data-do="less">${ico('filter')}Less</button>
      <a class="act draw" href="#/idea">${ico('eye')}Why</a>
      <button class="act draw" data-do="feedback">${ico('message')}Note</button>
      <a class="act jam draw" href="#/jam">${ico('spark')}Jam</a>
    </div>`;
  const feedPage = () => `<section class="feed ${arriving ? 'arrive' : ''}">
      ${stories()}
      <div class="stage">${IDEAS.map((x, i) => `<div class="slide ${i === cur ? 'at' : ''}" data-i="${i}"><div class="feed-col">${fcard(x)}${acts(x)}</div></div>`).join('')}</div>
    </section>`;
  const curIdea = () => IDEAS[cur].special ? real[0] : IDEAS[cur];

  const home = () => go('#/' + lastPage);

  const DO = {
    keep: b => { const d = curIdea(); liked.has(d.id) ? liked.delete(d.id) : liked.add(d.id); saveSet('liked'); document.querySelectorAll('[data-do="keep"]').forEach(x => { if (!x.closest('.slide') || x.closest('.slide:not([inert])')) x.classList.toggle('liked', liked.has(d.id)); }); if (liked.has(d.id)) toast('Kept. It is in Saved.'); },
    share: () => toast('Link copied'), copy: () => toast('Caption copied'),
    later: () => { SETS.later.add(curIdea().id); saveSet('later'); toast('Put aside. It is in Saved.', 'sleep'); step(1); },
    less: () => { toast('Got it. Fewer like this.', 'worry'); step(1); },
    unsave: b => { SETS[b.dataset.set].delete(b.dataset.id); saveSet(b.dataset.set); render(true); },
    feedback: () => go('#/change'), sound: () => toast('Sound on'),
    ship: () => { send('ship', curIdea().id); go('#/feed'); toast('Sent to the team. Files land in your inbox.'); },
    sendchange: () => { send('change', curIdea().id); go('#/feed'); toast('Sent to the team. They answer within 24 hours.'); },
    sendnote: () => { send('note', curIdea().id); home(); toast('Sent to the team. They answer within 24 hours.'); },
    makesloosh: () => { send('sloosh', curIdea().id); go('#/feed'); toast('On it. About 4 minutes.'); },
    morelike: () => { toast('Noted. More like this one.'); step(1); },
    suggest: b => { const t = sideEl.querySelector('.composer textarea'); if (t) { t.value = b.textContent; t.focus(); } },
    noshopify: () => { toast('No problem. Estimates stay.', 'sleep'); step(1); }, more8: () => toast('8 more are on the way'),
    connect: b => toast(`${b.dataset.id} opens its own sign-in`, 'search'), feed: () => go('#/feed'), bell: () => go('#/bell'),
    col: b => { const c = $('dcol' + b.dataset.id); if (c) c.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', inline: 'start', block: 'nearest' }); },
    theme: b => { setTheme(b.dataset.id); render(); },
    restart: () => go('#/start'), help: () => toast('Opens your email', 'search'),
  };
  const LATER = ['report', 'costs', 'park', 'more', 'source', 'plan', 'tile', 'openbook', 'addnote', 'rename', 'learns', 'legal'];

  document.addEventListener('click', e => {
    const bl = e.target.closest('[data-bloom]'); if (bl) { e.preventDefault(); bloom(e, bl.getAttribute('href')); return; }
    const sl = e.target.closest('.slide'); if (sl) cur = +sl.dataset.i;        // whatever was pressed belongs to this card
    const open = e.target.closest('[data-open]');
    if (open) { const i = IDEAS.findIndex(d => d.id === open.dataset.open); if (i > -1) cur = i; }
    const b = e.target.closest('[data-do]');
    if (b) { const what = b.dataset.do; if (DO[what]) DO[what](b); else if (LATER.includes(what)) toast('This opens in the full build', 'search'); return; }
    const card = e.target.closest('.feed-col .fcard:not(.plain)');           // the card itself opens the idea
    if (card && !e.target.closest('a,button')) { location.hash = '#/idea'; return; }
    const chip = e.target.closest('.chip');
    if (chip && chip.tagName === 'BUTTON') { const ask = chip.closest('[data-ask]'); if (!ask) return;
      if (ask.dataset.ask === 'chan') chip.classList.toggle('on');           // you can post in more than one place
      else ask.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
      tapPicked(ask); }
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-go]'); if (f) { e.preventDefault(); location.hash = f.dataset.go; return; }
    const c = e.target.closest('[data-send]'); if (c) { e.preventDefault(); DO[c.dataset.send](); }
  });
  document.addEventListener('input', e => { const t = e.target; if (t.matches && t.matches('.composer textarea')) { t.style.height = 'auto'; t.style.height = Math.min(168, t.scrollHeight) + 'px'; } });
  document.addEventListener('keydown', e => {
    const typing = e.target.matches && e.target.matches('input,textarea');
    if (typing && e.key === 'Enter' && !e.shiftKey && e.target.closest('.composer')) { e.preventDefault(); e.target.closest('form').requestSubmit(); return; }
    if (e.key === 'Escape') { if (/^#\/signin/.test(location.hash)) location.hash = '#/start'; else if (document.body.matches('.has-side,.has-modal')) location.hash = '#/' + lastPage; return; }
    if (typing || !onFeed()) return;
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); step(1); }
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); step(-1); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const fr = app.querySelector('.slide:not([inert]) .frames'); if (fr) fr.scrollBy({ left: (e.key === 'ArrowRight' ? 1 : -1) * frameW(fr), behavior: 'smooth' }); }
  });
  // Touch scrolls the feed natively and it stops on each card. A wheel or trackpad is turned into one card a gesture,
  // because a snapped list springs back unless the wheel travels half a card. A gesture starts small, so add it up.
  let wAcc = 0, wLast = 0, wAbs = 0, wArmed = true, wStep = 0;
  addEventListener('wheel', e => {
    if (e.ctrlKey || !onFeed() || !(e.target.closest && e.target.closest('.feed'))) return;
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;                                            // sideways moves a carousel's frames
    e.preventDefault();
    const now = Date.now(), abs = Math.abs(e.deltaY);
    if (now - wLast > 180) { wAcc = 0; wArmed = true; }                                             // a new gesture
    else if (!wArmed && now - wStep > 500 && abs > wAbs + 6 && abs >= 10) { wAcc = 0; wArmed = true; } // pushed again while the last one coasts
    wLast = now; wAbs = abs;
    if (!wArmed) return;
    wAcc += e.deltaY;
    if (Math.abs(wAcc) >= 36) { wArmed = false; wStep = now; step(wAcc > 0 ? 1 : -1, false); }
  }, { passive: false });
  addEventListener('hashchange', () => render());
  window.jammieIcons(document);   // the rail and the top bar are drawn once
  render();
})();
</script>
</body>
