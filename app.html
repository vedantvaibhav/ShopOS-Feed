<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jammie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/jammie/v3/jammie.css?v=4">
<style>
/* screens only: every token and shared piece comes from jammie.css */
body{padding-left:60px;min-height:100vh;overflow-x:hidden}
body.bare{padding-left:0}
body.bare .rail{display:none}
a{text-decoration:none}

/* onboarding and other centred moments */
.center{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:56px 24px 40px;text-align:center}
.h1{font-size:var(--h-size);line-height:1.06}
.h2{font-size:calc(var(--h-size) * .64);line-height:1.1}
.lead{height:176px;width:auto;filter:drop-shadow(0 16px 12px rgba(0,0,0,.14))}
.dots{position:absolute;top:26px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dots i{width:22px;height:4px;border-radius:4px;background:var(--s3)}
.dots i.on{background:var(--fg)}
.store{display:flex;align-items:center;gap:10px;width:min(520px,100%);height:60px;padding:0 8px 0 20px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card);box-shadow:var(--shadow-2)}
.store:focus-within{border-color:var(--fg)}
.store input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font:inherit;font-size:16px}
.store .btn{border-radius:var(--r-pill)}
.store > [data-ico]{color:var(--fg-2)}
.todo{padding:0;margin:0;font-size:16px}

.brandcard{width:min(460px,100%);text-align:left;border:1px solid var(--line-soft);border-radius:var(--r-card);background:var(--card);padding:6px 20px}
.brandcard div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.brandcard div:last-child{border:0}
.brandcard small{color:var(--fg-2);font-size:14px}
.brandcard b{font-weight:600;text-align:right}
.swatches{display:flex;gap:6px}
.swatches i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.pair{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:min(760px,100%)}
.goal{border:1px solid var(--line-soft);border-radius:var(--r-card);background:var(--card);padding:0 0 14px;font-weight:600;overflow:hidden;transition:box-shadow .2s,border-color .2s}
.goal .art{aspect-ratio:1;--pad:22%;margin-bottom:12px}
.goal .art img{filter:drop-shadow(0 10px 8px rgba(0,0,0,.14))}
.goal:hover{border-color:var(--line)}
.goal.on{box-shadow:inset 0 0 0 2px var(--fg);border-color:var(--fg)}

/* the feed */
.feed{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;gap:24px;padding:24px}
.feed-col{display:flex;align-items:flex-end;gap:8px}
.age{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--fg-2);padding:8px 0}
.age .ico{color:var(--fg)}
.feed-nav{position:absolute;right:32px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.corner{position:absolute;top:14px;right:22px;display:flex;align-items:center;gap:2px}
.count{position:absolute;left:28px;bottom:24px;font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.fcard.enter-down{animation:in-down .42s var(--ease)}
.fcard.enter-up{animation:in-up .42s var(--ease)}
@keyframes in-down{from{opacity:0;transform:translateY(32px)}}
@keyframes in-up{from{opacity:0;transform:translateY(-32px)}}

/* why this */
.why{position:relative;width:380px;max-height:calc(100vh - 56px);overflow-y:auto;align-self:center;animation:in-side .4s var(--ease)}
@keyframes in-side{from{opacity:0;transform:translateX(20px)}}
.why h2{font-size:22px;line-height:1.15;margin:12px 0 18px}
.why h4{font-size:13px;margin:18px 0 8px;color:var(--fg-2);font-weight:600;letter-spacing:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts .stat{padding:12px;border-radius:12px}
.facts .stat b{font-size:21px}
.facts .stat small{font-size:12px}
.gets{display:grid;padding:0;margin:0}
.gets li{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.gets li:last-child{border:0}
.gets .ico{width:18px;height:18px}
.why-cta{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:20px}
.x{position:absolute;top:12px;right:12px}

/* pages: result, liked, numbers */
.page{max-width:1080px;margin:0 auto;padding:0 36px 80px}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;margin-bottom:12px}
.page-h h1{font-size:19px;font-weight:600;letter-spacing:0}
.page-h .right{display:flex;align-items:center;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.sec-t{font-size:20px;margin:26px 0 16px}

.result{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:start}
.result h2{font-size:26px;margin-bottom:18px}
.made{position:relative;aspect-ratio:4/5;border-radius:var(--r-card);overflow:hidden;padding:18px;display:flex;flex-direction:column;justify-content:space-between;color:#222}
.made .big{font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:.95}
.made .mid{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.made small{font-size:12px;font-weight:600;opacity:.75}
.made img{position:absolute;right:-8%;bottom:8%;width:56%;filter:drop-shadow(0 12px 10px rgba(0,0,0,.18))}
.made .dl{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#222;display:grid;place-items:center;box-shadow:var(--shadow-1);opacity:0;transition:opacity .2s}
.made:hover .dl,.made .dl:focus-visible{opacity:1}
.made .dl .ico{width:16px;height:16px}
.side{display:grid;gap:8px;position:sticky;top:24px}
.side .btn{width:100%}
.used{margin-top:8px;padding-top:14px;border-top:1px solid var(--line-soft);display:grid;gap:9px;font-size:14px;color:var(--fg-2)}
.used div{display:flex;gap:9px;align-items:center}
.used .ico{width:16px;height:16px}

.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.stat .top{display:flex;justify-content:space-between;align-items:baseline}
.bars{display:flex;align-items:flex-end;gap:5px;height:80px;margin:14px 0 12px}
.bars i{flex:1;border-radius:5px 5px 2px 2px;background:var(--s3)}
.bars i.hi{background:var(--fg)}
.stat .foot{display:flex;justify-content:flex-start;align-items:center;padding-top:10px;border-top:1px solid var(--line-soft);font-size:14px}
.stat .foot a{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.stat .foot .ico{width:15px;height:15px}

/* unlock */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:grid;place-items:center;padding:24px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.unlock{width:min(440px,100%);position:relative;animation:in-down .4s var(--ease)}
.unlock h2{font-size:24px;margin:0 0 16px}
.unlock .lead{height:84px;margin:0 0 10px}
.unlock .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}

.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;display:grid;gap:8px;pointer-events:none}
.toasts .toast{animation:toast 2.6s var(--ease) forwards}

html.still *{animation-duration:0s!important;animation-delay:0s!important}
html.still ::-webkit-scrollbar{display:none}

/* phone */
@media (max-width:760px){
  body{padding-left:0;padding-bottom:58px}
  body.bare{padding-bottom:0}
  .rail{inset:auto 0 0 0;width:auto;height:58px;flex-direction:row;padding:0 8px;border-right:0;border-top:1px solid var(--line-soft)}
  .rail-brand,.rail-me{display:none}
  .rail-nav{flex-direction:row;margin:0;gap:0;width:100%;justify-content:space-around}
  .feed{height:calc(100vh - 58px);padding:8px;gap:0}
  .fcard{height:100%;aspect-ratio:auto;width:100%}
  .feed-col{position:relative;width:100%;height:100%}
  .feed-col .acts{position:absolute;right:4px;bottom:200px;z-index:3}
  .feed-nav,.count,.corner{display:none}
  .why{position:fixed;inset:auto 0 0 0;width:auto;max-height:82vh;border-radius:var(--r-card) var(--r-card) 0 0;z-index:30}
  .page{padding:0 16px 80px}
  .grid3,.nums{grid-template-columns:1fr;gap:14px}
  .goals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .result{grid-template-columns:1fr}
  .h1{font-size:36px}.h2{font-size:28px}
}
</style>
</head>
<body>
<nav class="rail" aria-label="main">
  <a class="rail-brand" href="#/feed" aria-label="jammie"><img src="assets/jammie/v3/char-dollop.png" alt=""></a>
  <div class="rail-nav">
    <a class="draw" data-nav="feed" href="#/feed" aria-label="Feed"><i data-ico="home"></i></a>
    <a class="draw" data-nav="liked" href="#/liked" aria-label="Liked"><i data-ico="heart"></i></a>
    <a class="draw" data-nav="numbers" href="#/numbers" aria-label="Numbers"><i data-ico="chart"></i></a>
  </div>
  <a class="rail-me draw" href="#/start" aria-label="Your store"><i data-ico="store"></i></a>
</nav>
<main id="app"></main>
<div class="toasts" id="toasts"></div>

<script src="assets/jammie/v3/icons.js?v=4"></script>
<script src="assets/jammie/v3/data.js?v=4"></script>
<script>
(() => {
  const { A, IDEAS, av, fcard, icard, srow } = window.JAMMIE;
  const root = document.documentElement, app = document.getElementById('app');
  const STILL = new URLSearchParams(location.search).has('still');   // the flow map shows screens at rest
  if (STILL) root.classList.add('still');
  const ico = n => `<i data-ico="${n}"></i>`;

  // carry over whatever was tuned on the workbench
  try {
    const t = JSON.parse(localStorage.getItem('jammie-workbench-v4')) || {};
    root.dataset.theme = t.theme || 'light';
    Object.entries(t).forEach(([k, v]) => { if (k.startsWith('--')) root.style.setProperty(k, v); });
    Object.entries((t.themed && t.themed[root.dataset.theme]) || {}).forEach(([k, v]) => root.style.setProperty(k, v));
  } catch {}

  let cur = 0, timers = [];
  let liked; try { liked = new Set(JSON.parse(localStorage.getItem('jammie-proto-liked'))); } catch {}
  if (!liked || !liked.size) liked = new Set(['unboxing', 'quiet', 'sizes']);
  const saveLiked = () => { try { localStorage.setItem('jammie-proto-liked', JSON.stringify([...liked])); } catch {} };

  function toast(text, pose = 'cheer'){
    const t = document.createElement('div'); t.className = 'toast';
    t.innerHTML = `<img src="${A}pose-${pose}.png" alt=""><span>${text}</span>`;
    document.getElementById('toasts').append(t); setTimeout(() => t.remove(), 2700);
  }
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  // a list of steps that ticks itself off, then moves on
  function runTodo(next){
    const li = [...app.querySelectorAll('.todo li')];
    if (STILL) return;
    li.forEach((el, i) => { el.className = i === 0 ? 'now' : ''; });
    li.forEach((el, i) => later(() => {
      el.className = 'done'; if (li[i + 1]) li[i + 1].className = 'now';
      if (i === li.length - 1) later(() => { location.hash = next; }, 600);
    }, 900 * (i + 1)));
  }
  const todo = (items, doneN) => `<ul class="todo">${items.map((t, i) =>
    `<li class="${i < doneN ? 'done' : i === doneN ? 'now' : ''}"><i>${ico('check')}</i>${t}</li>`).join('')}</ul>`;
  const dots = n => `<div class="dots">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`;

  const actsCol = d => `<div class="acts">
      <div class="age">${ico('clock')}${d.age}</div>
      <button class="act draw ${liked.has(d.id) ? 'liked' : ''}" data-do="keep">${ico('heart')}Keep</button>
      <button class="act draw" data-do="share">${ico('share')}Share</button>
      <button class="act draw" data-do="ask">${ico('message')}Ask</button>
      <a class="act draw" href="#/why">${ico('eye')}Why</a>
      <button class="act draw" data-do="more" aria-label="More">${ico('more')}</button>
    </div>`;
  const topRight = () => `<button class="ico-btn draw" data-do="bell" aria-label="Updates">${ico('bell')}</button>${av(32)}`;

  const feedShell = (d, extra = '', o = {}) => `<section class="feed">
      <div class="feed-col">${fcard(d, { top: true, ...o })}${actsCol(d)}</div>
      ${extra}
      <div class="corner">${topRight()}</div>
      <div class="feed-nav"><button class="btn b-round draw" data-do="prev" aria-label="Previous idea">${ico('up')}</button><button class="btn b-round draw" data-do="next" aria-label="Next idea">${ico('down')}</button></div>
      <div class="count">${cur + 1} of ${IDEAS.length}</div>
    </section>`;
  const pageHead = (title, right = '') => `<div class="page-h"><h1>${title}</h1><div class="right">${right}${topRight()}</div></div>`;

  const GOALS = [['chart', 'More sales'], ['megaphone', 'Better ads'], ['heart', 'Repeat buyers'], ['magnifier', 'Get found']];

  const SCREENS = {
    // ---- onboarding: five steps
    start: { bare: true, html: () => `<section class="center">${dots(1)}
        <img class="lead" src="${A}pose-wave.png" alt="">
        <h1 class="h1">Add your store.</h1>
        <form class="store" data-go="#/reading">${ico('link')}<input placeholder="yourstore.com" aria-label="Store link" value="wearcomet.com">
          <button class="btn b-jam draw">Read my store${ico('arrow')}</button></form>
      </section>` },

    reading: { bare: true, html: () => `<section class="center">${dots(2)}
        <img class="lead" src="${A}pose-search.png" alt="">
        <h1 class="h2">Reading Comet</h1>
        ${todo(['42 products', '285 reviews', 'Your ads', 'Three rivals'], 2)}
      </section>`, enter: () => runTodo('#/brand') },

    brand: { bare: true, html: () => `<section class="center">${dots(3)}
        <h1 class="h2">Is this Comet?</h1>
        <div class="brandcard">
          <div><small>Sells</small><b>Lifestyle sneakers</b></div>
          <div><small>For</small><b>Men and women, 18 to 30</b></div>
          <div><small>Sounds</small><b>Playful, direct</b></div>
          <div><small>Colours</small><span class="swatches"><i style="background:#2B50E0"></i><i style="background:#9AA4B2"></i><i style="background:#111"></i><i style="background:#F4F1EA"></i></span></div>
        </div>
        <div class="pair"><a class="btn b-jam draw" href="#/goal">Looks right${ico('arrow')}</a><button class="btn b-out" data-do="fix">Fix it</button></div>
      </section>` },

    goal: { bare: true, html: () => `<section class="center">${dots(4)}
        <h1 class="h2">What matters most right now?</h1>
        <div class="goals">${GOALS.map(([el, name], i) => `<button class="goal ${i === 0 ? 'on' : ''}"><div class="art"><img src="${A}el-${el}.png" alt=""></div>${name}</button>`).join('')}</div>
        <a class="btn b-jam draw" href="#/first">Continue${ico('arrow')}</a>
      </section>` },

    first: { bare: true, html: () => `<section class="center">${dots(5)}
        <h1 class="h2">Your first idea is here.</h1>
        ${fcard(IDEAS[0], { cls: 'sm', cta: false })}
        <a class="btn b-jam draw" href="#/feed">Open my feed${ico('arrow')}</a>
      </section>` },

    // ---- the product
    feed: { nav: 'feed', html: () => { const d = IDEAS[cur]; return feedShell(d, '', d.locked ? { cls: 'locked', cta: 'Unlock', href: '#/unlock' } : {}); } },

    why: { nav: 'feed', html: () => { const d = IDEAS[cur]; return feedShell(d, `<aside class="sheet why">
        <a class="ico-btn x draw" href="#/feed" aria-label="Close">${ico('close')}</a>
        <div class="who">${av()}<b>Jammie</b><span>${d.kind}</span></div>
        <h2>${d.title}</h2>
        <h4>Why this</h4>
        <div class="facts">
          <div class="stat"><b>285</b><small>reviews</small></div>
          <div class="stat"><b>4.7</b><small>average</small></div>
          <div class="stat"><b>62%</b><small>leave at the price</small></div>
        </div>
        <h4>You get</h4>
        <ul class="gets"><li>${ico('image')}3 ad images</li><li>${ico('megaphone')}3 headlines</li><li>${ico('message')}1 caption</li></ul>
        <div class="why-cta"><a class="btn b-jam draw" href="#/making">Make this${ico('arrow')}</a><button class="btn b-out" data-do="skip">Not for me</button></div>
      </aside>`); } },

    making: { nav: 'feed', html: () => `<section class="center">
        <img class="lead" src="${A}pose-walk.png" alt="">
        <h1 class="h2">Making 3 ads</h1>
        ${todo(['Writing the headlines', 'Picking your photos', 'Laying out the ads'], 1)}
        <a class="btn b-out" href="#/feed">Keep browsing</a>
      </section>`, enter: () => runTodo('#/result') },

    result: { nav: 'feed', html: () => `<section class="page">
        ${pageHead('Made for you', `<a class="btn b-soft b-sm draw" href="#/feed">${ico('back')}Feed</a>`)}
        <div class="result">
          <div><h2>${IDEAS[0].title}</h2>
          <div class="grid3">
            <div class="made" style="background:#F4F4F4"><div><div class="big">285</div><div class="mid">five-star reviews</div></div><small>Comet · Shop now</small><img src="${A}el-megaphone.png" alt=""><button class="dl draw" aria-label="Download">${ico('download')}</button></div>
            <div class="made" style="background:#FFE9EC"><div class="mid">“The best sneakers I've owned.”</div><small>Rated 4.7 by 285 buyers</small><img src="${A}el-heart.png" alt=""><button class="dl draw" aria-label="Download">${ico('download')}</button></div>
            <div class="made" style="background:#222;color:#fff"><div><div class="big">4.7</div><div class="mid">from people who wear them daily</div></div><small>Comet · See the reviews</small><img src="${A}el-sparkle.png" alt=""><button class="dl draw" aria-label="Download">${ico('download')}</button></div>
          </div></div>
          <aside class="side">
            <button class="btn b-jam draw" data-do="download">${ico('download')}Download all</button>
            <button class="btn b-out draw" data-do="share">${ico('share')}Share</button>
            <a class="btn b-soft draw" href="#/making">${ico('spark')}Make more like this</a>
            <div class="used"><div>${ico('star')}285 reviews</div><div>${ico('image')}3 product photos</div><div>${ico('store')}Your brand colours</div></div>
          </aside>
        </div>
      </section>`, enter: () => { if (!STILL) toast('Your ads are ready'); } },

    liked: { nav: 'liked', html: () => { const list = IDEAS.filter(d => liked.has(d.id)); return `<section class="page">
        ${pageHead('Liked')}
        ${srow('Made for you', '3 ads · today', ['sparkle', 'heart', 'megaphone'], '#/result')}
        <h2 class="sec-t">Ideas you kept</h2>
        ${list.length ? `<div class="grid3">${list.map(d => icard(d, { liked: true })).join('')}</div>`
          : `<div class="center" style="min-height:50vh"><img class="lead" src="${A}pose-sleep.png" alt=""><h2 class="h2">Nothing kept yet</h2><a class="btn b-out" href="#/feed">Open the feed</a></div>`}
      </section>`; } },

    numbers: { nav: 'numbers', html: () => { const card = (label, value, delta, dir, bars, idea) => `<div class="stat">
          <div class="top"><small>${label}</small><span class="delta ${dir}">${delta}</span></div><b>${value}</b>
          <div class="bars">${bars.map((h, i) => `<i class="${i === bars.length - 1 ? 'hi' : ''}" style="height:${h}%"></i>`).join('')}</div>
          <div class="foot"><a class="draw" href="#/feed" data-open="${IDEAS[idea].id}">${IDEAS[idea].title}${ico('arrow')}</a></div></div>`;
        return `<section class="page">
        ${pageHead('Numbers', `<div class="seg"><button class="on">7 days</button><button>30 days</button></div>`)}
        <div class="nums">
          ${card('Net sales', '₹1.4L', '▼ 28%', 'down', [82, 74, 90, 66, 58, 52, 47], 0)}
          ${card('Return on ads', '1.1×', '▼ 24%', 'down', [70, 78, 64, 60, 44, 50, 38], 4)}
          ${card('Buyers who came back', '18%', '▲ 3%', 'up', [40, 44, 42, 50, 52, 58, 62], 3)}
          ${card('Days of stock', '31', '3 sizes out', 'down', [90, 84, 76, 70, 62, 54, 48], 2)}
        </div></section>`; } },

    unlock: { nav: 'feed', html: () => feedShell(IDEAS[IDEAS.length - 1], `<div class="scrim"><div class="sheet unlock">
          <a class="ico-btn x draw" href="#/feed" aria-label="Close">${ico('close')}</a>
          <img class="lead" src="${A}pose-sit.png" alt="">
          <h2>Unlock every idea</h2>
          <label class="input"><small>Your name</small><input placeholder="First and last"></label>
          <div class="chips"><button class="chip on">Just me</button><button class="chip">2 to 5</button><button class="chip">6 to 20</button><button class="chip">More</button></div>
          <button class="btn b-jam" style="width:100%" data-do="sent">Send</button>
        </div></div>`, { cls: 'locked', cta: 'Unlock', href: '#/unlock' }) },
  };

  function render(){
    timers.forEach(clearTimeout); timers = [];
    const [name, query] = (location.hash.replace(/^#\/?/, '') || 'start').split('?');
    const s = SCREENS[name] || SCREENS.start;
    const i = new URLSearchParams(query || '').get('i');           // #/feed?i=2 opens on a given idea
    if (i !== null && IDEAS[+i]) cur = +i;
    if (name === 'unlock') cur = IDEAS.length - 1;
    document.body.classList.toggle('bare', !!s.bare);
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === s.nav));
    app.innerHTML = s.html();
    window.jammieIcons(document);
    window.scrollTo(0, 0);
    if (s.enter) s.enter();
  }

  function step(dir){
    cur = (cur + dir + IDEAS.length) % IDEAS.length;
    if (location.hash !== '#/feed') history.replaceState(null, '', '#/feed');
    render();
    const c = app.querySelector('.fcard'); if (c) c.classList.add(dir > 0 ? 'enter-down' : 'enter-up');
  }

  document.addEventListener('click', e => {
    const like = e.target.closest('[data-like]');
    if (like) { e.preventDefault(); liked.delete(like.dataset.id); saveLiked(); render(); return; }
    const b = e.target.closest('[data-do]');
    if (b) {
      const d = IDEAS[cur], what = b.dataset.do;
      if (what === 'keep') { liked.has(d.id) ? liked.delete(d.id) : liked.add(d.id); saveLiked(); b.classList.toggle('liked'); if (liked.has(d.id)) toast('Saved to liked'); }
      else if (what === 'share') toast('Link copied');
      else if (what === 'ask') toast('Ask is coming next', 'search');
      else if (what === 'bell') toast('Nothing new yet', 'sleep');
      else if (what === 'fix') toast('Editing comes next', 'search');
      else if (what === 'download') toast('Downloading 3 ads');
      else if (what === 'next') step(1);
      else if (what === 'prev') step(-1);
      else if (what === 'skip') { toast('Got it. Fewer like this.', 'worry'); step(1); }
      else if (what === 'sent') { toast('Sent. We will be in touch.'); location.hash = '#/feed'; }
      return;
    }
    const open = e.target.closest('[data-open]');
    if (open) { const i = IDEAS.findIndex(d => d.id === open.dataset.open); if (i > -1) cur = i; }
    const goal = e.target.closest('.goal'); if (goal) goal.parentElement.querySelectorAll('.goal').forEach(g => g.classList.toggle('on', g === goal));
    const chip = e.target.closest('.chip'); if (chip) chip.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
    const sg = e.target.closest('.seg button'); if (sg) sg.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === sg));
  });
  document.addEventListener('submit', e => { const f = e.target.closest('[data-go]'); if (f) { e.preventDefault(); location.hash = f.dataset.go; } });
  document.addEventListener('keydown', e => {
    if (e.target.matches && e.target.matches('input,textarea')) return;
    const onFeed = /^#\/(feed|why)(\?|$)/.test(location.hash);
    if (onFeed && (e.key === 'ArrowDown' || e.key === 'j')) { e.preventDefault(); step(1); }
    if (onFeed && (e.key === 'ArrowUp' || e.key === 'k')) { e.preventDefault(); step(-1); }
    if (e.key === 'Escape' && /^#\/(why|unlock)/.test(location.hash)) location.hash = '#/feed';
  });
  addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
