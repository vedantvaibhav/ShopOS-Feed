<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jammie design system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/jammie/v3/jammie.css?v=24">
<style>
/* the docs shell only. Every token and component shown here lives in jammie.css and data.js */
:root{--nav-w:248px;--top:64px;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
html{scroll-behavior:auto}
/* ---------- top bar ---------- */
.dt{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:8px;padding:0 24px;background:var(--bg);transition:box-shadow .2s}
.dt.scrolled{box-shadow:0 1px 0 var(--line-soft)}
.brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;margin-right:auto}
.brand img{height:28px;width:auto}
.brand b{color:var(--jam);font-weight:800;font-size:19px;letter-spacing:-.03em}
.brand span{color:var(--fg-2);font-weight:500;font-size:15px}
.dt a.go{height:34px;padding:0 12px;border-radius:var(--r-pill);display:inline-flex;align-items:center;font-size:14px;font-weight:500;color:var(--fg-2);text-decoration:none}
.dt a.go:hover{background:var(--s2);color:var(--fg)}
.dt .btn{margin-left:4px}
.menu-btn{display:none}
/* ---------- sidebar ---------- */
.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);max-width:1360px;margin:0 auto}
.dnav{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;padding:8px 16px 48px 24px;scrollbar-width:thin}
.dnav h6{margin:24px 0 6px 10px;font-size:12px;font-weight:600;color:var(--fg-3)}
.dnav h6:first-child{margin-top:8px}
.dnav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--fg-2);text-decoration:none}
.dnav a:hover{background:var(--s2);color:var(--fg)}
.dnav a.on{background:var(--s2);color:var(--fg);font-weight:600}
/* ---------- a page ---------- */
.dmain{min-width:0;padding:16px 48px 120px}
.dpage{max-width:900px;animation:pg .28s var(--ease) both}
@keyframes pg{from{opacity:0;transform:translateY(8px)}}
.crumb{font-size:13px;color:var(--fg-2)}
.dpage h1{font-size:36px;line-height:1.1;margin:6px 0 10px}
.lede{margin:0 0 32px;font-size:17px;line-height:1.5;color:var(--fg-2);max-width:62ch}
.dpage h2{font-size:20px;margin:48px 0 14px}
.lede + h2{margin-top:0}
.dpage p{max-width:68ch;margin:0 0 12px}
.dpage ul.rules{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.dpage ul.rules li{padding:12px 16px;border-radius:6px;background:var(--s2)}
.dpage ul.rules li:first-child{border-radius:var(--r-card) var(--r-card) 6px 6px}
.dpage ul.rules li:last-child{border-radius:6px 6px var(--r-card) var(--r-card)}
.dpage ul.rules li:only-child{border-radius:var(--r-card)}
code{font:13px var(--mono);padding:1px 6px;border-radius:6px;background:var(--s2)}
td code,li code{background:var(--card)}
/* a live example sits on a soft panel */
.demo{border-radius:var(--r-card);background:var(--s2);padding:40px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.demo.page{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line-soft)}   /* cards that sit on the page itself are shown on the page colour */
.demo.left{justify-content:flex-start}
.demo + .demo,.demo + .code,.code + .demo,.spec + .code,.dd + .code,.spec + .dd,.demo + .spec,.demo + .dd{margin-top:12px}
.demo .cap{width:100%;font-size:12px;font-weight:600;color:var(--fg-2)}
/* a spec: soft rows, no rules */
.spec{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:14px}
.spec th{text-align:left;font-size:12px;font-weight:600;color:var(--fg-2);padding:4px 14px}
.spec td{background:var(--s2);padding:11px 14px;vertical-align:top}
.spec td:first-child{border-radius:8px 0 0 8px;white-space:nowrap}
.spec td:last-child{border-radius:0 8px 8px 0}
.spec td.c{color:var(--fg-2)}
/* code you can copy */
.code{position:relative;border-radius:14px;background:var(--s2);padding:16px 18px;font:13px/1.65 var(--mono);white-space:pre;overflow-x:auto;color:var(--fg)}
.code .cp{position:absolute;top:8px;right:8px;height:28px;padding:0 10px;border:0;border-radius:8px;background:var(--card);font:600 12px var(--font);color:var(--fg-2);box-shadow:var(--shadow-1)}
.code .cp:hover{color:var(--fg)}
.code .bad{color:var(--jam)}
/* do and don't */
.dd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dd > div{border-radius:var(--r-card);background:var(--s2);padding:16px 18px}
.dd b{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.dd b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.dd .no b::before{background:var(--jam)}
.dd p{margin:0;font-size:14.5px;color:var(--fg-2)}
/* grids */
.grid{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px}
.tile{position:relative;aspect-ratio:1;border-radius:var(--r-card);--pad:16%}
.tile img{filter:var(--felt)}
.tile small{position:absolute;left:12px;bottom:9px;font-size:12.5px;color:var(--fg-2)}
.tile.wide{aspect-ratio:4/3;--pad:20%}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--s2);font-size:12px;font-weight:600;color:var(--fg-2);vertical-align:middle;margin-left:8px}
.loop{position:relative;aspect-ratio:1;border-radius:var(--r-card);background:#F7F7F7;overflow:hidden}
.loop video,.loop img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;mix-blend-mode:multiply}
.loop small{position:absolute;left:12px;bottom:9px;font-size:12.5px;color:#6A6A6A}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.icon-tile{height:88px;border:0;border-radius:14px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--fg-2)}
.icon-tile:hover{background:var(--s3);color:var(--fg)}
.icon-tile .ico{width:24px;height:24px;color:var(--fg)}
/* colour */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.swc i{display:block;height:76px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.18)}
.swc b{display:block;margin-top:8px;font-size:13.5px;font-weight:600}
.swc small{display:block;font:12px var(--mono);color:var(--fg-2)}
/* type */
.scale{display:grid;gap:3px}
.scale > div{display:grid;grid-template-columns:120px minmax(0,1fr) 90px;align-items:baseline;gap:20px;padding:16px;border-radius:6px;background:var(--s2)}
.scale > div:first-child{border-radius:var(--r-card) var(--r-card) 6px 6px}
.scale > div:last-child{border-radius:6px 6px var(--r-card) var(--r-card)}
.scale span{font-size:13px;color:var(--fg-2)}
.scale em{font:normal 12px var(--mono);color:var(--fg-2);text-align:right}
.dpage .scale p{margin:0;line-height:1.25;letter-spacing:var(--h-track)}
/* shape, depth, space */
.boxes{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:center}
.boxes > div{display:grid;justify-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);text-align:center}
.boxes i{display:block;width:96px;height:96px;background:var(--card)}
.space{display:grid;gap:8px}
.space div{display:flex;align-items:center;gap:16px;font-size:13.5px;color:var(--fg-2)}
.space i{flex:none;display:block;height:16px;border-radius:4px;background:color-mix(in srgb,var(--jam) 70%,var(--bg))}
.space span{flex:none;width:44px;font-family:var(--mono);font-size:12px}
.shell-map{display:grid;grid-template-columns:7% 1fr 30%;grid-template-rows:12% 1fr;aspect-ratio:16/9;width:100%;border-radius:14px;overflow:hidden;gap:3px;background:var(--s2);font-size:12.5px;color:var(--fg-2)}
.shell-map div{display:grid;place-items:center;background:var(--card);text-align:center;padding:4px}
.shell-map .r{grid-row:1/3}
.shell-map .s{grid-row:1/3;background:var(--floor)}
.mo{width:120px;height:80px;border-radius:14px;background:var(--card);box-shadow:var(--shadow-2)}
.mo.run{animation:pg .28s var(--ease) both}
.mo.side.run{animation:mo-side .32s var(--ease) both}
@keyframes mo-side{from{opacity:0;transform:translateX(28px)}}
/* component previews */
.feed-demo{--fc-h:520px;display:flex;align-items:flex-start;gap:12px}
.feed-demo .acts{height:var(--fc-h);justify-content:flex-end}
.demo .ideas{width:100%;grid-template-columns:repeat(3,minmax(0,1fr))}
.st-row{display:flex;gap:16px;--st:64px}
.demo .dcol{--w:320px}
.demo .tiles3{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.demo .rows{width:min(440px,100%)}
.states{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%}
.state{min-height:220px;border-radius:var(--r-card);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.state > img{height:96px;width:auto}
.state h4{font-size:15.5px}
.cta-row{display:flex;flex-wrap:wrap;gap:8px}
.phones{gap:24px;align-items:flex-start}
.phones figure{margin:0;display:grid;justify-items:center;gap:10px;font-size:12.5px;color:var(--fg-2)}
.phones iframe{width:375px;height:740px;border:0;border-radius:32px;background:var(--bg);box-shadow:var(--shadow-3);zoom:.62;pointer-events:none}   /* a real 375px page, shown smaller */
/* bottom: the next page */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:64px;max-width:900px}
.pager a{display:block;padding:16px 18px;border-radius:var(--r-card);background:var(--s2);text-decoration:none}
.pager a:hover{background:var(--s3)}
.pager a.next{text-align:right;grid-column:2}
.pager small{display:block;font-size:12.5px;color:var(--fg-2)}
.pager b{font-weight:600}
.flash{position:fixed;left:50%;bottom:24px;z-index:40;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.25s var(--ease)}
.flash.show{transform:translate(-50%,0);opacity:1}
.shade{display:none}

@media (max-width:1100px){
  .dmain{padding:16px 32px 96px}
  .states{grid-template-columns:1fr 1fr}
  .grid{--n:3}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .dt{padding:0 8px 0 4px}
  .menu-btn{display:grid}
  .dt a.go{display:none}
  .dnav{position:fixed;top:var(--top);left:0;bottom:0;z-index:19;width:280px;height:auto;background:var(--bg);transform:translateX(-100%);transition:transform .3s var(--ease)}
  body.nav-open .dnav{transform:none;box-shadow:var(--shadow-3)}
  body.nav-open .shade{display:block;position:fixed;inset:var(--top) 0 0;z-index:18;background:rgba(0,0,0,.3)}
  .dmain{padding:8px 16px 96px}
  .dpage h1{font-size:30px}
  .demo{padding:24px 16px}
  .dd,.pager{grid-template-columns:1fr}
  .pager a.next{grid-column:1}
  .scale > div{grid-template-columns:1fr;gap:4px}
  .scale em{text-align:left}
  .grid{--n:2!important}
  .demo .ideas,.demo .tiles3{grid-template-columns:1fr 1fr}
  .feed-demo{--fc-h:440px}
  .brand span{display:none}
  .spec td:first-child{white-space:normal}
}
@media (max-width:520px){
  .dt .btn.cmd span{display:none}
  .dt .btn.cmd{width:34px;padding:0}
  .states{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="dt" id="top">
  <button class="ico-btn menu-btn draw" id="menuBtn" aria-label="Sections" aria-expanded="false"><i data-ico="menu"></i></button>
  <a class="brand" href="#overview"><img src="assets/jammie/v3/char-dollop-sm.png" alt=""><b>jammie</b><span>Design system</span></a>
  <a class="go" href="app.html">Prototype</a>
  <a class="go" href="flows.html">Flow map</a>
  <button class="ico-btn draw" id="themeBtn" aria-label="Dark theme"><i data-ico="moon"></i></button>
  <button class="btn b-soft b-sm cmd draw" id="copyMd" title="Copy the whole system as Markdown"><i data-ico="link"></i><span>Copy MD</span></button>
  <a class="btn b-ink b-sm cmd draw" href="skill/jammie-design/SKILL.md" download="SKILL.md" title="Download SKILL.md for Claude Code"><i data-ico="download"></i><span>Download skill</span></a>
</header>

<div class="shell">
  <nav class="dnav" id="nav" aria-label="Design system"></nav>
  <main class="dmain" id="main"></main>
</div>
<div class="shade" id="shade"></div>
<div class="toast flash" id="flash" role="status"><img src="assets/jammie/v3/pose-cheer-sm.png" alt=""><span></span></div>

<script src="assets/jammie/v3/icons.js?v=24"></script>
<script src="assets/jammie/v3/data.js?v=24"></script>
<script>
(() => {
  const root = document.documentElement, J = window.JAMMIE, A = J.A, $ = id => document.getElementById(id);
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // a code block; the part after "Incorrect" shows in red
  const code = s => { const h = esc(s), i = h.indexOf('&lt;!-- Incorrect'); return `<div class="code"><button class="cp" data-copy>Copy</button>${i < 0 ? h : h.slice(0, i) + `<span class="bad">${h.slice(i)}</span>`}</div>`; };
  const spec = (head, rows) => `<table class="spec"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i === 2 ? 'c' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const dd = (yes, no) => `<div class="dd"><div><b>Do</b><p>${yes}</p></div><div class="no"><b>Don’t</b><p>${no}</p></div></div>`;
  const tile = (file, name, wide) => `<div class="tile art ${wide ? 'wide' : ''}"><img src="${A}${file}.png" alt="${name}" loading="lazy"><small>${name}</small></div>`;
  const rules = list => `<ul class="rules">${list.map(r => `<li>${r}</li>`).join('')}</ul>`;
  const tok = t => `<code>${t}</code>`;

  // Command centre sample cards (the demo store's numbers)
  const DECK = [
    { label: 'Net sales · 7 days', value: '₹1.4Cr', delta: '▼ 13%', dir: 'down', line: 'What customers paid, after discounts and returns.', bars: [70, 78, 79, 80, 78, 82, 95, 67, 66, 68, 81, 73, 67, 68], mini: [['Orders', '2,179'], ['An order', '₹6,380'], ['New customers', '1,629']], acts: [['More', 'more'], ['Weekly report', 'report']] },
    { label: 'Refunds · 7 days', value: '₹3L', delta: '▼ 11%', dir: 'up', line: 'Refunded on orders placed in these days, so far.', bars: [62, 70, 58, 66, 74, 61, 55], acts: [['P&L report', 'report']] },
    { label: 'Sales per ₹1 of ads · 7 days', value: '5.2×', delta: '▼ 13%', dir: 'down', line: 'Sales for every ₹1 of ads.', bars: [79, 74, 76, 90, 83, 77, 78], acts: [['Marketing report', 'report']] },
    { label: 'Campaigns · 7 days', need: true, value: '₹26.9L', line: 'Spent across 5 campaigns. Set your costs to get a call on each.', acts: [['Park', 'park'], ['Let’s jam', 'jam']] },
  ];
  const acts = () => `<div class="acts"><button class="act draw" data-like><i data-ico="heart"></i>Keep</button><button class="act draw"><i data-ico="share"></i>Share</button><button class="act draw"><i data-ico="calendar"></i>Later</button><button class="act draw"><i data-ico="filter"></i>Less</button><button class="act draw"><i data-ico="eye"></i>Why</button><button class="act draw"><i data-ico="message"></i>Note</button><a class="act jam draw" href="#"><i data-ico="jam"></i>Jam</a></div>`;
  const sw = ([v, n]) => `<div class="swc"><i style="background:var(${v})"></i><b>${n}</b><small data-tok="${v}">${v}</small></div>`;

  // ---------- the pages, in sidebar order ----------
  const PAGES = [
    { g: 'Get started', id: 'overview', t: 'Overview', lede: 'The tokens, characters and cards every Jammie screen is built from. The prototype and the flow map read the same files, so what you see here is what ships.', body: () => `
      <h2>Rules everywhere</h2>
      ${rules(['Colours come from tokens only. No hex values in a component.', 'No orange or yellow. The one accent is red, ' + tok('--jam') + '.', 'No hairlines between things: soft fills and gaps do the separating.', 'One red button (' + tok('b-jam') + ') per view.', 'Cards carry a picture, a title, one line at most and one action. No helper paragraphs.', 'Jammie is the only character in the product.'])}
      <h2>Files</h2>
      ${spec(['File', 'Holds'], [[tok('assets/jammie/v3/jammie.css'), 'Tokens and every shared component'], [tok('assets/jammie/v3/data.js'), 'The demo ideas and the card renderers: fcard, scard, story, dcard, ltile'], [tok('assets/jammie/v3/icons.js'), 'The line icons'], [tok('skill/jammie-design/SKILL.md'), 'This system as rules an agent can follow']])}
      <h2>Use it with an agent</h2>
      <p>Put the skill in <code>.claude/skills/jammie-design/</code>, or paste the Markdown into a prompt.</p>
      <div class="cta-row"><a class="btn b-ink draw" href="skill/jammie-design/SKILL.md" download="SKILL.md"><i data-ico="download"></i>Download skill</a><button class="btn b-soft" data-do="copymd">Copy MD</button></div>` },

    { g: 'Foundations', id: 'colour', t: 'Colour', lede: 'White pages, soft greys and one clean red. The values under each swatch are read from the theme you are viewing.', body: () => `
      <h2>Surfaces and text</h2>
      <div class="sw">${[['--bg', 'Page'], ['--card', 'Raised'], ['--s2', 'Soft fill'], ['--s3', 'Soft fill, hover'], ['--floor', 'Behind a panel'], ['--line', 'Input border'], ['--fg', 'Text'], ['--fg-2', 'Quiet text'], ['--fg-3', 'Disabled']].map(sw).join('')}</div>
      <h2>Accent and signals</h2>
      <div class="sw">${[['--jam', 'Accent'], ['--jam-2', 'Accent, drift'], ['--good', 'Moved the right way'], ['--on', 'Switched on']].map(sw).join('')}</div>
      <h2>Command centre columns</h2>
      <p>Each column carries one accent in ${tok('--acc')} for its bars and meter. These five only, one a column.</p>
      <div class="sw">${[['#7C5CFC', 'With the team'], ['#17A673', 'Finance'], ['#2F6BFF', 'Marketing return'], ['#0FA3B1', 'Stock & delivery'], ['#E0245E', 'The stove']].map(([v, n]) => `<div class="swc"><i style="background:${v}"></i><b>${n}</b><small>${v}</small></div>`).join('')}</div>
      <h2>Which one</h2>
      ${spec(['Need', 'Token', 'Why'], [['The page', tok('--bg'), ''], ['Raised over the page', tok('--card') + ' + ' + tok('--shadow-3'), 'Sheets, toasts, popups'], ['A block in a list, a tile', tok('--s2'), 'Hover is --s3. This is how things separate, instead of lines'], ['Titles and body', tok('--fg'), ''], ['Meta, labels, counts', tok('--fg-2'), ''], ['Needs you, a drop', tok('--jam'), 'Red means act'], ['A rise', tok('--good'), 'Only on numbers']])}
      ${dd('Use a soft fill to group things.', 'Draw a 1px line between rows or around a card.')}` },

    { g: 'Foundations', id: 'type', t: 'Typography', lede: 'One typeface, Figtree. Titles are 600; body is 400 at 15.5px with a 1.5 line height.', body: () => `
      <div class="scale">${[['Display', 'font-size:48px;font-weight:600', 'Add your store.', '48 / 600'], ['Lead', 'font-size:22px;font-weight:600', 'Your first idea is here.', '22 / 600'], ['Page title', 'font-size:19px;font-weight:600', 'Command centre', '19 / 600'], ['Section', 'font-size:18px;font-weight:600', 'What I know', '18 / 600'], ['Card title', 'font-size:15.5px;font-weight:600', 'Lead with 285 reviews, not the price', '15.5 / 600'], ['Body', 'font-size:15.5px;line-height:1.5', 'Open a card for the details. Keep what fits, and Jammie learns what to bring next.', '15.5 / 400'], ['Small', 'font-size:14px;color:var(--fg-2)', 'A ₹4,299 price needs proof of quality for new buyers.', '14 / 400'], ['Label', 'font-size:12px;font-weight:600', 'Store', '12 / 600']].map(([n, st, s, m]) => `<div><span>${n}</span><p style="${st}">${s}</p><em>${m}</em></div>`).join('')}</div>
      <h2>Rules</h2>
      ${rules(['Never below 11px (story names and action labels on a phone).', 'Inputs are 16px on a phone, or iOS zooms the page.', 'Titles use ' + tok('--h-track') + ' (−0.005em); long card titles clamp to two lines.', 'Weights in use: 400, 500, 600, 700. Titles never go heavier than 600.'])}` },

    { g: 'Foundations', id: 'shape', t: 'Shape and depth', lede: 'Round, soft corners and almost no shadow. Depth is only for things that float over the page.', body: () => `
      <h2>Radius</h2>
      <div class="demo"><div class="boxes">${[['--r-btn', '10px · buttons'], ['--r-card', '18px · cards'], ['--r-feed', '24px · feed card'], ['--r-pill', 'Pill · chips']].map(([v, n]) => `<div><i style="border-radius:var(${v});${v === '--r-pill' ? 'height:44px;width:120px' : ''}"></i>${n}</div>`).join('')}</div></div>
      <h2>Shadow</h2>

  // ---------- sidebar and routing: one page at a time ----------
  const groups = [...new Set(PAGES.map(p => p.g))];
  $('nav').innerHTML = groups.map(g => `<h6>${g}</h6>` + PAGES.filter(p => p.g === g).map(p => `<a href="#${p.id}" data-id="${p.id}">${p.t}</a>`).join('')).join('') + '<h6>Also</h6><a href="app.html">Prototype</a><a href="flows.html">Flow map</a>';

  function show(){
    const i = Math.max(0, PAGES.findIndex(p => p.id === location.hash.slice(1))), p = PAGES[i], prev = PAGES[i - 1], next = PAGES[i + 1];
    $('main').innerHTML = `<article class="dpage"><div class="crumb">${p.g}</div><h1>${p.t}</h1><p class="lede">${p.lede}</p>${p.body()}</article>
      <nav class="pager">${prev ? `<a href="#${prev.id}"><small>Previous</small><b>${prev.t}</b></a>` : ''}${next ? `<a class="next" href="#${next.id}"><small>Next</small><b>${next.t}</b></a>` : ''}</nav>`;
    document.querySelectorAll('.dnav a').forEach(a => a.classList.toggle('on', a.dataset.id === p.id));
    document.title = `${p.t} · Jammie design system`;
    readTokens(); window.jammieIcons(); scrollTo(0, 0); setNav(false);
  }
  // swatches show what the current theme resolves to
  function readTokens(){ const cs = getComputedStyle(root);
    document.querySelectorAll('[data-tok]').forEach(el => { el.textContent = `${el.dataset.tok} · ${cs.getPropertyValue(el.dataset.tok).trim()}`; }); }

  // ---------- light or dark: the same saved choice the prototype and flow map read ----------
  const KEY = 'jammie-workbench-v5';
  const saved = () => { try { return (JSON.parse(localStorage.getItem(KEY)) || {}).theme; } catch { return null; } };
  function paint(t){ root.dataset.theme = t; $('themeBtn').setAttribute('aria-label', t === 'dark' ? 'Light theme' : 'Dark theme'); }
  paint(new URLSearchParams(location.search).get('theme') || saved() || 'light');
  $('themeBtn').addEventListener('click', () => { const t = root.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem(KEY, JSON.stringify({ theme: t })); } catch {} paint(t); show(); });

  // ---------- the Markdown: fetched once, so a click copies it at once ----------
  let md = null;
  fetch('skill/jammie-design/SKILL.md').then(r => r.ok ? r.text() : null).then(t => { md = t && t.replace(/^---[\s\S]*?---\s*/, ''); }).catch(() => {});
  function flash(msg){ const f = $('flash'); f.querySelector('span').textContent = msg; f.classList.add('show'); clearTimeout(flash.t); flash.t = setTimeout(() => f.classList.remove('show'), 1800); }
  // the clipboard API first; where a browser refuses it, the older select-and-copy
  const oldCopy = text => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.append(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); if (!ok) throw new Error('blocked'); };
  const copy = (text, msg) => (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).catch(() => oldCopy(text)).then(() => flash(msg), () => flash('The browser blocked the copy'));
  const copyMd = () => md ? copy(md, 'Markdown copied') : flash('Open this page from a server to copy the Markdown');
  $('copyMd').addEventListener('click', copyMd);

  // ---------- the sidebar on a phone ----------
  function setNav(open){ document.body.classList.toggle('nav-open', open); $('menuBtn').setAttribute('aria-expanded', open); }
  $('menuBtn').addEventListener('click', () => setNav(!document.body.classList.contains('nav-open')));
  $('shade').addEventListener('click', () => setNav(false));
  addEventListener('keydown', e => { if (e.key === 'Escape') setNav(false); });
  addEventListener('scroll', () => $('top').classList.toggle('scrolled', scrollY > 4), { passive: true });

  document.addEventListener('click', e => {
    const t = e.target, d = t.closest('[data-do],[data-copy]');
    if (d && d.hasAttribute('data-copy')) return copy(d.parentElement.innerText.replace(/^Copy\s*/, ''), 'Copied');
    if (d && d.dataset.do === 'copymd') return copyMd();
    if (d && d.dataset.do === 'icon') return copy(`<i data-ico="${d.dataset.id}"></i>`, `Copied ${d.dataset.id}`);
    if (d && d.dataset.do === 'play') { const m = $(d.dataset.id); m.classList.remove('run'); void m.offsetWidth; m.classList.add('run'); return; }
    // the examples are live, but they never leave this page
    if (!t.closest('.demo')) return;
    if (t.closest('a')) e.preventDefault();
    const like = t.closest('[data-like],[data-do="unsave"]'); if (like) like.classList.toggle('liked');
    const sw = t.closest('.switch'); if (sw) sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') !== 'true');
    const chip = t.closest('.chip'); if (chip) chip.classList.toggle('on');
    const sg = t.closest('.seg button'); if (sg) sg.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === sg));
    const st = t.closest('.step button'); if (st) { const n = $('stepN'); n.textContent = Math.max(1, +n.textContent + (st.getAttribute('aria-label') === 'More' ? 1 : -1)); }
  });

  window.jammieIcons();
  addEventListener('hashchange', show);
  show();
})();
</script>
